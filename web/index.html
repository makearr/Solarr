<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solarr</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Before first paint, or a dark-mode user sees a light flash. -->
    <script>
      (() => {
        /* Kept in step with THEMES in src/lib/theme.ts. Duplicated deliberately:
           this runs before any module loads, which is the whole point. */
        const DARK = ["dark", "jellyfin", "arr", "nord", "lidarr-dark", "sonarr-dark", "radarr-dark"];
        try {
          const stored = localStorage.getItem("solarr.theme");
          const theme = stored
            || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle("dark", DARK.includes(theme));
        } catch {
          /* Private mode denies storage; the OS preference still applies. */
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
