<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediaNexus</title>
    <!--
      The theme is applied before first paint. Doing it in React would show a
      light flash on every load for a user who chose dark, which reads as a bug.
    -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("medianexus.theme");
          const dark = stored ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch {
          /* Private mode denies storage; the OS preference still applies. */
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
