# Mirrors `make verify`, calling the toolchains directly rather than in Docker.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Before the Go build: go:embed folds the result into the binary.
      # `npm run build` lints and tests first (documentation/web-interface.md).
      - name: Build the web interface
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # ADR-30: the binary stays pure Go so the image can bundle its media tools
      # instead of linking them.
      - name: Build without CGO
        run: CGO_ENABLED=0 go build ./...

      - name: Formatting
        run: |
          unformatted=$(gofmt -l -s .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          # The prebuilt binary lags the Go version in go.mod; build it with the runner's toolchain.
          install-mode: goinstall

      - name: Test
        run: go test -race -count=1 ./...

      # ADR-31: generated code is committed. Stale output fails the build.
      - name: sqlc up to date
        run: |
          [ -f sqlc.yaml ] || { echo "no sqlc.yaml yet, skipping"; exit 0; }
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@latest diff

      - name: Generated API up to date
        run: |
          [ -f api/openapi.yaml ] || { echo "no spec yet, skipping"; exit 0; }
          make api
          git diff --exit-code || { echo "generated API is stale; run 'make api'"; exit 1; }

      # The bundle is generated and gitignored, so building it must leave the
      # tree clean. If it does not, something generated is being tracked.
      - name: The web build leaves the tree clean
        run: git status --porcelain --untracked-files=all | grep . && exit 1 || exit 0

  benchmarks:
    runs-on: ubuntu-latest
    # ADR-28: performance targets are enforced here, not by intention.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Benchmarks
        # -p 1 and its own job: a latency assertion measures whatever else is running.
        env:
          SOLARR_BENCH: "1"
        run: go test -count=1 -p 1 -run=TestADR28 -bench=. -benchmem -timeout 60m ./...
