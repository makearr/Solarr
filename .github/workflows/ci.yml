# Mirrors `make verify`. The Makefile runs these toolchains in Docker because
# the development machine has no Go installed; the runner has one, so CI calls
# them directly rather than nesting containers.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Before the Go build, because go:embed folds the result into the binary.
      # Building it here also means a TypeScript error fails CI rather than
      # surfacing when someone next runs `make web`.
      # `npm run build` lints and tests first: the rules of hooks are invisible to
      # tsc, so a hook called after an early return compiles cleanly and fails at
      # runtime, and the list core's selection and pagination logic is pure
      # enough to test but too central to leave untested.
      - name: Build the web interface
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # ADR-30: the binary stays pure Go so the image can bundle its media tools
      # instead of linking them.
      - name: Build without CGO
        run: CGO_ENABLED=0 go build ./...

      - name: Formatting
        run: |
          unformatted=$(gofmt -l -s .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Test
        run: go test -race -count=1 ./...

      # ADR-31: generated code is committed. Stale output fails the build.
      - name: sqlc up to date
        run: |
          [ -f sqlc.yaml ] || { echo "no sqlc.yaml yet, skipping"; exit 0; }
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@latest diff

      - name: Generated API up to date
        run: |
          [ -f api/openapi.yaml ] || { echo "no spec yet, skipping"; exit 0; }
          make api
          git diff --exit-code || { echo "generated API is stale; run 'make api'"; exit 1; }

      # The bundle is generated and gitignored, so building it must leave the
      # tree clean. If it does not, something generated is being tracked.
      - name: The web build leaves the tree clean
        run: git status --porcelain --untracked-files=all | grep . && exit 1 || exit 0

  benchmarks:
    runs-on: ubuntu-latest
    # ADR-28: performance targets are enforced here, not by intention.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Benchmarks
        run: go test -run=^$ -bench=. -benchmem ./...
