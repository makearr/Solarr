# Example deployment. Copy, adjust the paths, and run `docker compose up -d`.
services:
  medianexus:
    image: ghcr.io/makearr/medianexus:latest
    container_name: medianexus
    restart: unless-stopped

    # Who the application runs as. Set these to whoever owns the volumes below.
    #
    # The container starts as root, takes ownership of /config, drops to this
    # user, and never runs as root again.
    #
    # MediaNexus takes ownership of /config only. Your library and downloads are
    # yours: it will not rewrite their ownership -- that would mean touching
    # hundreds of thousands of files on every start, and they are not its files
    # to change. If they do not match, startup says so plainly, naming the path,
    # its owner and this process's identity, and then carries on. Fixing it is
    # your call: `chown -R 1000:1000 /your/media`, or set PUID and PGID to
    # whoever already owns it.
    environment:
      PUID: 1000
      PGID: 1000

    ports:
      - "8080:8080"

    volumes:
      # Config, databases, backups and cache. One mount is enough.
      #
      # Keep this on local storage. SQLite's WAL mode is unsupported on NFS and
      # SMB, and their locking is unreliable enough to corrupt a database.
      # MediaNexus does not check this -- it is yours to get right. Media,
      # downloads and backups may live anywhere.
      - ./config:/config

      # The library. Import prefers a reflink, then a hardlink, then a copy
      # (ADR-11), and hardlinking only works within one filesystem -- so
      # downloads and the library want to be on the same mount, not two.
      - /media:/media

      # The download client's completed directory, at the same path the client
      # reports. A mismatch here is why an import cannot find its files.
      - /downloads:/downloads

    # The image declares its own healthcheck, so nothing needs supplying here.

    # No cap_add, cap_drop or security_opt. Docker's default capability set
    # already contains everything the startup sequence uses -- CHOWN and
    # DAC_OVERRIDE to take ownership of /config, SETUID and SETGID to stop being
    # root -- so the common case needs no tuning, which is how the *Arr images
    # people are coming from behave.
    #
    # Hardening is still available and still works; it just is not the default
    # here. `cap_drop: ALL` needs those four added back, and `user: "1000:1000"`
    # needs none of them because it never becomes root in the first place -- but
    # then the volumes must already be owned correctly, since a process that is
    # not root cannot fix them.
