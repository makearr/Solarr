# Example deployment. Copy, adjust the paths, and run `docker compose up -d`.
services:
  medianexus:
    image: ghcr.io/makearr/medianexus:latest
    container_name: medianexus
    restart: unless-stopped

    # Who the application runs as. Two ways, and they are mutually exclusive.
    #
    # This one -- PUID/PGID -- is the convenient one and what most NAS setups
    # want. The container starts as root, takes ownership of /config, drops to
    # this user, and never runs as root again. It needs the four capabilities
    # below to do that.
    environment:
      PUID: 1000
      PGID: 1000

    # The other way is `user: "1000:1000"`, which starts unprivileged and skips
    # both the chown and the drop. It is the tighter option and needs no added
    # capabilities at all -- but the volumes must already be owned by that user,
    # because a process that is not root cannot fix them. Setting `user:`
    # overrides PUID/PGID entirely rather than combining with them.

    ports:
      - "8080:8080"

    volumes:
      # Config, databases, backups and cache. One mount is enough.
      #
      # Keep this on local storage. SQLite's WAL mode is unsupported on NFS and
      # SMB, and their locking is unreliable enough to corrupt a database.
      # MediaNexus does not check this -- it is yours to get right. Media,
      # downloads and backups may live anywhere.
      - ./config:/config

      # The library. Import prefers a reflink, then a hardlink, then a copy
      # (ADR-11), and hardlinking only works within one filesystem -- so
      # downloads and the library want to be on the same mount, not two.
      - /media:/media

      # The download client's completed directory, at the same path the client
      # reports. A mismatch here is why an import cannot find its files.
      - /downloads:/downloads

    # The image declares its own healthcheck, so nothing needs supplying here.

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Exactly what the startup sequence needs and nothing else, verified against
    # the built image: CHOWN and DAC_OVERRIDE to take ownership of a volume the
    # runtime user does not own yet, SETUID and SETGID to stop being root.
    #
    # Delete all four if you use `user:` instead -- with no root to drop from,
    # none of them is reachable.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
