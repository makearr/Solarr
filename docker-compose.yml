# Example deployment. Copy, adjust the paths, and run `docker compose up -d`.
# See documentation/container-runtime.md.
services:
  solarr:
    image: makearr/solarr:latest
    container_name: solarr
    restart: unless-stopped

    environment:
      # Who the app runs as, and who owns everything it writes. 1000:1000 when unset.
      PUID: 1000
      PGID: 1000
      # Air dates and log timestamps are timezone-dependent.
      TZ: Europe/Berlin
      # Optional; every variable is listed in documentation/environment-variables.md.
      # SOLARR_PORT: 5454
      # SOLARR_ROOT_FOLDERS: Music=/media/music,TV=/media/tv
      # SOLARR_TMDB_API_KEY: ""

    ports:
      - "5454:5454"

    # Optional: GPU encoding for the built-in player's conversions (documentation/media-player.md).
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "991"   # the host's render group: getent group render

    volumes:
      # Config, databases, backups and cache. Keep on local storage: SQLite WAL
      # is unsupported on NFS and SMB.
      - ./config:/config

      # The library. Hardlinking only works within one filesystem, so this and
      # the downloads below want to be on the same mount.
      - /media:/media

      # At the same path the download client reports, or imports cannot find files.
      - /downloads:/downloads

    # No cap_add, cap_drop or security_opt: Docker's defaults already cover it.
    # Do not set `user:` -- it is the one thing that stops PUID/PGID working.
