  /categories/{id}/rename:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: renameLibrary
      tags: [library]
      summary: Preview or apply the library's naming to its files, on every root it uses. Administrator only.
      description: >-
        Lidarr's "apply to library", and with work_id its "preview rename"
        of one album or series. One rename per root folder, each
        through the move engine (ADR-51), so read-only roots refuse unless
        they allow renaming. Only works in this library are touched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preview: { type: boolean, default: false }
                work_id: { type: integer, format: int64, description: Only this work's files; a work of another library renames nothing. }
      responses:
        "200":
          description: One plan per root folder.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryRenamePlan" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /categories/{id}/duplicates:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getCategoryDuplicates
      tags: [library]
      summary: Tracks one library holds more than once, found by artist, title and length (read only).
      description: >-
        Files that are one recording (the same artist and title, lengths within a few seconds), in whatever format and on
        whichever album, with the copy to keep: the one that meets the library's target quality, else its profiles' first
        choice. Nothing is changed by looking; the groups with the most to free come first.
      responses:
        "200":
          description: The groups, largest reclaimable first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuplicateReport" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /categories/{id}/duplicates/resolve:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: resolveCategoryDuplicates
      tags: [library]
      summary: Keep one copy of a duplicated track and link or recycle the others (manage access).
      description: >-
        Each dropped copy either has every path turned into a link (reflink, else hardlink) to the kept copy, so the
        album folders it was in stay complete, or goes to the recycle bin. A link needs the same file extension as a path
        of the kept copy and the same filesystem; a copy that cannot be linked is left alone and reported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keep_media_object_id, drop]
              properties:
                keep_media_object_id: { type: integer, format: int64 }
                drop:
                  type: array
                  items:
                    type: object
                    required: [media_object_id, action]
                    properties:
                      media_object_id: { type: integer, format: int64 }
                      action: { type: string, enum: [link, recycle] }
      responses:
        "200":
          description: What was done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuplicateResolution" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /categories/{id}/links:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getCategoryLinks
      tags: [library]
      summary: Preview linking the identical copies one library holds (read only).
      description: >-
        A file stored at two paths of this library (the scan merges identical bytes into one media object) can share its
        bytes: the second path becomes a reflink of the first where the filesystem offers it, else a hardlink. This is the
        plan, with the method probed per pair; nothing is changed by looking. Roots that are offline, not writable or
        read-only are left out, and so are pairs on different filesystems.
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkPreview" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: linkCategoryCopies
      tags: [library]
      summary: Link the identical copies of one library (manage access).
      description: >-
        Queues the run: a fresh plan, then each pair is compared byte for byte again and its second path swapped for the
        link atomically. A pair that differs is left alone. Running twice queues once.
      responses:
        "202": { description: Queued. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /categories/{id}/statistics:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getCategoryStatistics
      tags: [library]
      summary: One library's statistics, as the last rollup computed them (section 21.12).
      description: >-
        Composition, completeness and acquisition figures read from stat_rollup; nothing is aggregated
        live. Empty, with no computed_at, until the first rollup has run. Needs read access to the library.
      responses:
        "200":
          description: The figures.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryStatistics" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /categories/{id}/rootfolders:
