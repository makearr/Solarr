          description: The preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowPreview" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }

  /organisations/{id}/follow:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listOrganisationFollows
      tags: [people]
      summary: The caller's follows of this organisation, one per library.
      responses:
        "200":
          description: The follows.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Follow" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: followOrganisation
      tags: [people]
      summary: Follow the organisation into one library, or change the follow there; what it admits is added automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FollowRequest" }
      responses:
        "200":
          description: The follow as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Follow" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: unfollowOrganisation
      tags: [people]
      summary: Stop following in one library. What was added stays.
      parameters:
        - name: category_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Unfollowed. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /organisations/{id}/follow/preview:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: previewOrganisationFollow
      tags: [people]
      summary: What following the organisation into one library would add right now, without following.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FollowRequest" }
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowPreview" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }

  /people/{id}/known-for:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listPersonKnownFor
      tags: [people]
      summary: What the providers know a person for, newest first, each marked with the library's work when it holds it.
      description: >-
        Asked of the library's media type live (TMDB for TV, with a key); empty for a type whose providers say nothing
        more. It may also fill in the person's dates and biography.
      parameters:
        - name: category
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The titles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KnownFor" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }

  /organisations:
    get:
      operationId: listOrganisations
      tags: [people]
      summary: A page of the labels, networks, studios and publishers of one library, or of every library the caller may read.
      parameters:
        - name: category
          in: query
          schema: { type: integer, format: int64 }
        - name: role
          in: query
          description: Comma-separated roles (network, label, studio, publisher); any when absent.
          schema: { type: string }
        - name: monitored
          in: query
          schema: { type: boolean }
        - name: q
          in: query
          description: Matches the start of the name.
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [name, works, latest], default: name }
        - name: dir
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganisationPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /organisations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getOrganisation
      tags: [people]
      summary: One organisation, with its works in each library the caller may read.
      responses:
        "200":
          description: The organisation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganisationDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /people:
    get:
      operationId: listPeople
      tags: [people]
      summary: A page of people of one library, or of every library the caller may read (ADR-32).
      parameters:
        - name: category
          in: query
          description: One library; absent is every library the caller may read.
          schema: { type: integer, format: int64 }
        - name: role
          in: query
          description: Comma-separated credit roles, as the media types declare them; any when absent.
          schema: { type: string }
        - name: where
          in: query
          description: >-
            A custom filter, a JSON array of conditions (field, op, value) that must all hold. Fields: name and
            country (text), monitored and photo (bool), works, wanted and complete (number), role (one of the roles).
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [name, works, latest, added], default: name }
        - name: dir
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: cursor
          in: query
          description: >-
            From `next_cursor` of the previous page. Absent on the first page.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: monitored
          in: query
          schema: { type: boolean }
        - name: q
          in: query
          description: Matches the start of the sort name.
          schema: { type: string }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /people/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getPerson
      tags: [people]
      summary: One person, with what they did in each library the caller may read.
      description: >-
        404 when no library the caller may read credits or follows them (ADR-27: hidden is not found).
      responses:
        "200":
          description: The person's detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /images/remote:
    get:
      operationId: getRemoteImage
      tags: [people]
      summary: A provider's picture (poster, photo, logo) from Solarr's own cache, fetched once on first use.
      description: >-
        Only the metadata providers' image hosts are served (TMDB, TheTVDB, TVmaze, AniList, Fanart.tv), over https;
        anything else is refused. The picture is resized and stored like cover art and evicted by the cache budget.
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string }
        - name: size
          in: query
          schema: { type: string, enum: [thumb, small, full], default: small }
      responses:
        "200":
          description: The picture as WebP.
          content:
            image/webp: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /people/{id}/artwork:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getPersonArtwork
      tags: [people]
      summary: A person's cached Wikidata image, if one was found.
      description: >-
        WebP bytes straight from the on-disk cache EnrichJob wrote from the
        artist's own Wikidata P18 claim, when they have one -- most people do
        not, so 404 is the common case, indistinguishable from "no such
        person" the same way GET /works/{id}/artwork's own 404 is. An
        album's own cover falls back to this same image when the album has
        none of its own (that fallback lives in GET /works/{id}/artwork
        itself, not here).
      parameters:
        - name: size
          in: query
          schema: { type: string, enum: [thumb, small, full], default: small }
      responses:
        "200":
          description: The image.
          content:
            image/webp:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

    put:
      operationId: choosePersonArtwork
      tags: [library]
      summary: Make one of the offered pictures this person's image; it is kept over later refreshes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImagePick" }
      responses:
        "204": { description: The image was replaced. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }

  /people/{id}/artwork/options:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getPersonArtworkOptions
      tags: [library]
      summary: The pictures providers hold for this person, to pick one from.
      description: >-
        Asked of the providers live (TheAudioDB, Wikidata), so it can be slow; a provider that is down is
        left out as long as another answered.
      responses:
        "200":
          description: The options, possibly none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageOptions" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }

  /blocklist:
    get:
      operationId: listBlocklist
      tags: [library]
      summary: Releases that failed and will not be grabbed again (section 10.11).
      description: >-
        Cursor-paged, newest first. An automatic entry carries an expiry and
        ages out on its own; a manual one is permanent until removed here.
      parameters:
        - name: after
          in: query
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: One page of entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlocklistPage" }
        "401": { $ref: "#/components/responses/Problem" }

  /history:
    get:
      operationId: listHistory
      tags: [library]
      summary: What happened to downloads -- grabbed, imported, failed (section 5.7).
      description: >-
        Cursor-paged, newest first, only for libraries the caller can read. With
        work_id, one album's history. A page may hold fewer entries than asked
        for and still carry a next cursor, when entries from hidden libraries
        were skipped.
      parameters:
        - name: after
          in: query
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: work_id
          in: query
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: One page of entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryPage" }
        "401": { $ref: "#/components/responses/Problem" }

  /queue:
    get:
      operationId: listQueue
      tags: [library]
      summary: Downloads in flight and every enabled download client's own queue, read live.
      description: >-
        Lidarr's Activity -> Queue. Only downloads for libraries the caller can
        read; clients are listed for everyone who can see any. With work_id, one
        album's downloads.
      parameters:
        - name: work_id
          in: query
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The queue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Queue" }
        "401": { $ref: "#/components/responses/Problem" }

  /queue/{id}:
    delete:
      operationId: removeQueueItem
      tags: [library]
      summary: Remove a download from its client with its files; manage on its library.
      description: >-
        With blocklist the release is never grabbed again and the album is
        searched for another. A download already being imported is refused.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: blocklist
          in: query
          schema: { type: boolean, default: false }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /queue/clients/{id}/{action}:
    post:
      operationId: setQueueClientPaused
      tags: [library]
      summary: Pause or resume Solarr's own downloads in one client. Administrator only.
      description: >-
        Only the downloads Solarr sent that are still queued or downloading;
        the client itself and anything other apps sent carry on.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [pause, resume] }
      responses:
        "204": { description: Done. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /blocklist/{id}:
    delete:
      operationId: removeBlocklistEntry
      tags: [library]
      summary: Let a release be grabbed again. Administrator only.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /crossovers:
    get:
      operationId: listCrossovers
      tags: [library]
      summary: A library's crossover events, and episodes that look like one broadcast listed under two series.
      parameters:
        - { name: category_id, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: The events and the suggestions.
          content:
            application/json:
              schema:
                type: object
                required: [events, suggestions]
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/Crossover" } }
                  suggestions: { type: array, items: { $ref: "#/components/schemas/SameContentSuggestion" } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createCrossover
      tags: [library]
      summary: Record an event across series, its episodes in watch order. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrossoverWrite" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Crossover" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /crossovers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getCrossover
      tags: [library]
      summary: One crossover event.
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Crossover" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateCrossover
      tags: [library]
      summary: Rename an event and set its episodes, in order. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrossoverWrite" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Crossover" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteCrossover
      tags: [library]
      summary: Forget an event; its episodes stay as they are. Administrator only.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /crossovers/{id}/monitor:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: monitorCrossover
      tags: [library]
      summary: Monitor or unmonitor every episode of an event, each season following. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monitored]
              properties:
                monitored: { type: boolean }
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Crossover" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /works/{id}/crossovers:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getWorkCrossovers
      tags: [library]
      summary: The events a work's episodes are in, and its episodes listed as the same broadcast as another series'.
      responses:
        "200":
          description: The events and the links.
          content:
            application/json:
              schema:
                type: object
                required: [events, same_content]
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/Crossover" } }
                  same_content: { type: array, items: { $ref: "#/components/schemas/SameContentLink" } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /parts/{id}/same-content:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: linkSameContent
      tags: [library]
      summary: Record two episodes as one broadcast, so one file holds both. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [part_id]
              properties:
                part_id: { type: integer, format: int64 }
      responses:
        "204": { description: Linked. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: unlinkSameContent
      tags: [library]
      summary: Forget two episodes were one broadcast. Administrator only.
      parameters:
        - { name: part_id, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Unlinked. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /works/{id}/numbering:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getWorkNumbering
      tags: [library]
      summary: The lists a work can be numbered by (a series by TheTVDB's DVD or absolute order) and the one it is.
      responses:
        "200":
          description: The choices.
          content:
            application/json:
              schema:
                type: object
                required: [choices, current]
                properties:
                  current: { type: string }
                  choices:
                    type: array
                    items:
                      type: object
                      required: [key, label]
                      properties:
                        key: { type: string }
                        label: { type: string }
        "204": { description: The work's type has no other numbering, or it is not known for this work. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: setWorkNumbering
      tags: [library]
      summary: Number a work by another list, or preview it. Administrator only.
      description: >-
        Its parts move to their places in that list, keeping their files, history and ids, and the choice holds for
        every later refresh. A part the list has no place for whose place it gives to another is set aside, its files
        kept. Files keep their names until renamed (the work's Rename preview).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [basis]
              properties:
                basis: { type: string }
                preview: { type: boolean, default: false }
      responses:
        "200":
          description: What moved, or would move.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NumberingPlan" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /works/{id}/merge-suggestion:
    get:
      operationId: getWorkMergeSuggestion
      tags: [library]
      summary: The work this one was found to be (an album held twice), if any. Administrator only.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The suggestion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkMergeSuggestion" }
        "204": { description: Nothing suggested. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /works/{id}/merge:
    post:
      operationId: mergeWork
      tags: [library]
      summary: Fold this work into another of its type. Administrator only.
      description: >-
        Its files, wanted state, downloads, imports, requests, tags and history move onto the other work, its ids
        and title become the other's aliases, and it is deleted. With preview nothing changes and the answer says
        what would move.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [into]
              properties:
                into: { type: integer, format: int64 }
                preview: { type: boolean, default: false }
      responses:
        "200":
          description: What moved, or would move.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkMerge" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /works/{id}/remove:
    post:
      operationId: removeWork
      tags: [library]
      summary: Stop wanting a work, optionally delete its files and keep it from being added back. Administrator only.
      description: >-
        Deletes every desired item for the work, and the work itself only when
        the library holds no files for it -- with files on disk the next scan
        would recreate it, so deleting the row would be a lie. Files are kept
        unless delete_files says otherwise, and even then they go to
        recycle bin (section 10.8): nothing is ever deleted outright, so a
        mistaken delete stays recoverable for the retention window.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                delete_files:
                  type: boolean
                  default: false
                  description: Also move every file of this album into the recycle bin.
                exclude:
                  type: boolean
                  default: false
                  description: >-
                    Do not add it back: follows and import lists leave it out, and so does the scan of a type whose
                    scan honours exclusions (TV), which removes the work although its files stay.
      responses:
        "200":
          description: What was removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoveWorkResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /works/{id}/parts/{partId}/remove:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: partId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: removePart
      tags: [library]
      summary: Stop wanting one track, and optionally delete its file. Administrator only.
      description: >-
        Unmonitors the track, shrinking the album's required_count, and stops
        wanting it on its own if it was. The file is kept unless delete_files
        says otherwise, and even then it goes to the recycle bin (section 10.8).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                delete_files:
                  type: boolean
                  default: false
                  description: Also move this track's file into the recycle bin.
      responses:
        "200":
          description: What was removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemovePartResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /people/{id}/search:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: searchPersonMissing
      tags: [acquisition]
      summary: >-
        Search every monitored, incomplete album of this artist, in the
        background (the artist page's "Search all missing").
      responses:
        "202":
          description: Enqueued (or already running -- duplicate says which).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategorySearchEnqueued" }
        "404": { $ref: "#/components/responses/Problem" }

  /people/{id}/refresh:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: refreshPerson
      tags: [library]
      summary: >-
        Fetch the artist's details, image and albums again, past the metadata
        cache, then rescan their folders as each library's "Rescan after
        refresh" says. Background; a second request while one runs is folded in.
      responses:
        "202":
          description: Enqueued (or already running -- duplicate says which).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategorySearchEnqueued" }
        "404": { $ref: "#/components/responses/Problem" }

  /works/{id}/refresh:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: refreshWork
      tags: [library]
      summary: >-
        Read the work again from its sources, past the cache. An album is refreshed in the background (a second
        request while one runs is folded in); a series at once, adding new episodes. Request on its library.
      responses:
        "409": { $ref: "#/components/responses/Problem" }
        "202":
          description: Enqueued (or already running -- duplicate says which).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategorySearchEnqueued" }
        "404": { $ref: "#/components/responses/Problem" }

  /people/{id}/monitor-all:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: monitorPersonAll
      tags: [library]
      summary: Monitor every album of this artist's discography. Administrator only.
      responses:
        "200":
          description: How many albums are now monitored.
          content:
            application/json:
              schema:
                type: object
                required: [albums]
                properties:
                  albums: { type: integer, format: int64 }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /people/{id}/remove:
    post:
      operationId: removePerson
      tags: [library]
      summary: Stop following an artist and forget them. Administrator only.
      description: >-
        Unsubscribes the caller, unmonitors, and deletes the person row and
        its credits. **Files on disk are never touched**: removing an artist
        is about no longer following them, not about deleting music. Their
        albums stay in the library as works, since a work belongs to the
        library rather than to the person credited on it -- delete those
        separately if they are unwanted.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /events:
    get:
      operationId: streamEvents
      tags: [events]
      summary: Server-sent events, filtered by category access.
      description: >-
        Events are lossy and for notification only; anything that must happen is
        a job. Progress is coalesced on a 250ms tick. Resume with `Last-Event-ID`;
        replay is best-effort over a bounded ring, and a client too far behind
        receives a `resync` event rather than a silently partial history.
      parameters:
        - name: topics
          in: query
          description: >-
            Comma-separated subset of topics. Absent means every topic the caller
            may see. An unrecognised name is rejected rather than ignored, so a
            typo is not a silently empty stream.
          required: false
          schema:
            type: array
            items: { $ref: "#/components/schemas/EventTopic" }
          style: form
          explode: false
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The stream. It does not end until the client disconnects.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: solarr_session
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key

  parameters:
    SearchGroup:
      name: group
      in: query
      description: The group of the work a search is for, by its ref (a season); absent is the work's own item.
      schema: { type: string }
    SearchPart:
      name: part
      in: query
      description: The one part a search is narrowed to, by its id; the group holding it is what is searched.
      schema: { type: integer, format: int64 }

  responses:
    Problem:
      description: An RFC 7807 problem.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }

    ReadyStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ready] }

    LogoutStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [signed-out] }

    Problem:
      type: object
      description: RFC 7807. Every error uses this, including 404 and 405.
      required: [type, title, status]
      properties:
        type:
          description: >-
            A stable slug, not a resolvable URL, so a client can branch on it
            without following a link. Renaming one is a breaking change.
          $ref: "#/components/schemas/ProblemType"
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    ProblemType:
      type: string
      enum:
        - not-found
        - forbidden
        - conflict
        - bad-request
        - method-not-allowed
        - unavailable
        - internal
        - unauthorized

    BuildInfo:
      type: object
      required: [version, commit, build_date, source_url, license, sqlite_driver]
      properties:
        version: { type: string, example: "26.09.1.35" }
        milestone:
          type: string
          example: "music, usenet"
          description: >-
            A name, not a version component (documentation/versioning.md). Empty
            until set with `make milestone NAME="name"`.
        commit:
          type: string
          description: >-
            Reported as `unknown` rather than a plausible-looking wrong value
            when it could not be determined; the source link depends on it.
        build_date: { type: string, format: date-time }
        source_url:
          type: string
          format: uri
          description: >-
            The Corresponding Source for *this* build. A modified build must not
            point at upstream.
        license: { type: string, example: "AGPL-3.0-or-later" }
        sqlite_driver:
          type: string
          example: "modernc"
          description: >-
            Which SQLite implementation this binary was built with (ADR-5). A build
            property, not a setting: it is chosen by a build tag.
        server_time:
          type: string
          format: date-time
          description: >-
            The server's wall clock at the moment of the response. Schedules,
            air dates and retention run on this clock, not the viewer's, and
            on a remote host the two routinely differ.
        timezone:
          type: string
          example: "Europe/Fefobo"
          description: The server's configured zone, from TZ. `UTC` when unset.

    LegalText:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: Verbatim file content -- rendered as-is, never reformatted.

    CategoryGrant:
      type: object
      required: [category_id, permission]
      properties:
        category_id: { type: integer, format: int64 }
        permission: { $ref: "#/components/schemas/Permission" }

    UserAccount:
      type: object
      required: [id, username, role, has_password, created_at, access, tier, limits]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        has_password:
          type: boolean
          description: >-
            False for an account that authenticates by proxy header or API key,
            or the passwordless one an open-access install creates.
        created_at: { type: string, format: date-time }
        access:
          type: array
          items: { $ref: "#/components/schemas/CategoryGrant" }
        tier:
          $ref: "#/components/schemas/Tier"
        limits: { $ref: "#/components/schemas/UserLimits" }

    Tier:
      type: string
      enum: [normal, advanced, expert]

    UserLimits:
      type: object
      description: What an administrator decides for an account beyond its role and grants.
      required: [tier_default, tier_max, new_library_permission]
      properties:
        tier_default:
          $ref: "#/components/schemas/Tier"
        tier_max:
          $ref: "#/components/schemas/Tier"
        new_library_permission:
          $ref: "#/components/schemas/Permission"

    UserDefaults:
      type: object
      required: [new_library_permission]
      properties:
        new_library_permission:
          $ref: "#/components/schemas/Permission"

    BackupRetention:
      type: object
      required: [mode, keep_count, keep_days]
      properties:
        mode:
          type: string
          enum: [count, days]
          description: count keeps the newest keep_count backups; days keeps those younger than keep_days.
        keep_count:
          type: integer
          format: int64
          minimum: 3
          maximum: 1000
        keep_days:
          type: integer
          format: int64
          minimum: 1
          maximum: 3650
          description: The newest three backups stay whatever their age (ADR-15).

    AuthPolicy:
      type: object
      required: [auth_required, configured_mode, can_sign_in]
      properties:
        auth_required:
          type: boolean
          description: >-
            Whether a caller must present a credential. False serves every
            request as the administrator.
        administrator:
          type: string
          description: >-
            The account a login would use, when one exists. Shown rather than
            asked for: turning a login on sets a password on this account.
        can_sign_in:
          type: boolean
          description: >-
            Whether any account has a password. False means turning a login on
            must set one in the same request, or nobody could get back in.
        configured_mode:
          type: string
          enum: [local, proxy, apikey_only, none]
          description: >-
            How config.yml says callers authenticate when they must. Turning
            authentication back on restores this mode rather than guessing one.

    SetupStatus:
      type: object
      required: [needs_administrator, has_root_folder]
      properties:
        needs_administrator:
          type: boolean
          description: True while no account exists, which is the only time setup can be claimed.
        has_root_folder: { type: boolean }

    RootFolder:
      type: object
      required: [id, path, online]
      properties:
        id: { type: integer, format: int64 }
        path: { type: string }
        label: { type: string }
        online:
          type: boolean
          description: >-
            An unmounted root counts as unavailable, never as free space
            (Invariant 20a).
        read_only_detected:
          type: boolean
          description: The filesystem under this root is mounted read only, found by trying to write; the root is then read only whatever its policy says.
        vanished_held:
          type: integer
          format: int64
          description: Files the last full scan found gone and did not mark missing, too many at once to believe without a person; absent when none.
        writable:
          type: boolean
          description: >-
            Whether this process can write here. False is reported, never
            enforced: ownership on the host is the operator's to decide, and
            Solarr does not chown a library it did not create. Absent when
            it has not been probed.
        read_only:
          type: boolean
          description: >-
            Curated policy, not a probed fact: blocks new placement,
            upgrade-in-place and tag write-back, and blocks renaming unless
            allow_rename is also set (Invariant 69).
        allow_rename:
          type: boolean
          description: Overrides read_only for renaming alone (Invariant 69).
        total_bytes: { type: integer, format: int64 }
        free_bytes: { type: integer, format: int64 }
        min_free_bytes:
          type: integer
          format: int64
          description: The user's own reserve; placement refuses to dip below it.
        capacity_checked_at:
          type: string
          format: date-time
          description: Absent until the capacity job has run once for this root.
        filesystem_id:
          type: string
          description: >-
            Roots with the same id share one filesystem's space. Absent until the capacity job
            has run. Separate ZFS datasets of one pool have different ids yet share free space.
        categories:
          type: array
          items: { $ref: "#/components/schemas/RootFolderCategory" }
        drain_state:
          type: string
          enum: [NONE, DRAINING, PAUSED, DRAINED]
          description: ADR-51's own drain state machine.
        drain_job_id: { type: integer, format: int64 }

    RootFolderCategory:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }

    DownloadFolder:
      type: object
      description: >-
        One upstream-download destination (todo 4.18). Watched: each entry is
        imported once it has settled, once only.
      required: [id, path, readable, watch]
      properties:
        id: { type: integer, format: int64 }
        path: { type: string }
        label: { type: string }
        category_id:
          type: integer
          format: int64
          description: The library hint; absent means any library.
        watch: { type: boolean }
        transfer_ladder:
          type: array
          description: This folder's own transfer order; absent means the Import screen's.
          items: { type: string }
        readable:
          type: boolean
          description: >-
            Probed once, at creation. Nothing refreshes it after -- the same
            gap root_folder.writable had before the capacity job existed.
        readable_reason: { type: string }

    DownloadFolderEntry:
      type: object
      description: >-
        One top-level entry a live directory read found. Not matched
        against import state -- that comparison is stage 5's own job, not
        built yet, so this is a plain listing, not an "unimported files" view.
      required: [name, is_dir]
      properties:
        name: { type: string }
        is_dir: { type: boolean }

    PathListing:
      type: object
      description: >-
        One directory read live for the path picker: what was actually
        listed, its parent, and its own entries. The listed directory is
        not always the path asked for -- a partial path lists the nearest
        real directory above it, filtered by what has been typed so far.
      required: [path, entries]
      properties:
        path: { type: string, description: The directory that was listed. }
        parent:
          type: string
          description: The directory above it, absent at the filesystem root.
        entries:
          type: array
          items: { $ref: "#/components/schemas/PathEntry" }
        truncated:
          type: boolean
          description: True when the directory held more entries than were returned.

    PathEntry:
      type: object
      required: [name, path, is_dir]
      properties:
        name: { type: string }
        path: { type: string }
        is_dir: { type: boolean }

    Schedule:
      type: object
      description: One registered periodic task (ADR-59), its effective settings and run-state.
      required: [key, name, tier, category, default_cadence, cadences, enabled, supports_full, run_at_startup]
      properties:
        key: { type: string }
        name: { type: string }
        tier:
          type: string
          enum: [normal, advanced, expert]
          description: ADR-26's visibility tier.
        category:
          type: string
          enum: [library, metadata, downloads, statistics, maintenance]
          description: The group the scheduler screen shows the task under.
        default_cadence: { type: string, description: The registry's own fallback cadence. }
        cadences:
          type: array
          items: { type: string }
          description: Effective cadences -- a stored override if one exists, [default_cadence] otherwise.
        enabled: { type: boolean }
        run_at_startup:
          type: boolean
          description: >-
            Whether it runs once when Solarr starts. A heavy task (database maintenance, backup) waits a few minutes
            and is skipped when it last ran within its own interval.
        supports_full:
          type: boolean
          description: >-
            Whether POST /schedules/{key}/run?full=true does something different
            from an ordinary run for this task -- library scan's full rescan is
            the only one today (private/questions.md).
        last_run_at: { type: string, format: date-time }
        last_duration_ms: { type: integer, format: int64 }
        last_outcome:
          type: string
          enum: [enqueued, duplicate, error]
          description: Absent until the task has fired at least once.
        last_error: { type: string }
        next_run_at: { type: string, format: date-time }

    SettingDefinition:
      type: object
      description: >-
        One setting registered once in Go (ADR-26, todo 4.14) -- the single
        source for its tier, default and help text. Either a scalar
        instance_setting key, or (kind entity, since the non-scalar audit's
        own deep pass) a whole settings surface such as quality profiles or
        categories, which has no single value and so an always-empty default.
      required: [key, name, tier, kind, default]
      properties:
        key: { type: string }
        name: { type: string }
        tier:
          type: string
          enum: [normal, advanced, expert]
          description: ADR-26's visibility tier.
        kind:
          type: string
          enum: [string, int, float, bool, string_list, entity]
        default:
          type: string
          description: >-
            Encoded the same way the value itself is stored (a JSON array
            for string_list). Always empty for kind entity.
        help_text: { type: string }

    CacheReport:
      type: object
      description: The cache's own budgets and last-measured size per namespace (ADR-60).
      required: [max_bytes, max_age_days, images_share_percent, metadata_share_percent]
      properties:
        max_bytes: { type: integer, format: int64 }
        max_age_days: { type: integer, format: int64 }
        images_share_percent: { type: integer, format: int64 }
        metadata_share_percent: { type: integer, format: int64 }
        images_bytes:
          type: integer
          format: int64
          description: Absent until the cache maintenance task has run once.
        metadata_bytes:
          type: integer
          format: int64
          description: >-
            Logical bytes stored, a real measurement -- not metadata.db's own
            physical file size, which does not shrink on eviction without a
            VACUUM this codebase deliberately does not run.
        measured_at: { type: string, format: date-time }

    NetworkSettings:
      type: object
      description: >-
        ADR-58's own port resolution, proxy and IP whitelist. The whitelist
        can only ever deny -- it never authenticates and never grants
        (Invariant 89) -- and neither it nor the proxy does anything until
        its own enable flag is on.
      required:
        [port, in_effect_port, restart_required, proxy_enabled, proxy_bypass,
         allow_cidrs_enabled, allow_cidrs]
      properties:
        port:
          type: integer
          description: >-
            0 means nothing has been written from this screen yet --
            config.yml (or its own 5454 default) governs until it is.
        in_effect_port:
          type: integer
          description: The port this running instance actually bound to at startup.
        restart_required:
          type: boolean
          description: port disagrees with in_effect_port -- the change is stored but not live yet.
        proxy_enabled:
          type: boolean
          description: Off means proxy_url is ignored, whatever it holds.
        proxy_url:
          type: string
          description: Empty means no proxy. Scheme is http, https or socks5.
        proxy_bypass:
          type: array
          items: { type: string }
          description: CIDRs and host suffixes (".lan") that always go direct.
        allow_cidrs_enabled:
          type: boolean
          description: >-
            Off, the default, means every address is allowed however the list
            below is filled in.
        allow_cidrs:
          type: array
          items: { type: string }
          description: >-
            Prefilled with the private ranges on a fresh instance, so enabling
            the whitelist is one click rather than four lines of typing.

    NetworkSettingsUpdate:
      type: object
      description: The writable half of NetworkSettings.
      required: [port, proxy_enabled, proxy_bypass, allow_cidrs_enabled, allow_cidrs]
      properties:
        port: { type: integer }
        proxy_enabled: { type: boolean }
        proxy_url: { type: string }
        proxy_bypass: { type: array, items: { type: string } }
        allow_cidrs_enabled: { type: boolean }
        allow_cidrs: { type: array, items: { type: string } }

    QualityTarget:
      type: object
      required: [audio_codec, container, tolerance_pct]
      properties:
        id: { type: integer, format: int64, description: Absent when creating. }
        name: { type: string, description: What the target is called in a library's choice. }
        media_type: { type: string, description: The media type it serves; fixed once made. }
        crf: { type: number, description: 'The constant rate factor a file''s encoder settings state; a file at or below it meets it, one that states none is not held against it. 0 or absent when it does not care.' }
        audio_codec: { type: string, description: 'As ffprobe names it: aac, mp3, flac, opus. May be empty for a video target.' }
        container: { type: string, description: 'The file type: m4a, mp3, flac; mkv or mp4 for video. May be empty for a video target.' }
        resolution: { type: string, description: 'A video library''s target resolution, e.g. 1080p; empty when it does not care.' }
        video_codec: { type: string, description: 'e.g. h265, h264, av1; empty when it does not care.' }
        hdr: { type: string, description: 'sdr, hdr10, hdr10plus, dolby-vision or hlg; empty when it does not care.' }
        audio_channels: { type: string, description: 'Channel layout such as 2.0, 5.1, 7.1; empty when it does not care.' }
        audio_languages: { type: array, items: { type: string }, description: 'Language codes of which one is enough; empty when it does not care.' }
        subtitle_languages: { type: array, items: { type: string }, description: 'Language codes of which one is enough; empty when it does not care.' }
        audio_bitrate_kbps: { type: integer, format: int64, description: 'kbit/s, within tolerance_pct (25 when 0) of it.' }
        video_bitrate_kbps: { type: integer, format: int64, description: 'kbit/s, within tolerance_pct (25 when 0) of it.' }
        frame_rate: { type: number, description: 'Frames a second, within 2 %; 24 meets 23.976. 0 or absent when it does not care.' }
        bitrate_kbps:
          type: integer
          format: int64
          description: Absent for a lossless codec.
        tolerance_pct: { type: integer, format: int64, minimum: 0, maximum: 50 }

    RecycleBinContents:
      type: object
      required: [total_entries, total_bytes, entries]
      properties:
        total_entries: { type: integer, format: int64 }
        total_bytes: { type: integer, format: int64 }
        entries:
          type: array
          items: { $ref: "#/components/schemas/RecycleBinEntry" }
    RecycleBinEntry:
      type: object
      required: [id, original_path, reason, size_bytes, recycled_at, expires_at]
      properties:
        id: { type: integer, format: int64 }
        original_path: { type: string }
        reason: { type: string, description: "replaced, rejected_worse, junk, user_delete or failed_import." }
        size_bytes: { type: integer, format: int64 }
        recycled_at: { type: integer, format: int64, description: Unix seconds. }
        expires_at: { type: integer, format: int64, description: Unix seconds. }
    RecycleBinEmptied:
      type: object
      required: [removed, freed_bytes, failed]
      properties:
        removed: { type: integer, format: int64 }
        freed_bytes: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
    RecycleBinLimits:
      type: object
      required: [max_bytes, max_percent_of_root]
      properties:
        max_bytes:
          type: integer
          format: int64
          description: All recycle bins together, in bytes; the oldest entries go first. 0 is no limit.
        max_percent_of_root:
          type: integer
          format: int64
          description: A root's recycle bin as a percentage of the root; the oldest go first. 0 is no limit.

    LibraryQualityWrite:
      type: object
      required: [profile_ids]
      properties:
        profile_ids:
          type: array
          description: The profiles the library accepts, earlier preferred.
          items: { type: integer, format: int64 }
        cutoff_profile_id: { type: integer, format: int64 }
        target_id: { type: integer, format: int64, description: The target the library aims for; absent for none. }
        upgrades_allowed:
          type: boolean
          description: Lidarr's "Upgrades Allowed". Omitted leaves it as it is.
        preferred_protocol:
          type: string
          enum: ["", usenet, torrent]
          description: The delay profile's preferred protocol; the other's releases wait. Omitted leaves it as it is.
        protocol_delay_minutes:
          type: integer
          format: int64
          description: How long after a release was posted the other protocol waits; 0 is no delay. Omitted leaves it as it is.

    QualityProfileRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }

    LibraryQuality:
      type: object
      required: [profiles, available, warnings, upgrades_allowed, preferred_protocol, protocol_delay_minutes]
      properties:
        preferred_protocol: { type: string, enum: ["", usenet, torrent] }
        protocol_delay_minutes: { type: integer, format: int64 }
        upgrades_allowed:
          type: boolean
          description: >-
            Lidarr's "Upgrades Allowed". Off, an album with every track is complete whatever its
            quality: nothing is upgradable and nothing is searched for an upgrade.
        profiles:
          type: array
          description: The library's own list, earlier preferred. Empty means the instance default.
          items: { $ref: "#/components/schemas/QualityProfileRef" }
        available:
          type: array
          description: Every profile, in the suggested order.
          items: { $ref: "#/components/schemas/QualityProfileRef" }
        cutoff_profile_id: { type: integer, format: int64 }
        target: { $ref: "#/components/schemas/QualityTarget" }
        available_targets:
          type: array
          description: Every target of the library's media type, by name.
          items: { $ref: "#/components/schemas/QualityProfileRef" }
        warnings:
          type: array
          description: Plain-language notices, e.g. a target the first profile would refuse.
          items: { type: string }

    NamingSettings:
      type: object
      description: One library's naming, Lidarr's shape.
      required: [rename_files, replace_illegal_characters, colon_replacement, formats]
      properties:
        rename_files:
          type: boolean
          description: Lidarr's "Rename Tracks". Off, a file keeps the name it arrived with.
        replace_illegal_characters:
          type: boolean
          description: Replace characters some filesystems refuse; off, they are removed.
        colon_replacement:
          type: string
          enum: [delete, dash, space_dash, space_dash_space, smart]
        formats:
          type: object
          description: A template per slot key the media type declares.
          additionalProperties: { type: string }

    NamingSlot:
      type: object
      required: [key, label, help]
      properties:
        key: { type: string }
        label: { type: string }
        help: { type: string }

    NamingToken:
      type: object
      required: [spelling, group, example, help]
      properties:
        spelling: { type: string, description: 'As typed, e.g. "{Artist Name}".' }
        group: { type: string }
        example: { type: string }
        help: { type: string }

    NamingPreset:
      type: object
      required: [name, formats]
      properties:
        name: { type: string }
        formats:
          type: object
          additionalProperties: { type: string }

    NamingScheme:
      type: object
      description: What a media type declares about naming.
      required: [slots, tokens, presets]
      properties:
        slots:
          type: array
          items: { $ref: "#/components/schemas/NamingSlot" }
        tokens:
          type: array
          items: { $ref: "#/components/schemas/NamingToken" }
        presets:
          type: array
          description: The first is the media type's default.
          items: { $ref: "#/components/schemas/NamingPreset" }

    NamingExample:
      type: object
      required: [label, path]
      properties:
        label: { type: string }
        path: { type: string }

    LibraryNaming:
      type: object
      required: [naming, is_default, scheme, examples]
      properties:
        naming: { $ref: "#/components/schemas/NamingSettings" }
        is_default:
          type: boolean
          description: True until the library's naming is first saved.
        scheme: { $ref: "#/components/schemas/NamingScheme" }
        examples:
          type: array
          items: { $ref: "#/components/schemas/NamingExample" }

    NamingPreview:
      type: object
      required: [examples, problems]
      properties:
        examples:
          type: array
          items: { $ref: "#/components/schemas/NamingExample" }
        problems:
          type: array
          description: Why the settings would be refused on save; empty when they would not.
          items: { type: string }

    LibraryRenamePlan:
      type: object
      required: [roots]
      properties:
        roots:
          type: array
          items: { $ref: "#/components/schemas/RootRenamePlan" }

    RootRenamePlan:
      type: object
      required: [root_folder_id, plan]
      properties:
        root_folder_id: { type: integer, format: int64 }
        plan: { $ref: "#/components/schemas/DrainPlan" }

    DrainPlan:
      type: object
      description: >-
        What one drainRootFolder call computed -- a preview, a refusal, or
        an accepted and enqueued plan (ADR-51).
      required: [accepted, files_total, bytes_total, moves, refused, root_deltas]
      properties:
        accepted:
          type: boolean
          description: False for a preview or a refused plan; nothing was persisted.
        move_job_id: { type: integer, format: int64 }
        files_total: { type: integer, format: int64 }
        bytes_total: { type: integer, format: int64 }
        moves:
          type: array
          items: { $ref: "#/components/schemas/DrainMove" }
        refused:
          type: array
          items: { $ref: "#/components/schemas/DrainRefusal" }
        root_deltas:
          type: array
          items: { $ref: "#/components/schemas/RootDelta" }

    DrainMove:
      type: object
      required: [media_object_id, dest_root_folder_id, dest_rel_path, size_bytes, affinity_key]
      properties:
        media_object_id: { type: integer, format: int64 }
        source_rel_path:
          type: string
          description: >-
            The file's current path -- present so a caller can render the
            full "current vs proposed" diff section 11.8 asks for, not just
            the proposed side.
        dest_root_folder_id: { type: integer, format: int64 }
        dest_rel_path: { type: string }
        size_bytes: { type: integer, format: int64 }
        affinity_key:
          type: string
          description: The top-level directory this file was grouped and moved with.
        warnings:
          type: array
          items: { type: string }
          description: >-
            Non-fatal notices about dest_rel_path -- today, only naming's
            own total-path-length recommendation. Always present but only
            ever populated for a rename plan; a drain never renames a file,
            so this is always empty there.

    DrainRefusal:
      type: object
      required: [media_object_id, affinity_key, reason]
      properties:
        media_object_id: { type: integer, format: int64 }
        affinity_key: { type: string }
        reason: { type: string }

    RootDelta:
      type: object
      description: One root's own preview -- Invariant 73's "preview first".
      required: [root_folder_id, bytes_in, bytes_out, resulting_free_bytes]
      properties:
        root_folder_id: { type: integer, format: int64 }
        bytes_in: { type: integer, format: int64 }
        bytes_out: { type: integer, format: int64 }
        resulting_free_bytes: { type: integer, format: int64 }

    MoveJob:
      type: object
      required: [id, reason, state, files_total, files_done, bytes_total, bytes_done, created_at]
      properties:
        id: { type: integer, format: int64 }
        reason: { type: string, enum: [RENAME, CATEGORY, REBALANCE, DRAIN] }
        source_root_id: { type: integer, format: int64 }
        state: { type: string, enum: [PLANNED, RUNNING, PAUSED, DONE, FAILED] }
        files_total: { type: integer, format: int64 }
        files_done: { type: integer, format: int64 }
        bytes_total: { type: integer, format: int64 }
        bytes_done: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        error: { type: string }

    Identity:
      type: object
      required: [user_id, username, role]
      properties:
        user_id: { type: integer, format: int64 }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    Role:
      type: string
      enum: [admin, operator, readonly]

    Permission:
      type: string
      description: >-
        `none` is never returned: a category a caller cannot read is absent
        entirely, and reaching it directly is a 404 rather than a 403.
      enum: [none, read, request, manage]

    Me:
      type: object
      required: [user_id, role, tier, tier_max, categories, auth_required]
      properties:
        user_id: { type: integer, format: int64 }
        username: { type: string }
        auth_required:
          type: boolean
          description: False means every request is served as the administrator, so signing out does nothing.
        role: { $ref: "#/components/schemas/Role" }
        tier_max:
          $ref: "#/components/schemas/Tier"
        tier:
          type: string
          enum: [normal, advanced, expert]
          description: >-
            How much of the settings surface this caller is shown (ADR-26).
            Self-service via PATCH /me/tier -- raising or lowering it never
            changes behaviour, only what is displayed.
        categories:
          type: array
          items: { $ref: "#/components/schemas/Category" }

    APIKey:
      type: object
      description: >-
        A non-interactive credential (X-Api-Key or Bearer), never the key
        itself or its hash -- see CreatedAPIKey for the one response that
        does carry the plaintext.
      required: [id, name, created_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: "Prowlarr" }
        created_at: { type: string, format: date-time }
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: Null until the key is presented for the first time.

    CreatedAPIKey:
      description: >-
        Answered only once, by POST /me/apikeys -- `key` is the plaintext,
        shown here and never again.
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [key]
          properties:
            key: { type: string, example: "mnx_..." }

    Category:
      type: object
      required: [id, media_type, name, permission]
      properties:
        id: { type: integer, format: int64 }
        media_type: { $ref: "#/components/schemas/MediaType" }
        name: { type: string, example: "anime" }
        permission: { $ref: "#/components/schemas/Permission" }

    MediaTerm:
      type: object
      required: [one, many]
      properties:
        one: { type: string, description: Singular; empty when the type has no such entity. }
        many: { type: string }

    MediaRole:
      type: object
      required: [key, label, lead, followable, part_scoped, character]
      properties:
        key: { type: string }
        label: { type: string }
        lead: { type: boolean, description: The role a work is listed under. }
        followable: { type: boolean }
        part_scoped: { type: boolean, description: Credited per part rather than per work. }
        character: { type: boolean, description: Carries the name of who was played. }

    MediaTypeInfo:
      type: object
      required: [key, label, work, part, group, lead_people, organisation, roles, follow_options, facets, monitor_options, search_terms, work_image, wanted_grain, add_kinds, commits_held_imports, duplicates_by_name]
      properties:
        key: { $ref: "#/components/schemas/MediaType" }
        label: { type: string, description: Also the default name of a library of this type. }
        work: { $ref: "#/components/schemas/MediaTerm" }
        part: { $ref: "#/components/schemas/MediaTerm" }
        group: { $ref: "#/components/schemas/MediaTerm" }
        lead_people: { $ref: "#/components/schemas/MediaTerm" }
        organisation: { $ref: "#/components/schemas/MediaTerm" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/MediaRole" }
        follow_options:
          type: array
          description: The settings a follow of a person or organisation offers in this type's libraries.
          items: { $ref: "#/components/schemas/FollowOption" }
        facets:
          type: array
          description: The type's own fields of its entities beyond the base ones, as lists and pages show them.
          items: { $ref: "#/components/schemas/Facet" }
        monitor_options:
          type: array
          description: The ways a whole work can be monitored at once, for POST /works/{id}/monitor's option.
          items:
            type: object
            required: [key, label]
            properties:
              key: { type: string }
              label: { type: string }
        search_terms:
          type: array
          description: The words a person may search with instead of a work's own, the keys of POST /works/{id}/search's body.
          items:
            type: object
            required: [key, label]
            properties:
              key: { type: string }
              label: { type: string }
        work_image: { type: string, enum: [cover, poster], description: "The shape of a work's picture: an album's square cover, a series' tall poster." }
        add_kinds:
          type: array
          description: What GET /works/lookup and POST /works add for the type, the first being the default.
          items:
            type: object
            required: [key, label]
            properties:
              key: { type: string }
              label: { type: string }
        wanted_grain: { type: string, enum: [work, part], description: "What Wanted lists: works (Lidarr's albums) or parts (Sonarr's episodes, GET /wanted/parts)." }
        commits_held_imports: { type: boolean, description: "A held import unit is committed by hand, anyway or as a work named (Identify as)." }
        kinds:
          type: array
          description: What a library of the type can be, picked when one is added; the first is the default. Empty for a type of one kind.
          items:
            type: object
            required: [key, label]
            properties:
              key: { type: string }
              label: { type: string }
              help: { type: string }
        commit_guess_floor:
          type: number
          format: double
          description: The least confidence "Commit anyway" places a held unit's best guess at; below it the unit is named with Identify as. 0 takes any.
        duplicates_by_name: { type: boolean, description: "A duplicate is one recording under any work, matched by artist, title and length (music); otherwise two files covering one part." }

    MediaType:
      type: string
      description: >-
        Manga, magazines, music videos and adult galleries are categories of
        these rather than types of their own.
      enum:
        - music
        - tv
        - movie
        - audiobook
        - book
        - adult
        - comic
        - rom
        - podcast
        - news
        - youtube

    EventTopic:
      type: string
      enum: [job, acquisition, library, notification, pressure]

    Egress:
      type: object
      description: >-
        Every field is optional: a check that is switched off, has not run yet
        or has failed reports nothing rather than a stale or invented address.
      properties:
        public_ip: { type: string, example: "203.0.113.42" }
        checked_at: { type: string, format: date-time }
        source:
          type: string
          description: The echo service that answered, so the number is attributable.
        error:
          type: string
          description: Why the last attempt failed, when it did.
        enabled:
          type: boolean
          description: Whether the check is configured to run at all.

    DashboardSummary:
      type: object
      required: [root_folders, jobs, library]
      properties:
        root_folders:
          type: array
          items: { $ref: "#/components/schemas/RootFolder" }
        jobs: { $ref: "#/components/schemas/JobCounts" }
        library: { $ref: "#/components/schemas/LibraryCounts" }

    LibraryHealth:
      type: object
      description: >-
        Todo 4.8's own aggregate report. Every *_count is exact; every list
        alongside one is a bounded sample (the first 20), not the full set.
      required: [unprobed_count, unprobed_files, unmatched_count, incomplete_count,
                 incomplete_works, roots_near_reserve, blocked_present, categories_offline_files]
      properties:
        unprobed_count: { type: integer, description: Files with no measured attributes yet (ADR-39). }
        unprobed_files:
          type: array
          items: { $ref: "#/components/schemas/UnprobedFile" }
        unmatched_count: { type: integer, description: Files waiting in the manual identification queue (F29). }
        incomplete_count: { type: integer, description: Monitored works still short of their own required track count. }
        incomplete_works:
          type: array
          items: { $ref: "#/components/schemas/IncompleteWork" }
        roots_near_reserve:
          type: array
          description: Every online root whose free space has fallen within 10% of its own configured reserve.
          items: { $ref: "#/components/schemas/RootNearReserve" }
        blocked_present:
          type: array
          description: Blocked hashes (ADR-53 part 2) a scan found still sitting in the library (Invariant 83).
          items: { $ref: "#/components/schemas/BlockedPresent" }
        categories_offline_files:
          type: array
          description: >-
            Every category currently carrying files on a root declared
            offline (section 10.4) -- total_files is the category's real
            total regardless of reachability, offline_files is how many of
            those are not reachable right now. Only categories actually
            affected are listed.
          items: { $ref: "#/components/schemas/CategoryOfflineFiles" }

    CategoryOfflineFiles:
      type: object
      required: [category_id, name, total_files, offline_files]
      properties:
        category_id: { type: integer, format: int64 }
        name: { type: string }
        total_files: { type: integer, format: int64 }
        offline_files: { type: integer, format: int64 }

    UnprobedFile:
      type: object
      required: [root_folder_id, rel_path]
      properties:
        root_folder_id: { type: integer, format: int64 }
        rel_path: { type: string }

    IncompleteWork:
      type: object
      required: [work_id, title, category_id, state, required_count, present_count]
      properties:
        work_id: { type: integer, format: int64 }
        title: { type: string }
        category_id: { type: integer, format: int64 }
        state: { type: string, enum: [MISSING, PARTIAL] }
        required_count: { type: integer, format: int64 }
        present_count: { type: integer, format: int64 }

    RootNearReserve:
      type: object
      required: [root_folder_id, path, free_bytes, min_free_bytes]
      properties:
        root_folder_id: { type: integer, format: int64 }
        path: { type: string }
        free_bytes: { type: integer, format: int64 }
        min_free_bytes: { type: integer, format: int64 }

    BlockedPresent:
      type: object
      required: [blocked_content_id, reason, title, media_object_id, root_folder_id, rel_path]
      properties:
        blocked_content_id: { type: integer, format: int64 }
        reason: { type: string }
        title: { type: string }
        media_object_id: { type: integer, format: int64 }
        root_folder_id: { type: integer, format: int64 }
        rel_path: { type: string }

    JobCounts:
      type: object
      description: Live counts over jobs.db, which retention keeps bounded.
      required: [total, pending, running, failed, succeeded, cancelled]
      properties:
        total: { type: integer }
        pending:
          type: integer
          description: PENDING and PENDING_RETRY together; both are waiting.
        running:
          type: integer
          description: RUNNING and LEASED together; both are claimed by a worker.
        failed: { type: integer }
        succeeded: { type: integer }
        cancelled: { type: integer }

    LibraryCounts:
      type: object
      description: >-
        Read from the `counter` table, never aggregated live (section 21.12,
        ADR-28). Absent counters report zero, so an empty library and an
        uncounted one look the same until the reconciliation job has run.
      required: [works, files, monitored, missing, probed, unprobed, fresh]
      properties:
        works: { type: integer }
        files: { type: integer }
        monitored: { type: integer }
        missing: { type: integer }
        probed:
          type: integer
          description: >-
            Files with a measured attributes row (ADR-39). Same "library"
            counter scope as the others, a distinct metric pair
            (library.ProbeCoverage, todo 4.2) reconciled by its own sweep.
        unprobed:
          type: integer
          description: total_files minus probed, computed here rather than stored twice.
        fresh:
          type: integer
          description: >-
            Works released within the freshness window (ADR-55, todo 4.20).
            Same "library" counter scope, a distinct metric
            (library.FreshCounts) reconciled by its own sweep.

    JobState:
      type: string
      enum: [PENDING, PENDING_RETRY, LEASED, RUNNING, SUCCEEDED, FAILED, CANCELLED]

    JobPool:
      type: string
      enum: [search, acquire, import, metadata, scan, files, move, housekeeping, maintenance]

    Job:
      type: object
      description: >-
        The job's payload is deliberately absent. It can carry paths and provider
        identifiers, and a listing is not the place to hand that out.
      required: [id, type, pool, state, priority, attempts, max_attempts, run_after, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, example: "library.scan" }
        pool: { $ref: "#/components/schemas/JobPool" }
        state: { $ref: "#/components/schemas/JobState" }
        priority: { type: integer }
        attempts: { type: integer }
        max_attempts: { type: integer }
        category_id: { type: integer, format: int64 }
        correlation_id: { type: string }
        last_error: { type: string }
        run_after: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    JobPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Job" }
        next_cursor:
          type: string
          description: >-
            Empty on the last page, which is how a client knows to stop without
            one more request that returns nothing.

    CrossoverWrite:
      type: object
      required: [name, part_ids]
      properties:
        category_id: { type: integer, format: int64, description: "The library the event is listed under; on create only." }
        name: { type: string, minLength: 1 }
        part_ids: { type: array, items: { type: integer, format: int64 }, description: "The episodes in watch order." }

    Crossover:
      type: object
      required: [id, name, monitored, members]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        monitored: { type: boolean }
        members:
          type: array
          items: { $ref: "#/components/schemas/CrossoverMember" }

    CrossoverMember:
      type: object
      required: [part_id, work_id, work_title, media_ref, title, monitored, has_file]
      properties:
        part_id: { type: integer, format: int64 }
        work_id: { type: integer, format: int64 }
        work_title: { type: string }
        media_ref: { type: string }
        title: { type: string }
        date: { type: string }
        monitored: { type: boolean }
        has_file: { type: boolean }

    SameContentLink:
      type: object
      required: [part_id, other_part_id, other_work_id, other_ref, other_work_title]
      properties:
        part_id: { type: integer, format: int64 }
        other_part_id: { type: integer, format: int64 }
        other_work_id: { type: integer, format: int64 }
        other_ref: { type: string }
        other_work_title: { type: string }

    SameContentSuggestion:
      type: object
      required: [part_id, work_id, work_title, media_ref, title, date, other_part_id, other_work_id, other_work_title, other_ref]
      properties:
        part_id: { type: integer, format: int64 }
        work_id: { type: integer, format: int64 }
        work_title: { type: string }
        media_ref: { type: string }
        title: { type: string }
        date: { type: string }
        other_part_id: { type: integer, format: int64 }
        other_work_id: { type: integer, format: int64 }
        other_work_title: { type: string }
        other_ref: { type: string }

    NumberingMove:
      type: object
      required: [title, from, has_file]
      properties:
        title: { type: string }
        from: { type: string, example: "S01E05" }
        to: { type: string, example: "S02E01" }
        has_file: { type: boolean }

    NumberingPlan:
      type: object
      required: [moves, set_aside, unchanged, new]
      properties:
        moves: { type: array, items: { $ref: "#/components/schemas/NumberingMove" } }
        set_aside: { type: array, items: { $ref: "#/components/schemas/NumberingMove" } }
        unchanged: { type: integer }
        new: { type: integer }

    WorkMergeSuggestion:
      type: object
      required: [into_work_id, title]
      properties:
        into_work_id: { type: integer, format: int64 }
        title: { type: string }
        lead_name: { type: string }

    WorkMerge:
      type: object
      required: [drop_id, keep_id, drop_title, keep_title, files, wanted_items, acquisitions, import_units]
      properties:
        drop_id: { type: integer, format: int64 }
        keep_id: { type: integer, format: int64 }
        drop_title: { type: string }
        keep_title: { type: string }
        files: { type: integer, format: int64 }
        wanted_items: { type: integer, format: int64 }
        acquisitions: { type: integer, format: int64 }
        import_units: { type: integer, format: int64 }

    Work:
      type: object
      required: [id, media_type, title, sort_title, added_at, updated_at]
      properties:
        poster_url: { type: string, description: "The work's poster at its provider; absent for a work whose picture is its artwork (an album's cover)." }
        lead_id:
          type: integer
          format: int64
          description: The person the work is listed under (an album's artist), for a type with a lead role.
        facets:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: The media type's own fields of this work, by facet key (GET /mediatypes declares them).
        totals:
          type: object
          required: [present, required, upgradable]
          description: The work's monitored groups summed (an album's one, a series' seasons).
          properties:
            present: { type: integer, format: int64 }
            required: { type: integer, format: int64 }
            upgradable: { type: integer, format: int64, description: Groups below the cutoff. }
        id: { type: integer, format: int64 }
        media_type: { type: string, example: "music" }
        title: { type: string }
        sort_title: { type: string }
        year: { type: integer }
        artist:
          type: string
          description: >-
            The work's own primary artist credit, when it has one. Ordered on
            by sort=artist.
        added_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_searched_at:
          type: string
          format: date-time
          description: When the album was last searched. Absent means never.
        unverified:
          type: boolean
          description: >-
            Known only by its own tags or folder (D6): no metadata source recognised it. Absent
            means false.
        artist_cover:
          type: boolean
          description: >-
            No cover of its own: its artwork is the primary artist's image, and a poster marks it.
            Absent means false.
        no_artwork:
          type: boolean
          description: >-
            Neither the work nor its lead has a cached picture; only poster_url, if set, has one. Absent means not
            known.
        status:
          type: string
          enum: [complete, incomplete, downloading, unreleased, unverified]
          description: The poster wall's colour, PersonWork.status' own vocabulary.
        monitored: { type: boolean }
        size_bytes: { type: integer, format: int64, description: Size on disk of the album's files. }
        present_count: { type: integer, format: int64 }
        required_count: { type: integer, format: int64 }
        overview:
          type: string
          description: The album's description, cut to a paragraph, for the Overview view.
        wanted_state:
          type: string
          enum: [MISSING, PARTIAL, COMPLETE, UPGRADABLE]
          description: >-
            Set when this work has a monitored desired_item, regardless of
            whether the wanted filter was used.

    WorkPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Work" }
        next_cursor:
          type: string
          description: >-
            Empty on the last page, which is how a client knows to stop without
            one more request that returns nothing.

    BlocklistPage:
      type: object
      description: One cursor page of blocked releases.
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BlocklistEntry" }
        next_cursor:
          type: integer
          format: int64
          description: Absent on the last page.

    BlocklistEntry:
      type: object
      description: One release that will not be grabbed again (section 10.11).
      required: [id, title, reason, source, created_at]
      properties:
        id: { type: integer, format: int64 }
        indexer_id: { type: integer, format: int64 }
        guid: { type: string }
        content_hash: { type: string }
        title: { type: string }
        reason:
          type: string
          description: Why it was blocked, as the engine recorded it.
        source:
          type: string
          description: Whether a person blocked this or the software did.
        expires_at:
          type: string
          format: date-time
          description: Absent means permanent. Only automatic entries expire.
        created_at: { type: string, format: date-time }

    GrabResult:
      type: object
      description: One automatic search.
      required: [found, already_downloading]
      properties:
        found:
          type: integer
          description: How many releases matched the album.
        sent: { $ref: "#/components/schemas/Acquisition" }
        already_downloading:
          type: boolean
          description: A download for the album was on its way, so nothing was searched.
        held:
          type: boolean
          description: >-
            The best release waits for room: its client already holds as many of
            Solarr's downloads as it may (ADR-57), and it goes when one finishes.
        refused:
          type: integer
          description: >-
            Releases the download client declined before one was taken (or none
            was), each passed over for the next best.

    ProwlarrIndexer:
      type: object
      required: [prowlarr_id, name, impl, base_url, enabled, music, already_added]
      properties:
        prowlarr_id: { type: integer, format: int64 }
        name: { type: string }
        impl: { type: string, enum: [newznab, torznab] }
        base_url:
          type: string
          description: Prowlarr's own endpoint for this indexer.
        enabled:
          type: boolean
          description: Whether the indexer is enabled in Prowlarr.
        music:
          type: boolean
          description: Whether it offers the Audio categories.
        already_added:
          type: boolean
          description: An indexer with this base URL is already configured here.

    HistoryPage:
      type: object
      description: One cursor page of download history.
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/HistoryEntry" }
        next_cursor:
          type: integer
          format: int64
          description: Absent on the last page.

    Queue:
      type: object
      required: [clients, items, held]
      properties:
        held:
          type: array
          description: Releases decided but not sent because their client is full, next first.
          items: { $ref: "#/components/schemas/HeldRelease" }
        clients:
          type: array
          items: { $ref: "#/components/schemas/QueueClient" }
        items:
          type: array
          items: { $ref: "#/components/schemas/QueueItem" }

    Activity:
      type: object
      required: [running]
      properties:
        running:
          type: array
          items: { $ref: "#/components/schemas/RunningJob" }

    RunningJob:
      type: object
      required: [job_id, type, name, started_at, done]
      properties:
        job_id: { type: integer, format: int64 }
        type: { type: string }
        name:
          type: string
          description: What the job is doing, as the status bar says it.
        started_at: { type: string, format: date-time }
        done: { type: integer, format: int64 }
        total:
          type: integer
          format: int64
          description: How much there is; absent when the job does not know.
        per_minute:
          type: number
          description: Items a minute over the last one to five minutes; absent until measured.
        eta_seconds:
          type: integer
          format: int64
          description: Time left at that rate; absent when unknown.

    HeldRelease:
      type: object
      description: >-
        A release found and held for room in its client's queue (ADR-57), in the order held
        releases are sent: a user's own grabs, then RSS, then new albums, then backfill.
      required: [release_title, held_at, origin]
      properties:
        work_id: { type: integer, format: int64 }
        album: { type: string }
        artist: { type: string }
        release_title: { type: string }
        indexer: { type: string }
        size_bytes: { type: integer, format: int64 }
        origin:
          type: string
          enum: [user, rss, automatic]
          description: Who asked for it.
        held_at: { type: string, format: date-time }

    QueueClient:
      type: object
      description: One download client's own queue, or why it could not be read.
      required: [id, name, paused, speed_bytes_per_sec, items, size_left_bytes]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        paused: { type: boolean }
        speed_bytes_per_sec: { type: integer, format: int64 }
        items: { type: integer }
        size_left_bytes: { type: integer, format: int64 }
        error: { type: string }

    QueueItem:
      type: object
      description: One download in flight.
      required: [id, release_title, client, state, added_at]
      properties:
        id: { type: integer, format: int64, description: The acquisition id. }
        work_id: { type: integer, format: int64 }
        album: { type: string }
        artist: { type: string }
        release_title: { type: string }
        indexer: { type: string }
        client: { type: string }
        state:
          type: string
          enum: [QUEUED, DOWNLOADING, COMPLETED, IMPORTING]
        client_state:
          type: string
          description: The client's own view; absent while the client does not list it.
          enum: [queued, downloading, paused, processing, completed, failed]
        size_bytes: { type: integer, format: int64 }
        size_left_bytes: { type: integer, format: int64 }
        eta_seconds:
          type: integer
          format: int64
          description: At the client's current speed; absent when paused, stopped or unknown.
        error: { type: string }
        added_at: { type: string, format: date-time }

    HistoryEntry:
      type: object
      description: One thing that happened to a download, as it was known then.
      required: [id, at, kind, release_title]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        kind:
          type: string
          enum: [grabbed, imported, failed, removed]
        work_id: { type: integer, format: int64 }
        album: { type: string }
        artist: { type: string }
        release_title: { type: string }
        indexer: { type: string }
        client:
          type: string
          description: The download client's name.
        detail:
          type: string
          description: Why a download failed, in the client's or the importer's words.

    RemoveWorkResult:
      type: object
      description: What removing an album actually did.
      required: [work_deleted, files_kept]
      properties:
        work_deleted:
          type: boolean
          description: False when the album was kept because files for it remain in the library.
        files_kept:
          type: integer
          format: int64
          description: How many files the library still holds for this work.
        files_recycled:
          type: integer
          format: int64
          description: How many files delete_files moved out of the library.

    RemovePartResult:
      type: object
      description: What removing a track actually did.
      required: [files_recycled]
      properties:
        files_recycled:
          type: integer
          format: int64
          description: How many files delete_files moved out of the library; 0 or 1.

    CalendarDate:
      type: object
      required: [date, releases]
      properties:
        date: { type: string }
        releases: { type: integer, format: int64 }

    CalendarFeed:
      type: object
      properties:
        token:
          type: string
          description: Absent when the caller has no feed.

    SettingsImportResult:
      type: object
      required: [warnings]
      properties:
        warnings:
          type: array
          items: { $ref: "#/components/schemas/SettingsImportWarning" }

    SettingsImportWarning:
      type: object
      required: [path, message]
      properties:
        path: { type: string }
        message: { type: string }
        suggestion: { type: string }

    CalendarEntry:
      type: object
      description: One release in the calendar window.
      required: [work_id, title, release_date, on_disk]
      properties:
        work_id: { type: integer, format: int64 }
        title: { type: string }
        artist: { type: string }
        primary_type:
          type: string
          description: MusicBrainz's own vocabulary ("Album", "Single"), absent when unknown.
        release_date:
          type: string
          description: A partial ISO date as the provider gave it -- "2024", "2024-03" or "2024-03-01".
        on_disk:
          type: boolean
          description: Whether the library already holds a file for this work.
        part_id:
          type: integer
          format: int64
          description: Set for a TV episode, which then shows the series as title and the episode as artist.
        category_id:
          type: integer
          format: int64
          description: The TV library an episode is in, for linking to its series.

    LogRecord:
      type: object
      description: One captured log line.
      required: [time, level, message]
      properties:
        time: { type: string, format: date-time }
        level: { type: string }
        message: { type: string }
        attrs:
          type: array
          description: The record's own attributes, rendered as key=value in the order they were logged.
          items: { type: string }

    BackupFile:
      type: object
      description: One backup file on disk.
      required: [name, size_bytes, taken_at]
      properties:
        name: { type: string }
        size_bytes: { type: integer, format: int64 }
        taken_at: { type: string, format: date-time }
        pre_migration:
          type: boolean
          description: Taken before a schema migration, and kept outside the retention rotation (ADR-15).

    HealthCheck:
      type: object
      description: One thing wrong with this instance right now.
      required: [id, severity, message]
      properties:
        id:
          type: string
          description: A stable identifier for the check, so the interface can route it.
          example: no_indexer
        severity:
          type: string
          enum: [warning, error]
          description: >-
            error means something cannot work at all; warning means it works
            but will not do what the user probably expects.
        message:
          type: string
          description: What is wrong, in the operator's terms.
        link:
          type: string
          description: Where in the interface to fix it, when there is one place.

    ArrApp:
      type: string
      enum: [lidarr, sonarr, radarr, readarr, whisparr, prowlarr]
      description: >-
        Which *Arr application a connection talks to (ADR-52). Only lidarr
        has a real sync this pass (music exists); the other four can be
        connected for when their own stage ships. prowlarr has no library:
        its active indexers and download clients are used from it.

    SecretMask:
      type: object
      required: [has_value]
      description: >-
        A credential, shown without ever exposing it (section 13.1). The raw
        value exists only between the database and the one outbound request
        that needs it.
      properties:
        has_value: { type: boolean }
        masked:
          type: string
          description: A short hint ("abc…xyz"), present only when has_value is true.

    ArrSyncOptions:
      type: object
      description: What one import brings in. Absent is monitored items and every album, as before options.
      properties:
        monitored: { type: boolean, default: true, description: Monitored artists and albums. }
        unmonitored:
          type: boolean
          default: false
          description: Unmonitored ones too; they arrive unmonitored, an artist without following them.
        albums:
          type: string
          enum: [all, missing, complete]
          default: all
          description: Which albums, by what the *Arr holds of them.
        path_rewrites:
          type: array
          description: >-
            How the *Arr's paths read here, e.g. /media/music as /mnt/media/music; the first matching
            prefix applies. Used to find each artist's library by its root folder.
          items:
            type: object
            required: [from, to]
            properties:
              from: { type: string }
              to: { type: string }

    ArrDownloadClient:
      type: object
      required: [name, impl, protocol, enabled, base_url, supported, already_added]
      properties:
        name: { type: string }
        impl: { type: string, description: 'The *Arr implementation, lower case: "sabnzbd", "qbittorrent", ...' }
        protocol: { type: string }
        enabled: { type: boolean }
        base_url: { type: string }
        category: { type: string }
        username: { type: string, description: The user name the *Arr signs in with, where it keeps one; its password is hidden. }
        supported: { type: boolean, description: Solarr can use a client of this kind. }
        already_added: { type: boolean, description: A download client with this address is already here. }

    ArrInstance:
      type: object
      required: [id, app, name, base_url, enabled, api_key, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        app: { $ref: "#/components/schemas/ArrApp" }
        name: { type: string }
        base_url: { type: string }
        category_id:
          type: integer
          format: int64
          description: >-
            Where imported intent lands. Unset means match each artist's own
            root folder path against a configured root folder instead.
        enabled: { type: boolean }
        api_key: { $ref: "#/components/schemas/SecretMask" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_synced_at: { type: string, format: date-time }
        last_sync_error: { type: string }

    Indexer:
      type: object
      required: [id, name, impl, base_url, enabled, priority, api_key, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        impl:
          type: string
          description: '"newznab" or "torznab" (ADR-43).'
        base_url: { type: string }
        enabled: { type: boolean }
        priority: { type: integer, format: int64 }
        categories_json:
          type: string
          description: The indexer's own last t=caps response, opaque (ADR-43). Empty until fetched.
        caps_fetched_at: { type: string, format: date-time }
        api_key: { $ref: "#/components/schemas/SecretMask" }
        egress_proxy_url:
          type: string
          description: >-
            ADR-47, expert tier: an HTTP/SOCKS5 proxy for this indexer's own
            requests only. Empty means "use the global egress proxy, if any"
            -- not "no proxy". FlareSolverr is not yet built.
        music_categories:
          type: array
          items: { type: integer }
          description: >-
            Newznab categories music is searched and RSS-read in (D17). Always answered; [3000]
            (Audio) unless set.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AddIndexerRequest:
      type: object
      required: [name, impl, base_url]
      properties:
        name: { type: string, minLength: 1 }
        impl: { type: string, minLength: 1 }
        base_url: { type: string, minLength: 1 }
        api_key:
          type: string
          description: Omitted or empty for a public endpoint that needs none (ADR-47).
        enabled: { type: boolean, default: true }
        priority: { type: integer, format: int64, minimum: 1, maximum: 50, default: 25, description: "Lower is preferred when several indexers list the same release." }
        egress_proxy_url: { type: string }
        music_categories:
          type: array
          items: { type: integer }
          description: Newznab categories for music; omitted or empty means [3000] (Audio).

    UpdateIndexerRequest:
      type: object
      required: [name, impl, base_url]
      properties:
        name: { type: string, minLength: 1 }
        impl: { type: string, minLength: 1 }
        base_url: { type: string, minLength: 1 }
        enabled: { type: boolean, default: true }
        priority: { type: integer, format: int64, minimum: 1, maximum: 50, default: 25 }
        egress_proxy_url: { type: string }
        music_categories:
          type: array
          items: { type: integer }
          description: Newznab categories for music; omitted or empty means [3000] (Audio).

    TVProvider:
      type: object
      required: [id, name, adds, key]
      properties:
        id: { type: string, enum: [skyhook, tvmaze, tmdb, anilist, tvdb] }
        name: { type: string }
        adds: { type: string, description: What this provider contributes to a series. }
        key:
          type: string
          enum: [not_needed, missing, stored, built_in]
          description: >-
            not_needed: works without a key. missing: needs the user's own key and has none. stored: the user's own key
            is stored. built_in: Solarr's own project key is in use and an own one is optional.

    TVProviderTest:
      type: object
      required: [id, ok, message, tested_at]
      properties:
        id: { type: string, enum: [skyhook, tvmaze, tmdb, anilist, tvdb] }
        ok: { type: boolean }
        message: { type: string }
        tested_at: { type: string, format: date-time }

    ConnectionTestResult:
      type: object
      required: [ok, message, tested_at]
      properties:
        ok: { type: boolean }
        message:
          type: string
          description: >-
            What was found -- the indexer/client's own reported version or
            capability summary when ok, or why the call failed otherwise.
        tested_at: { type: string, format: date-time }
        download_folder:
          type: string
          description: Where a download client puts finished downloads, as it reports it.

    Downloader:
      type: object
      required: [id, name, impl, base_url, enabled, protocol, credentials, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        impl:
          type: string
          description: '"sabnzbd" today (ADR-46).'
        base_url: { type: string }
        enabled: { type: boolean }
        protocol: { type: string, enum: [usenet, torrent, ddl] }
        credentials: { $ref: "#/components/schemas/SecretMask" }
        options: { $ref: "#/components/schemas/DownloaderOptions" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DownloaderOptions:
      type: object
      description: Lidarr's download client options.
      properties:
        category:
          type: string
          description: The client category downloads are sent under; empty means "music" for music.
        remove_completed:
          type: boolean
          description: Remove a download from the client once imported. Absent means yes.
        remote_path:
          type: string
          description: Where the client says its downloads are (remote path mapping).
        local_path:
          type: string
          description: Where Solarr sees that same folder.
        max_queued:
          type: integer
          minimum: 1
          maximum: 1000
          description: >-
            How many of Solarr's downloads this client may hold at once before
            further automatic sends are held (ADR-57). Absent means 10.
        always_send_user_grabs:
          type: boolean
          description: A user's own grab goes to this client even when it is full. Absent means yes.
        always_send_rss_grabs:
          type: boolean
          description: An RSS grab goes to this client even when it is full. Absent means yes.
        seed_ratio:
          type: number
          format: double
          minimum: 0
          description: >-
            Torrent clients: an imported torrent stays (and seeds) until it has shared this ratio or seeded for seed_minutes,
            whichever comes first, then it is removed with its files. Needs remove_completed. 0 or absent is no ratio limit.
        seed_minutes:
          type: integer
          minimum: 0
          description: "Torrent clients: minutes an imported torrent seeds before removal. 0 or absent is no time limit."

    TestDownloaderRequest:
      type: object
      required: [impl, base_url]
      properties:
        impl: { type: string, minLength: 1 }
        base_url: { type: string, minLength: 1 }
        credentials: { type: string }
        options: { $ref: "#/components/schemas/DownloaderOptions" }

    AddDownloaderRequest:
      type: object
      required: [name, impl, base_url, protocol]
      properties:
        name: { type: string, minLength: 1 }
        impl: { type: string, minLength: 1 }
        base_url: { type: string, minLength: 1 }
        protocol: { type: string, enum: [usenet, torrent, ddl] }
        credentials: { type: string }
        enabled: { type: boolean, default: true }
        options: { $ref: "#/components/schemas/DownloaderOptions" }

    UpdateDownloaderRequest:
      type: object
      required: [name, impl, base_url, protocol]
      properties:
        name: { type: string, minLength: 1 }
        impl: { type: string, minLength: 1 }
        base_url: { type: string, minLength: 1 }
        protocol: { type: string, enum: [usenet, torrent, ddl] }
        enabled: { type: boolean, default: true }
        options: { $ref: "#/components/schemas/DownloaderOptions" }

    ArrRootFolder:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: As the *Arr instance's own container sees it.

    AddArrInstanceRequest:
      type: object
      required: [app, name, base_url, api_key]
      properties:
        app: { $ref: "#/components/schemas/ArrApp" }
        name: { type: string, minLength: 1 }
        base_url: { type: string, minLength: 1 }
        api_key: { type: string, minLength: 1 }
        category_id: { type: integer, format: int64 }
        enabled: { type: boolean, default: true }

    UpdateArrInstanceRequest:
      type: object
      required: [name, base_url]
      properties:
        name: { type: string, minLength: 1 }
        base_url: { type: string, minLength: 1 }
        category_id: { type: integer, format: int64 }
        enabled: { type: boolean, default: true }

    ArrImportRun:
      type: object
      required:
        [id, instance_id, app, state, started_at, artists_created, artists_matched,
         albums_created, albums_matched, items_parked]
      properties:
        id: { type: integer, format: int64 }
        instance_id: { type: integer, format: int64 }
        app: { $ref: "#/components/schemas/ArrApp" }
        state: { type: string, enum: [RUNNING, DONE, FAILED, REVERTED] }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        error: { type: string }
        artists_created: { type: integer, format: int64 }
        artists_matched: { type: integer, format: int64 }
        albums_created: { type: integer, format: int64 }
        albums_matched: { type: integer, format: int64 }
        items_parked: { type: integer, format: int64 }
        artists_total: { type: integer, format: int64, description: Artists the running import will walk; absent once it has finished. }
        artists_done: { type: integer, format: int64, description: Artists walked so far; absent once it has finished. }

    ArrImportItem:
      type: object
      required: [id, import_id, kind, source_id, title, person_created, work_created, desired_item_created, created_at]
      properties:
        id: { type: integer, format: int64 }
        import_id: { type: integer, format: int64 }
        kind: { type: string, enum: [artist, album, parked] }
        source_id: { type: string, description: The *Arr app's own id for this entity. }
        title: { type: string }
        person_id: { type: integer, format: int64 }
        person_created: { type: boolean }
        subscription_id: { type: integer, format: int64 }
        work_id: { type: integer, format: int64 }
        work_created: { type: boolean }
        desired_item_id: { type: integer, format: int64 }
        desired_item_created: { type: boolean }
        created_at: { type: string, format: date-time }

    ArrImportDetail:
      type: object
      required: [run, items]
      properties:
        run: { $ref: "#/components/schemas/ArrImportRun" }
        items:
          type: array
          items: { $ref: "#/components/schemas/ArrImportItem" }

    ArrImportRevertResult:
      type: object
      required: [works_deleted, subscriptions_deleted, people_deleted, errors]
      properties:
        works_deleted: { type: integer }
        subscriptions_deleted: { type: integer }
        people_deleted: { type: integer }
        errors:
          type: array
          items: { type: string }

    Person:
      type: object
      description: A person, first-class and monitorable in their own right (ADR-32).
      required: [id, name, sort_name, monitored]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        sort_name: { type: string }
        disambiguation: { type: string }
        kind: { type: string, example: "Person" }
        gender: { type: string }
        country: { type: string }
        born: { type: string, example: "1958-07-30" }
        died: { type: string }
        monitored: { type: boolean }

    AddCandidate:
      type: object
      required: [kind, provider, external_id, title]
      properties:
        kind: { type: string, description: One of the type's add_kinds. }
        provider: { type: string }
        external_id: { type: string }
        title: { type: string }
        subtitle: { type: string, description: "Tells candidates apart: an album's artist, an artist's disambiguation, a series' network." }
        overview: { type: string }
        poster_url: { type: string }
        status: { type: string }
        year: { type: integer, format: int64 }
        library_id: { type: integer, format: int64, description: The work or person the library already holds for it. }

    AddWorkRequest:
      type: object
      required: [category_id, provider, external_id]
      properties:
        category_id: { type: integer, format: int64 }
        kind: { type: string, description: One of the type's add_kinds; the first when absent. }
        provider: { type: string }
        external_id: { type: string }
        monitored: { type: boolean, default: true }
        monitor_option: { type: string, description: One of the type's monitor_options; its default when absent. }
        specials: { type: boolean, default: false, description: Also monitor the specials group. }
        quality_profile_id: { type: integer, format: int64, description: The library's default when absent. }
        search: { type: boolean, default: false, description: Start looking for what was added. }

    AddWorkResult:
      type: object
      required: [kind, searching]
      properties:
        kind: { type: string }
        work_id: { type: integer, format: int64 }
        person_id: { type: integer, format: int64, description: The followed person, for an artist. }
        searching: { type: boolean, description: "The type started the search; false leaves POST /works/{id}/grab to the caller." }

    WantedPart:
      type: object
      required: [part_id, work_id, work_title, group_ref, group_label, number]
      properties:
        part_id: { type: integer, format: int64 }
        work_id: { type: integer, format: int64 }
        work_title: { type: string }
        group_ref: { type: string, description: The group the part is wanted through, searched as a whole. }
        group_label: { type: string }
        number: { type: string }
        title: { type: string }
        date: { type: string }
        available_at: { type: string, format: date-time }
        file: { $ref: "#/components/schemas/PartFile" }

    WantedPartPage:
      type: object
      required: [items]
      properties:
        judged: { type: boolean, description: For the cutoff view, false when the library sets neither a target nor a cutoff. }
        items:
          type: array
          items: { $ref: "#/components/schemas/WantedPart" }
        next_cursor: { type: string }

    WorkExclusion:
      type: object
      required: [title, provider, external_id, created_at]
      properties:
        title: { type: string }
        provider: { type: string, description: One id the work was excluded by; removing it allows the work again. }
        external_id: { type: string }
        created_at: { type: integer, format: int64, description: Unix seconds. }

    DuplicateResolution:
      type: object
      required: [linked, recycled, freed_bytes, problems]
      properties:
        linked: { type: integer, description: Copies now linked to the kept one. }
        recycled: { type: integer, description: Copies moved to the recycle bin. }
        freed_bytes: { type: integer, format: int64 }
        problems:
          type: array
          description: One line each for what was left alone and why.
          items: { type: string }

    PersonPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PersonEntry" }
        next_cursor:
          type: string
          description: >-
            Empty on the last page, which is how a client knows to stop without
            one more request that returns nothing.

    PersonWork:
      type: object
      description: >-
        One work in a person's discography, plus the artist page's own
        "available / missing / requested" signal (Lidarr-like discography).
      required: [id, media_type, title, sort_title, on_disk, status]
      properties:
        id: { type: integer, format: int64 }
        media_type: { type: string, example: "music" }
        title: { type: string }
        sort_title: { type: string }
        year: { type: integer }
        primary_type:
          type: string
          example: "Album"
          description: >-
            MusicBrainz's own release-group vocabulary (Album, EP, Single,
            Broadcast, Other, ...), when known -- absent for a work created
            before this existed, or from a source with no MusicBrainz answer.
        wanted_state:
          type: string
          enum: [MISSING, PARTIAL, COMPLETE, UPGRADABLE]
          description: Set when this work has a monitored desired_item, same as Work's own.
        on_disk:
          type: boolean
          description: Whether this work is linked to any root folder at all (WorkDetail's own OnDisk).
        present_count:
          type: integer
          format: int64
          description: How many of the album's tracks are in the library.
        required_count:
          type: integer
          format: int64
          description: How many it needs, absent when nothing has counted them yet.
        poster_url: { type: string, description: "A provider's poster, for a work with no cover of its own." }
        status:
          type: string
          enum: [complete, incomplete, downloading, unreleased, unverified]
          description: >-
            The colour this album carries wherever it is listed -- green
            complete, red incomplete, purple downloading, yellow not released
            yet. Unreleased outranks everything: an album that is not out is
            not missing.

    PersonEntry:
      allOf:
        - $ref: "#/components/schemas/Person"
        - type: object
          required: [roles, works, wanted, complete, downloading]
          properties:
            image_url: { type: string, description: "A provider's photo, when one is known." }
            no_artwork: { type: boolean, description: "No picture is cached for them, so /people/{id}/artwork would answer 404. Absent means not known." }
            roles:
              type: array
              items: { type: string }
              description: Their roles in the libraries listed.
            works: { type: integer, format: int64, description: How many works there credit them. }
            latest: { type: integer, description: The year of their newest work there. }
            character: { type: string, description: The first part they played there. }
            wanted: { type: integer, format: int64, description: Their monitored works there. }
            complete: { type: integer, format: int64, description: Of those, the complete ones. }
            downloading: { type: boolean }
            added_at: { type: integer, format: int64 }

    PersonLibrary:
      type: object
      description: A person's place in one library the caller may read.
      required: [category_id, role, works]
      properties:
        category_id: { type: integer, format: int64 }
        role: { type: string }
        works: { type: integer, format: int64 }

    WorkCredit:
      type: object
      description: >-
        One thing a person or organisation did on one work of one library; parts lists the parts of a
        part-scoped role.
      required: [category_id, role, work]
      properties:
        category_id: { type: integer, format: int64 }
        role: { type: string }
        character: { type: string }
        parts:
          type: array
          items: { type: string }
        work: { $ref: "#/components/schemas/PersonWork" }

    Facet:
      type: object
      required: [key, label, entity, kind, column, sortable, filterable]
      properties:
        key: { type: string }
        label: { type: string }
        entity: { type: string, enum: [work, work_part, person, organisation, collection] }
        kind: { type: string, enum: [text, number, enum, list, duration] }
        choices:
          type: array
          items:
            type: object
            required: [key, label]
            properties:
              key: { type: string }
              label: { type: string }
        column: { type: boolean }
        sortable: { type: boolean }
        filterable: { type: boolean }
        editable: { type: boolean, description: "A person may set it on the work's Edit; their value wins over every source." }

    FollowOption:
      type: object
      required: [key, label, many, choices, default]
      properties:
        key: { type: string }
        label: { type: string }
        many: { type: boolean, description: Takes a list of choices; otherwise exactly one. }
        choices:
          type: array
          items:
            type: object
            required: [key, label]
            properties:
              key: { type: string }
              label: { type: string }
        default:
          type: array
          items: { type: string }

    FollowRequest:
      type: object
      description: A follow of a person or organisation into one library.
      required: [category_id]
      properties:
        category_id: { type: integer, format: int64 }
        roles:
          type: array
          items: { type: string }
          description: A person's roles that count; empty or absent is any role.
        options:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: The media type's follow options by key; a missing key takes its default.
        back_catalogue: { type: boolean, description: Also add older works, not only new ones. }
        search: { type: boolean, description: Search for what the follow adds as soon as it is added. }

    Follow:
      type: object
      description: The caller's follow of a person or organisation in one library.
      required: [id, category_id, roles, options, back_catalogue, created_at]
      properties:
        id: { type: integer, format: int64 }
        category_id: { type: integer, format: int64 }
        roles:
          type: array
          items: { type: string }
        options:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        back_catalogue: { type: boolean }
        created_at: { type: integer, format: int64 }

    FollowCandidate:
      type: object
      required: [provider, external_id, title]
      properties:
        provider: { type: string }
        external_id: { type: string }
        title: { type: string }
        year: { type: integer, format: int64 }
        poster_url: { type: string }
        role: { type: string }

    FollowPreview:
      type: object
      required: [would_add, more, held, limit]
      properties:
        would_add:
          type: array
          items: { $ref: "#/components/schemas/FollowCandidate" }
        more: { type: integer, description: Beyond the limit, added by later runs. }
        held: { type: integer, description: Already in the library, or excluded. }
        limit: { type: integer, description: The most one run adds; 0 is no limit. }

    KnownFor:
      type: object
      required: [provider, external_id, kind, title]
      properties:
        provider: { type: string }
        external_id: { type: string }
        kind: { type: string, example: "tv", description: The provider's word for the work. }
        title: { type: string }
        year: { type: integer, format: int64 }
        poster_url: { type: string }
        role: { type: string, description: The character played or the job done. }
        work_id: { type: integer, format: int64, description: The library's work, when it holds it. }

    OrganisationEntry:
      type: object
      description: A label, network, studio or publisher with what it did in the libraries listed.
      required: [id, name, sort_name, kind, monitored, roles, works]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        sort_name: { type: string }
        kind: { type: string, example: "network" }
        country: { type: string }
        logo_url: { type: string }
        monitored: { type: boolean }
        roles:
          type: array
          items: { type: string }
        works: { type: integer, format: int64 }
        latest: { type: integer }

    OrganisationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OrganisationEntry" }
        next_cursor: { type: string }

    OrganisationDetail:
      type: object
      required: [id, name, sort_name, kind, monitored, ids, libraries, credits]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        sort_name: { type: string }
        kind: { type: string }
        country: { type: string }
        logo_url: { type: string }
        monitored: { type: boolean }
        ids:
          type: object
          additionalProperties: { type: string }
        libraries:
          type: array
          items: { $ref: "#/components/schemas/PersonLibrary" }
          description: Only libraries the caller may read.
        credits:
          type: array
          items: { $ref: "#/components/schemas/WorkCredit" }

    PersonDetail:
      allOf:
        - $ref: "#/components/schemas/Person"
        - type: object
          required: [aliases, genres, ids, libraries, credits]
          properties:
            biography:
              type: string
              description: From the providers, when one has it (ADR-8).
            image_url: { type: string, description: "A provider's photo, when one is known." }
            aliases:
              type: array
              items: { type: string }
            genres:
              type: array
              items: { type: string }
              description: Every genre tagged on any of their works; a person carries none of their own (ADR-32).
            ids:
              type: object
              additionalProperties: { type: string }
              description: Provider to the person's id there.
            libraries:
              type: array
              items: { $ref: "#/components/schemas/PersonLibrary" }
              description: Only libraries the caller may read; nothing reveals another.
            credits:
              type: array
              items: { $ref: "#/components/schemas/WorkCredit" }

    ExternalID:
      type: object
      description: One provider's id for a work, edition or part.
      required: [provider, external_id]
      properties:
        provider: { type: string, example: "musicbrainz:release-group" }
        external_id: { type: string }

    Edition:
      type: object
      required: [id, kind, label, is_default, external_ids]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, example: "official" }
        label: { type: string }
        year: { type: integer }
        format: { type: string, example: "CD" }
        catalogue_number: { type: string }
        barcode: { type: string }
        runtime_ms: { type: integer, format: int64 }
        is_default: { type: boolean }
        external_ids:
          type: array
          items: { $ref: "#/components/schemas/ExternalID" }

    WorkPart:
      type: object
      required: [id, media_ref, sort_key, monitored, external_ids]
      properties:
        id: { type: integer, format: int64 }
        media_ref: { type: string }
        sort_key: { type: string }
        title: { type: string }
        runtime_ms: { type: integer, format: int64 }
        date: { type: string }
        available_at: { type: string, format: date-time, description: When the part is out (an episode's air time); absent when unknown. }
        available_basis: { type: string, description: "How that time is known, as its source said it: \"tvmaze airstamp tz=America/New_York\"; absent when nothing says." }
        available_confidence: { type: string, enum: [unknown, low, medium, high], description: How sure the time is; a less sure one is waited out longer before the part counts as out. }
        out_grace_hours: { type: integer, format: int64, description: "Hours after its time (or the start of its date) it is waited for before it counts as out; set with available_confidence." }
        section: { type: string, description: "The heading the part sits under within its group, as the type places it: \"Disc 2\"; empty for none." }
        number: { type: string, description: "The number the part is shown with: a track's, an episode's." }
        alt_numbers:
          type: object
          additionalProperties: { type: string }
          description: The part's numbers under other schemes, by scheme ("absolute").
        credits:
          type: array
          items: { $ref: "#/components/schemas/Credit" }
          description: The part's own credits (an episode's guest stars, director, writers).
        monitored: { type: boolean }
        wanted:
          description: >-
            This track's own SINGLE desired_item, when one exists -- distinct
            from monitored, which only affects the album's own required_count.
          allOf: [{ $ref: "#/components/schemas/Wanted" }]
          nullable: true
        file:
          description: >-
            What is on disk for this part, absent when nothing is. Aligned
            through the same media_ref the album's own present_count is
            counted from, so the two can never disagree.
          allOf: [{ $ref: "#/components/schemas/PartFile" }]
          nullable: true
        external_ids:
          type: array
          items: { $ref: "#/components/schemas/ExternalID" }

    PartFile:
      type: object
      description: The file covering one part, and what probing measured of it.
      required: [media_object_id, bitrate_kbps, lossless]
      properties:
        media_object_id: { type: integer, format: int64 }
        audio_codec: { type: string }
        video_codec: { type: string }
        container: { type: string }
        extension:
          type: string
          description: The file's own type, "m4a" -- container is ffprobe's demuxer list.
        path:
          type: string
          description: Where the file is, relative to its root folder (its primary path when it has several).
        bitrate_kbps:
          type: integer
          format: int64
          description: 0 when the attribute probe has not measured this file yet.
        lossless: { type: boolean }
        size_bytes: { type: integer, format: int64 }
        resolution: { type: string }
        hdr: { type: string }
        audio_channels: { type: string }
        video_bitrate_kbps: { type: integer, format: int64 }
        audio_languages: { type: array, items: { type: string }, description: Language codes of the audio tracks the probe read. }
        subtitles: { type: array, items: { type: string }, description: Language codes of embedded and sidecar subtitles. }
        frame_rate: { type: number }
        crf: { type: number, description: The constant rate factor the encoder states. }
        meets_target:
          type: boolean
          description: Codec, file type and bitrate match the library's target. Absent when it sets none.
        meets_cutoff:
          type: boolean
          description: Good enough that upgrades stop. Absent when the library sets neither target nor cutoff.

    Credit:
      type: object
      description: One work-level credit (ADR-32) -- the person's own name, so a client never needs a second round-trip just to display it.
      required: [person_id, person_name, role]
      properties:
        person_id: { type: integer, format: int64 }
        person_name: { type: string }
        role: { type: string, example: "artist" }
        character: { type: string, description: Who an actor played; absent for any other role. }
        image_url: { type: string, description: The person's photo at its provider. }

    BulkResult:
      type: object
      description: How many rows a bulk action (section 21.7) matched, and, unless it was a preview, changed.
      required: [count]
      properties:
        count: { type: integer, format: int64 }

    WorkEdit:
      type: object
      required: [monitored, profile_id, tags]
      properties:
        monitored: { type: boolean }
        profile_id:
          type: integer
          format: int64
          nullable: true
          description: The album's own quality profile; null is its library's.
        tags:
          type: array
          items: { type: string }
          description: Tags the user assigned, by name.
        fields:
          type: object
          additionalProperties: { type: string }
          description: >-
            The type's editable facets the user set, by facet key (a series' type); empty or absent is the sources'
            value. Saving names only the facets it changes.

    Wanted:
      type: object
      description: >-
        The work's own album-level SET desired_item (section 19.6) -- what
        makes "9 of 12 tracks" a fact rather than on_disk's coarse badge.
      required: [id, monitored, present_count, state]
      properties:
        id: { type: integer, format: int64 }
        last_searched_at:
          type: integer
          format: int64
          description: Unix seconds of the last search for this item; absent means never.
        next_search_at:
          type: integer
          format: int64
          description: >-
            Unix seconds from when the automatic search may search this album again; absent when it
            will not (see automatic_search). Searched at the first hunt run after it, budget allowing.
        automatic_search:
          type: string
          description: >-
            Why the album is or is not searched on its own (F2), for an album only: the first of
            downloading, held (found, waiting for room in the client), no_indexer, off (no
            searches per hour), no_room (library below its free-space reserve), not_planned (just
            added; planned within 5 minutes), waiting_for_release, scheduled; not_wanted when it
            is unmonitored or complete.
          enum: [not_wanted, downloading, held, no_indexer, off, no_room, not_planned, waiting_for_release, scheduled]
        monitored: { type: boolean }
        required_count:
          type: integer
          format: int64
          nullable: true
          description: Null until a tracklist has been enriched -- never a guessed zero.
        present_count: { type: integer, format: int64 }
        state: { type: string, enum: [MISSING, PARTIAL, COMPLETE, UPGRADABLE] }

    WorkGroup:
      type: object
      required: [ref, label, desired_item_id, monitored, present_count, state]
      properties:
        ref: { type: string, description: "Empty for a group of the whole work; else its parts are \"<ref>:...\"." }
        label: { type: string, description: "As the media type names it: \"Season 3\", \"Specials\"." }
        desired_item_id: { type: integer, format: int64 }
        monitored: { type: boolean }
        present_count: { type: integer, format: int64 }
        required_count: { type: integer, format: int64 }
        state: { type: string, enum: [MISSING, PARTIAL, COMPLETE, UPGRADABLE] }
        last_searched_at: { type: string, format: date-time }
        next_out:
          type: string
          format: date-time
          description: When the group's next monitored part comes out, while nothing of it is owed yet ("Not out yet"); absent otherwise.

    WorkPartPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkPart" }
        next_cursor: { type: string }

    WorkDetail:
      type: object
      required:
        - can_request
        - id
        - media_type
        - title
        - sort_title
        - on_disk
        - added_at
        - updated_at
        - external_ids
        - editions
        - part_count
        - credits
        - genres
      properties:
        lead_id: { type: integer, format: int64, description: "The person the work is listed under (an album's artist)." }
        pictures:
          type: object
          additionalProperties: { type: string }
          description: The work's pictures at their providers, by kind (poster, fanart, logo); a person's own choice first.
        facets:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: The media type's own fields of this work, by facet key.
        groups:
          type: array
          description: The work's monitored-or-not groups (an album's one, a series' seasons), in order.
          items: { $ref: "#/components/schemas/WorkGroup" }
        can_request:
          type: boolean
          description: >-
            Whether the caller holds request in one of the album's libraries:
            searching, sending and monitoring it would be accepted.
        id: { type: integer, format: int64 }
        media_type: { type: string, example: "music" }
        library_ids:
          type: array
          items: { type: integer, format: int64 }
          description: The libraries that hold or want the work; a video work's own page lives under one of them.
        title: { type: string }
        sort_title: { type: string }
        year: { type: integer }
        runtime_ms: { type: integer, format: int64 }
        language: { type: string }
        description:
          type: string
          description: >-
            A Wikidata-sourced summary, when the work has a linked Wikidata
            entity (ADR-8). Absent otherwise -- MusicBrainz itself carries no
            such field.
        on_disk:
          type: boolean
          description: >-
            Whether this work is linked to any root folder at all. The
            coarsest possible "is there really a file for this" signal --
            per-track presence needs a media_object-to-work_part link this
            project does not have yet.
        added_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        external_ids:
          type: array
          items: { $ref: "#/components/schemas/ExternalID" }
        editions:
          type: array
          items: { $ref: "#/components/schemas/Edition" }
        credits:
          type: array
          items: { $ref: "#/components/schemas/Credit" }
        genres:
          type: array
          items: { type: string }
        part_count:
          type: integer
          format: int64
          description: How many parts the work has; the parts themselves are paged from GET /works/{id}/parts.
        wanted:
          allOf: [{ $ref: "#/components/schemas/Wanted" }]
          nullable: true
          description: Null when nothing has ever wanted this album -- no scan, no subscription, no request.

    SearchResult:
      type: object
      required: [work, score]
      properties:
        work: { $ref: "#/components/schemas/Work" }
        score:
          type: number
          description: >-
            Lower is a better match (bm25 rank, ascending). Not meaningfully comparable
            across two different queries.

    UnidentifiedCandidate:
      type: object
      description: >-
        One ranked candidate the ADR-24 chain found but was not confident
        enough to resolve automatically -- RunChain's merged Candidates,
        best first. Empty on a file that matched nothing at all.
      required: [strategy, confidence]
      properties:
        strategy: { type: string, example: "embedded-tag" }
        provider: { type: string, example: "musicbrainz:release-group" }
        external_id: { type: string }
        title: { type: string, description: What the candidate is called, when the strategy knows (a searched series' name). }
        confidence: { type: number }

    UnidentifiedFile:
      type: object
      required: [media_object_id, root_folder_id, rel_path, candidates, first_seen_at, last_seen_at]
      properties:
        media_object_id: { type: integer, format: int64 }
        root_folder_id: { type: integer, format: int64 }
        rel_path: { type: string }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/UnidentifiedCandidate" }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }

    IdentificationEvidence:
      type: object
      description: >-
        One fact a verdict rests on. Kinds include title, artist, release_type,
        edition, edition_title, edition_date, edition_country, edition_status,
        edition_tracks, files_matched ("7/12"), files_supported, distance,
        accepted, contradicted, recall and outcome.
      required: [kind, detail]
      properties:
        kind: { type: string }
        detail: { type: string }

    IdentificationCandidate:
      type: object
      required: [strategy, confidence, evidence]
      properties:
        strategy: { type: string }
        provider: { type: string }
        external_id: { type: string }
        confidence: { type: number, format: float }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/IdentificationEvidence" }

    IdentificationPass:
      type: object
      description: >-
        One pass of a run. pass is embedded_tags, album_match, text_search,
        fingerprint, track_match or folder_siblings. outcome is identified,
        none or failed; embedded_tags also answers retired, an album ID
        MusicBrainz no longer knows; album_match answers no_candidate,
        insufficient_evidence, ambiguous or contradictory instead, and unplaced
        for a file the identified album has no track for; folder_siblings
        answers joined, siblings_disagree or no_identified_sibling.
      required: [pass, outcome, candidates]
      properties:
        pass: { type: string }
        outcome: { type: string }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/IdentificationCandidate" }

    IdentificationAttempt:
      type: object
      required: [attempted_at, outcome, passes]
      properties:
        attempted_at: { type: string, format: date-time }
        outcome:
          type: string
          enum: [identified, queued, retry]
        passes:
          type: array
          items: { $ref: "#/components/schemas/IdentificationPass" }

    IdentificationAttemptList:
      type: object
      required: [file, items]
      properties:
        file: { $ref: "#/components/schemas/UnidentifiedFile" }
        items:
          type: array
          items: { $ref: "#/components/schemas/IdentificationAttempt" }

    UnidentifiedPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UnidentifiedFile" }
        next_cursor:
          type: string
          description: >-
            Empty on the last page, which is how a client knows to stop without
            one more request that returns nothing.

    ExclusionPattern:
      type: object
      description: >-
        "A file shaped like this is not media" -- by name or extension glob,
        never by content (ADR-53 part 1). `media_type` absent means every
        media type; `category_id` absent means every category of that
        media type.
      required: [id, pattern, action, note, builtin, enabled]
      properties:
        id: { type: integer, format: int64 }
        pattern: { type: string, example: "*.exe" }
        action:
          type: string
          enum: [ignore, refuse]
          description: >-
            `ignore` skips the file silently. `refuse` poisons the whole
            unit it is found in -- nothing in that unit imports.
        media_type: { type: string }
        category_id: { type: integer, format: int64 }
        note:
          type: string
          description: Why this pattern exists, shown wherever it fires.
        builtin:
          type: boolean
          description: A shipped default -- still editable and removable.
        enabled: { type: boolean }

    ExclusionPatternWrite:
      type: object
      required: [pattern, action]
      properties:
        pattern: { type: string, example: "*.exe" }
        action: { type: string, enum: [ignore, refuse] }
        media_type: { type: string }
        category_id: { type: integer, format: int64 }
        note: { type: string }
        enabled: { type: boolean, default: true }

    QualityProfile:
      type: object
      description: >-
        ADR-40's policy: hard gates, then lexicographic tiers, then an
        additive score. `rules` and `upgrade` are kept as opaque JSON here --
        internal/identify/score owns that shape (Parse/ParseUpgrade); this
        layer only checks a name and that they decode (settings.
        validateQualityProfile).
      required: [id, name, rules, upgrade, media_type]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        media_type:
          type: string
          description: What the profile judges; a library lists only profiles of its own media type.
        rules:
          type: string
          description: ADR-40's rule JSON -- internal/identify/score.Parse's own shape.
        upgrade:
          type: string
          description: ADR-40's upgrade JSON -- internal/identify/score.ParseUpgrade's own shape.

    QualityProfileWrite:
      type: object
      required: [name, rules, upgrade]
      properties:
        name: { type: string, minLength: 1 }
        media_type:
          type: string
          description: Set when a profile is created, music when absent; an update cannot change it.
        rules: { type: string }
        upgrade: { type: string }

    LanguageProfile:
      type: object
      description: >-
        Section 19.8's policy: language is its own axis, belonging to a
        category rather than a media type. Required lists use any_of
        semantics -- at least one listed language must be present, evaluated
        from the probe, never the release name. An empty preferred/required
        list is valid (some categories, e.g. music, have no language policy
        at all).
      required:
        [id, name, audio_preferred, audio_required, subtitle_preferred,
         subtitle_required, prefer_original_audio, reject_dubbed]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        audio_preferred: { type: array, items: { type: string } }
        audio_required: { type: array, items: { type: string } }
        subtitle_preferred: { type: array, items: { type: string } }
        subtitle_required: { type: array, items: { type: string } }
        prefer_original_audio: { type: boolean }
        reject_dubbed: { type: boolean }

    LanguageProfileWrite:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        audio_preferred: { type: array, items: { type: string } }
        audio_required: { type: array, items: { type: string } }
        subtitle_preferred: { type: array, items: { type: string } }
        subtitle_required: { type: array, items: { type: string } }
        prefer_original_audio: { type: boolean, default: false }
        reject_dubbed: { type: boolean, default: false }

    BlockedContentEntry:
      type: object
      description: >-
        Bytes that never enter the library again (ADR-53 part 2), keyed on
        content hashes, never on a filename (Invariant 82). At least one of
        `oshash`/`quick_hash`/`chromaprint`/`phash` is always present.
      required:
        - id, size_bytes, reason, title, release_group, source, created_at, hit_count
      properties:
        id: { type: integer, format: int64 }
        oshash: { type: string }
        quick_hash: { type: string }
        chromaprint: { type: string }
        phash: { type: string }
        size_bytes: { type: integer, format: int64 }
        reason:
          type: string
          enum: [FAKE, MISLABELLED, CORRUPT, UNWANTED, EXECUTABLE]
        note: { type: string }
        media_type: { type: string }
        title:
          type: string
          description: What the blocked release claimed to be, for the UI.
        release_group: { type: string }
        source: { type: string, enum: [user, auto] }
        expires_at:
          type: string
          format: date-time
          description: Absent means permanent -- manual blocks always are.
        created_at: { type: string, format: date-time }
        hit_count:
          type: integer
          format: int64
          description: How many times this block has fired since it was created.
        last_hit_at: { type: string, format: date-time }

    RemoveAndBlockRequest:
      type: object
      description: >-
        Each step is independently requestable (architecture.md section
        10.8's own text) -- requesting none of the four is accepted and
        does nothing.
      properties:
        recycle_bin: { type: boolean, default: false }
        recycle_reason:
          type: string
          enum: [rejected_worse, replaced, junk, user_delete, failed_import]
          default: user_delete
        recycle_retain_hours:
          type: integer
          default: 168
          description: How long the recycled copy survives before Sweep purges it.
        block: { type: boolean, default: false }
        oshash: { type: string }
        quick_hash: { type: string }
        block_reason:
          type: string
          enum: [FAKE, MISLABELLED, CORRUPT, UNWANTED, EXECUTABLE]
          default: FAKE
        block_note: { type: string }
        block_title: { type: string }
        release_group: { type: string }
        blocklist: { type: boolean, default: false }
        indexer_id: { type: integer, format: int64 }
        guid: { type: string }
        content_hash: { type: string }
        blocklist_title: { type: string }
        desired_item_id: { type: integer, format: int64 }
        reopen: { type: boolean, default: false }

    RemoveAndBlockResult:
      type: object
      description: What the action actually did -- each field only set when its own step ran.
      required: [recycled_paths, cross_device_deletes, reopened_items]
      properties:
        recycled_paths:
          type: array
          items: { type: string }
          description: The recycle bin path each copy landed at, one per copy actually moved.
        cross_device_deletes:
          type: integer
          description: >-
            Copies that turned out to be on a different filesystem than
            their own recycle bin directory -- deleted directly instead of
            recycled (section 10.8), unrestorable.
        block_id:
          type: integer
          format: int64
          description: Present when `block` was requested.
        blocklist_id:
          type: integer
          format: int64
          description: Present when `blocklist` was requested.
        reopened_items:
          type: array
          items: { type: integer, format: int64 }
          description: Every desired_item id detached and recomputed.

    PrioritySettings:
      type: object
      description: ADR-36's trigger weights and ADR-55's release-date freshness window.
      required: [user_request_weight, new_release_weight, gap_weight, upgrade_weight, new_release_days]
      properties:
        user_request_weight: { type: integer, format: int64, description: Bigger is more urgent. Default 40. }
        new_release_weight: { type: integer, format: int64, description: Bigger is more urgent. Default 30. }
        gap_weight: { type: integer, format: int64, description: Bigger is more urgent. Default 20. }
        upgrade_weight: { type: integer, format: int64, description: Bigger is more urgent. Default 10. }
        new_release_days:
          type: integer
          format: int64
          description: Days after release an item still counts as new rather than a gap. Default 7.
        rss_fresh_hours:
          type: integer
          format: int64
          description: >-
            Hours after an RSS feed first shows a release for a wanted album that it still counts as new. Default 48.
            Always answered; omitted on a PATCH leaves it alone.
        searches_per_hour:
          type: integer
          format: int64
          description: >-
            Missing albums searched automatically each hour, most urgent first; 0 turns automatic
            searching off. Default 12. Always answered; omitted on a PATCH leaves it alone.
        hunt_mode:
          type: string
          enum: [oldest_searched, newest_searched, oldest_release, newest_release, random_oldest_searched]
          description: >-
            The order the automatic search takes wanted albums in within a share of the budget (new
            releases 40%, gaps 40%, upgrades 20%, what one leaves unused going to the others). Default
            oldest_searched. Always answered; omitted on a PATCH leaves it alone.

    MetadataSource:
      type: string
      description: >-
        A metadata source. brainzmash and musicbrainz-proxy are third-party
        proxies of musicbrainz; musicbrainz is the direct upstream and cannot
        be removed from the order, only reordered.
      enum: [brainzmash, musicbrainz-proxy, musicbrainz]

    MetadataSettings:
      type: object
      description: The metadata providers' own settings.
      required: [brainzmash_user_agent]
      properties:
        brainzmash_user_agent:
          type: string
          description: >-
            Sent to BrainzMash, whose front door refuses agents not starting
            "Lidarr/". Printable ASCII, 1-256 characters. Default Lidarr/2.9.6.4552.
        source_order:
          type: array
          description: >-
            Which metadata sources are tried, in order. A source left out is
            not consulted at all, except musicbrainz, which always answers as
            a last resort. Omitted on a PATCH leaves the stored order alone.
          items: { $ref: "#/components/schemas/MetadataSource" }
        cover_sources:
          type: array
          description: >-
            Where album covers come from, in order; each fills only covers the
            earlier ones left missing. A source left out is not used. Omitted
            on a PATCH leaves it alone.
          items:
            type: string
            enum: [coverartarchive, embedded, theaudiodb]
        tv_sources:
          type: array
          description: >-
            Which TV provider supplies a series' text, genres, rating and artwork first, in order; one left out is
            not used. Numbering stays with TheTVDB's. Omitted on a PATCH leaves it alone.
          items:
            type: string
            enum: [skyhook, tvmaze, tmdb, tvdb, anilist]
        wikidata:
          type: boolean
          description: Artist photos and biographies from Wikidata. Omitted on a PATCH leaves it alone.
        acoustid:
          type: boolean
          description: >-
            Fingerprint identification, which also needs an API key. Switching it
            back on re-runs what it skipped. Omitted on a PATCH leaves it alone.
        acoustid_api_key:
          allOf: [{ $ref: "#/components/schemas/SecretMask" }]
          description: >-
            Whether an AcoustID application key is stored. Read-only here and
            ignored on a PATCH; it is written through POST
            /metadata/acoustid/apikey. Never returned, not even masked --
            saying whether one exists is all a screen asking for one needs,
            and decrypting it to render would be gratuitous (ADR-14).
        theaudiodb:
          type: boolean
          description: Artist photos and biographies from TheAudioDB where Wikidata has none. Omitted on a PATCH leaves it alone.
        theaudiodb_api_key:
          allOf: [{ $ref: "#/components/schemas/SecretMask" }]
          description: Whether an own TheAudioDB key is stored; without one the public key is used. Read-only here.
        tmdb_api_key:
          allOf: [{ $ref: "#/components/schemas/SecretMask" }]
          description: Whether the user's own TMDB credential is stored. Read-only here; written through POST /metadata/tmdb/apikey.
        tvdb_api_key:
          allOf: [{ $ref: "#/components/schemas/SecretMask" }]
          description: Whether an own TheTVDB key is stored; without one the built-in project key is used. Read-only here.
        people_backfill_per_run:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000
          description: >-
            How many artists one enrichment run gives a photo and biography.
            Default 200. Omitted on a PATCH leaves it alone.
        availability_grace_hours:
          type: object
          description: >-
            How many hours after an episode's time it is waited for before it counts as missing and is searched for,
            by how sure the time is: stated exactly (default 2), worked out by a provider (12), a date alone (36).
            0 to 336 each. Omitted on a PATCH leaves them alone.
          required: [high, medium, low]
          properties:
            high: { type: integer, format: int64, minimum: 0, maximum: 336 }
            medium: { type: integer, format: int64, minimum: 0, maximum: 336 }
            low: { type: integer, format: int64, minimum: 0, maximum: 336 }

    FileManagement:
      type: object
      description: >-
        Sonarr's File Management and Permissions for one library. The recycling
        bin is Solarr's recycle bin: nothing is deleted directly, so only how long
        it keeps what this library removes is set here.
      required: [propers_repacks, rescan_after_refresh, change_file_date, recycle_retention_days,
                 delete_empty_folders, create_empty_artist_folders, unmonitor_deleted,
                 merge_artist_aliases, set_permissions, chmod_folder, chown_group]
      properties:
        shared_file_fallback:
          type: string
          enum: [copy, symlink]
          description: >-
            How a file one broadcast shares with another series reaches this library's series when the two are on
            different filesystems and no link can be made: a second copy (the default) or a symbolic link. Omitted
            on a save keeps what is stored.
        media_server_files:
          type: boolean
          description: >-
            Write what Jellyfin and Kodi read beside the library's files: nfo files with the provider ids, and the
            series' poster, fanart, banner and logo. Only where none exists, never on a read-only root. Omitted on a
            save keeps what is stored.
        import_extra_files:
          type: boolean
          description: >-
            Sonarr's and Lidarr's "Import Extra Files": bring files with the listed extensions along with the tracks or
            episodes they are named after. Each library starts with its media type's choice (TV on, for subtitles).
            Omitted on a save keeps what is stored.
        extra_file_extensions:
          type: array
          description: >-
            Extensions without the dot, such as srt. A file named like a track follows the track's new name; any other
            keeps its own name in the album folder. In a TV library only a file named after an episode comes along,
            keeping what follows the name (".en.srt"). Omitted on a save keeps what is stored.
          items: { type: string }
        propers_repacks:
          type: string
          enum: [prefer_and_upgrade, do_not_upgrade, do_not_prefer]
        rescan_after_refresh:
          type: string
          enum: [always, after_manual, never]
        change_file_date:
          type: string
          enum: [none, release_date]
        recycle_retention_days: { type: integer, format: int64, minimum: 1, maximum: 365 }
        delete_empty_folders: { type: boolean }
        create_empty_artist_folders: { type: boolean }
        unmonitor_deleted:
          type: boolean
          description: Lidarr's "Ignore Deleted Tracks" -- an album losing a file is unmonitored.
        merge_artist_aliases:
          type: boolean
          description: >-
            An artist stored under several names (folders, aliases) is merged into one after each
            disk scan: the identified artist wins, else the name with the most albums.
        set_permissions: { type: boolean }
        chmod_folder:
          type: string
          description: Octal, such as 755; files get the same without the execute bits.
        chown_group:
          type: string
          description: A group name or number; empty leaves the group alone.

    Tagging:
      type: object
      description: >-
        What the tag writer puts into this library's files once enrichment has
        identified them (revision D3, widened 2026-09-29). Only the library's own
        root folders are written, never a read-only one and never a download folder.
      required: [write_ids, replace_ids, write_metadata, embed_cover, navidrome]
      properties:
        write_ids:
          type: boolean
          description: Fill the MusicBrainz ids a file lacks.
        replace_ids:
          type: boolean
          description: Overwrite ids a file carries that differ from the current ones.
        write_metadata:
          type: boolean
          description: Write album, album artist, track title, track and disc number, date and genre.
        embed_cover:
          type: boolean
          description: Embed the fetched cover into files that carry no picture.
        navidrome:
          type: boolean
          description: >-
            Navidrome's profile: also fill the track artist's tags and MusicBrainz id, and put a cover.jpg in each
            album folder that has no cover file. Nothing a file or folder already has is replaced.

    ImportSettings:
      type: object
      description: >-
        ADR-48's commit-line knob (import.auto_commit_confidence) and the
        transfer ladder import walks when it places a file.
      required: [auto_commit_confidence]
      properties:
        auto_commit_confidence:
          type: number
          format: float
          description: 0.75-0.95, the section 11.4 table's five named levels. Default 0.90.
        transfer_ladder:
          type: array
          description: >-
            Transfer methods tried in order until one succeeds. Each may appear
            at most once and the list may not be empty. Omitted on a PATCH
            leaves the stored order alone. Default
            reflink, hardlink, move, copy; symlink only when added.
          items: { $ref: "#/components/schemas/TransferMethod" }
        rename_on_import:
          type: boolean
          description: >-
            Whether a committed file is named by the library's own template
            (on, the default) or keeps the name it arrived with. The folder
            structure comes from the template either way. Omitted on a PATCH
            leaves the stored value alone.

    TransferMethod:
      type: string
      description: >-
        How import gets a file into the library. reflink clones it
        copy-on-write, sharing disk blocks but presenting as an independent
        file; hardlink makes a second directory entry for the same bytes;
        move renames it, or copies and deletes the source when it cannot;
        copy writes independent bytes; symlink leaves the library pointing at
        the source. Only reflink and hardlink avoid using more disk space,
        only move removes the source, and only symlink leaves the library
        dependent on it.
      enum: [reflink, hardlink, move, copy, symlink]

    ImportInspectRequest:
      type: object
      description: Where to look, and what kind of import this is (ADR-48).
      required: [source_path]
      properties:
        source_path: { type: string }
        origin:
          type: string
          enum: [manual, acquisition, watched, adoption]
          description: Defaults to manual when omitted.
        category_id:
          type: integer
          format: int64
          description: The target category, when known up front. Omitted means "decide per unit".
        preview:
          type: boolean
          description: >-
            Hold every unit for review instead of placing the confident ones.
            The run demands a confidence no candidate can reach, so each unit
            lands QUEUE with its candidates intact and
            `POST /import/sessions/{id}/commit` places the ones you pick.
            Defaults to false.
        add_unverified:
          type: boolean
          default: false
          description: >-
            A folder nothing identified still becomes an album, named by its own tags or folder and
            marked unverified (D6); not searched for, identified later from the review. Only for a
            manual, non-preview run.

    ImportInspectResult:
      type: object
      required: [enqueued]
      properties:
        enqueued: { type: boolean }

    ImportCommitHeldRequest:
      type: object
      description: Which held units to commit. An empty or absent list means all of them.
      properties:
        unit_ids:
          type: array
          items: { type: integer, format: int64 }

    ImportCommitHeldResult:
      type: object
      description: >-
        POST .../commit's own outcome: every QUEUE unit asked for, committed
        best-effort with its own top-ranked candidate.
      required: [units_committed, errors]
      properties:
        units_committed: { type: integer, format: int64 }
        errors:
          type: array
          items: { type: string }
          description: One entry per unit that could not be committed; never fatal to the rest.

    ImportRevertRequest:
      type: object
      properties:
        recycle_retain_hours:
          type: integer
          description: >-
            Defaults to the session's library's recycling bin retention (its File
            Management), one week unless changed.

    ImportPlacementResult:
      type: object
      description: >-
        POST .../category's own outcome: every unit the session had already
        decided COMMIT but not yet placed, placed best-effort.
      required: [units_placed, errors]
      properties:
        units_placed: { type: integer, format: int64 }
        errors:
          type: array
          items: { type: string }
          description: One entry per unit that could not be placed; never fatal to the rest.

    ImportRevertResult:
      type: object
      required: [units_reverted, works_deleted, editions_deleted, recycled_paths]
      properties:
        units_reverted: { type: integer, format: int64 }
        works_deleted:
          type: integer
          format: int64
          description: Only a work this session's own CommitUnit created, never one it matched.
        editions_deleted: { type: integer, format: int64 }
        recycled_paths:
          type: array
          items: { type: string }

    ImportSession:
      type: object
      description: One inspection-and-import run over one source path (ADR-48).
      required:
        - id
        - source_path
        - origin
        - state
        - threshold
        - units_total
        - units_committed
        - units_queued
        - units_skipped
        - units_failed
        - bytes_imported
        - started_at
      properties:
        id: { type: integer, format: int64 }
        source_path: { type: string }
        origin: { type: string, enum: [manual, acquisition, watched, adoption] }
        category_id: { type: integer, format: int64 }
        state:
          type: string
          enum: [INSPECTING, IMPORTING, CANCELLING, DONE, FAILED, REVERTED, CANCELLED]
        threshold:
          type: number
          format: float
          description: import.auto_commit_confidence's value in force for this run.
        units_total: { type: integer, format: int64 }
        units_estimated:
          type: integer
          format: int64
          description: >-
            A cheap, tag-free pre-count of what Walk will find (todo 4.21's
            ETA), absent until the estimate pass finishes. May undercount a
            directory tag evidence alone would have split further.
        units_committed: { type: integer, format: int64 }
        units_queued: { type: integer, format: int64 }
        units_skipped: { type: integer, format: int64 }
        units_failed: { type: integer, format: int64 }
        bytes_imported:
          type: integer
          format: int64
          description: Only committed units' bytes.
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        error: { type: string }
        dismissed_at:
          type: string
          format: date-time
          description: >-
            When this finished session was hidden from the Import screen.
            Absent while it is still shown. Dismissal hides, never deletes:
            the session is still what a revert reads.

    ImportEvidenceSignal:
      type: object
      required: [kind]
      properties:
        kind: { type: string }
        detail: { type: string }

    ImportEvidence:
      type: object
      description: Every GROUP signal that shaped this unit's boundary (ADR-10 shape).
      properties:
        signals:
          type: array
          items: { $ref: "#/components/schemas/ImportEvidenceSignal" }
        ambiguous:
          type: boolean
          description: >-
            True when grouping had to infer a boundary from a weaker signal
            rather than a decisive one.

    ImportCandidate:
      type: object
      description: One IDENTIFY strategy's ranked answer for a unit.
      required: [strategy, confidence]
      properties:
        strategy: { type: string }
        work_id: { type: integer, format: int64 }
        provider: { type: string }
        external_id: { type: string }
        confidence: { type: number, format: float }
        evidence:
          type: array
          description: The facts the candidate's verdict rests on, as IdentificationCandidate's.
          items: { $ref: "#/components/schemas/IdentificationEvidence" }

    TransferMethodCount:
      type: object
      description: How many of a unit's files arrived by one transfer method.
      required: [method, files]
      properties:
        method: { $ref: "#/components/schemas/TransferMethod" }
        files: { type: integer, format: int64 }

    ImportUnit:
      type: object
      description: One unit ADR-48's pipeline found and decided.
      required: [id, session_id, rel_path, shape, file_count, bytes, confidence, decision]
      properties:
        id: { type: integer, format: int64 }
        session_id: { type: integer, format: int64 }
        rel_path:
          type: string
          description: The unit's own root, relative to the session's source_path.
        shape:
          type: string
          enum: [SINGLE, SET, PACK, MULTI_DISC]
        file_count: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }
        confidence: { type: number, format: float }
        decision:
          type: string
          enum: [COMMIT, QUEUE, SKIP, FAILED]
        work_id:
          type: integer
          format: int64
          description: >-
            Non-null once this unit is actually placed in the library, not
            merely decided COMMIT -- null with decision=COMMIT means the
            session has no category_id to place into, or placement has not
            run yet.
        edition_id: { type: integer, format: int64 }
        evidence: { $ref: "#/components/schemas/ImportEvidence" }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/ImportCandidate" }
        reason: { type: string }
        pack_id:
          type: integer
          format: int64
          description: Non-null once todo 4.11's own detection finds this unit belongs to a pack.
        transfer_methods:
          type: array
          description: >-
            How this unit's files were actually placed, one entry per method
            used. Absent for a unit that has not been committed, and for one
            committed before the method was recorded -- a reflink and a copy
            are indistinguishable on disk, so an unrecorded placement is
            reported as unknown rather than guessed.
          items: { $ref: "#/components/schemas/TransferMethodCount" }

    Pack:
      type: object
      description: One source, many works (ADR-50, todo 4.11) -- a provenance fact, not an identity tier.
      required: [id, kind, detected_from, confidence, title, member_count, resolved_count, created_at]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [DISCOGRAPHY, BOX_SET, ANTHOLOGY, COMPILATION] }
        detected_from: { type: string, enum: [structure, structure_and_name] }
        confidence: { type: number, format: float }
        title: { type: string, description: As released, for display only. }
        acquisition_id: { type: integer, format: int64 }
        session_id: { type: integer, format: int64 }
        member_count: { type: integer, format: int64 }
        resolved_count:
          type: integer
          format: int64
          description: Members that identified and placed.
        created_at: { type: string, format: date-time }

    PackItem:
      type: object
      description: One member of a pack.
      required: [ord, state]
      properties:
        ord: { type: integer, format: int64 }
        work_id: { type: integer, format: int64 }
        edition_id: { type: integer, format: int64 }
        import_unit_id: { type: integer, format: int64 }
        state: { type: string, enum: [RESOLVED, QUEUED, FAILED, SKIPPED] }

    PackDetail:
      type: object
      description: One pack plus its own members, in the order they were recorded.
      required: [pack, items]
      properties:
        pack: { $ref: "#/components/schemas/Pack" }
        items:
          type: array
          items: { $ref: "#/components/schemas/PackItem" }

    LibraryCategory:
      type: object
      description: >-
        A category as a navigation target: no `permission` field, since the
        list is already narrowed to what the caller may read (unlike `Me`'s
        `categories`, which reports the caller's level on each).
      required: [id, media_type, name]
      properties:
        id: { type: integer, format: int64 }
        media_type: { type: string, example: "music" }
        name: { type: string }
        kind: { type: string, description: "The library's kind within its media type; absent for none." }
        works:
          type: integer
          description: >-
            From the counter table (section 21.12), never a live COUNT. 0 until
            the reconciliation sweep has run at least once.
        files:
          type: integer

    CategorySettings:
      type: object
      description: >-
        A category's full settings-side detail (ADR-27's policy boundary),
        administrator only -- richer than LibraryCategory, which stays lean
        for the many navigation callers (root folder pickers, *Arr import,
        the sidebar) that never need any of this.
      required: [id, media_type, name, priority_rank, monitor_discovered]
      properties:
        id: { type: integer, format: int64 }
        media_type: { type: string, example: "music" }
        name: { type: string }
        priority_rank:
          type: integer
          format: int64
          description: Lower is more important (ADR-36's composite acquisition priority).
        quality_profile_id: { type: integer, format: int64 }
        language_profile_id: { type: integer, format: int64 }
        monitor_discovered:
          type: string
          enum: [monitored, unmonitored, none]
          description: >-
            What a scan does with an album it finds on disk that nobody
            asked for (section 19.6, todo 4.4).
        tv_monitor:
          type: string
          enum: [existing, all, none]
          description: >-
            What a scan monitors of a series it finds in a TV library: only the
            episodes on disk (existing), every episode (all), or none.
        kind: { type: string, description: "The library's kind within its media type (MediaTypeInfo.kinds); absent for none." }

    CategoryWrite:
      type: object
      required: [name, priority_rank]
      properties:
        name: { type: string, minLength: 1 }
        priority_rank: { type: integer, format: int64, minimum: 0 }
        quality_profile_id:
          type: integer
          format: int64
          description: Absent or null clears it -- no default profile.
        language_profile_id:
          type: integer
          format: int64
          description: Absent or null clears it -- no default profile.
        monitor_discovered:
          type: string
          enum: [monitored, unmonitored, none]
          default: monitored
        tv_monitor:
          type: string
          enum: [existing, all, none]
          description: TV libraries only; absent leaves it as it is.
        kind:
          type: string
          description: One of the media type's kinds; absent leaves it. Changing it applies no defaults, it only says what the library is.

    Library:
      type: object
      description: >-
        A category as a navigation root (ADR-54): its declared entity levels
        replace the old flat works/files pair -- see LibraryLevel.
      required: [id, media_type, name, levels, permission]
      properties:
        id: { type: integer, format: int64 }
        media_type: { type: string, example: "music" }
        name: { type: string }
        permission:
          allOf: [{ $ref: "#/components/schemas/Permission" }]
          description: >-
            What the caller may do here, so a screen offers only the actions
            the server would accept: searching and monitoring need request.
        levels:
          type: array
          items: { $ref: "#/components/schemas/LibraryLevel" }
        last_level:
          type: string
          description: >-
            The level key the caller last visited in this library
            (user_preference), absent if never visited.
        wanted:
          type: integer
          description: >-
            Albums (works) in this library with a monitored item not yet
            complete: the Wanted page's total. From the counter table, never
            a live COUNT; absent until first counted.

    LibraryLevel:
      type: object
      description: >-
        One browsable entity level a media type declares (ADR-23's
        NavigationLevels extension point). Core never learns what an album
        or a season is -- key, label and entity are entirely the media
        type's own vocabulary.
      required: [key, label, entity, default_sort]
      properties:
        key:
          type: string
          description: Stable identifier used in the URL and in GET /libraries/{id}/{level}.
          example: "albums"
        label:
          type: string
          example: "Albums"
        entity:
          type: string
          enum: [work, work_part, person, organisation, collection]
        default_sort:
          type: string
          example: "title"
        count:
          type: integer
          description: >-
            From the counter table (section 21.12), never a live COUNT.
            Absent when this entity has no counter yet.

    LibraryLevelItem:
      type: object
      description: >-
        One row of one navigation level, whatever entity it wraps (a work, a
        work_part, a person). Deliberately generic (see listLibraryLevel).
      required: [id, title]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        subtitle:
          type: string
          description: A secondary line -- an artist credit, an album title, whatever the level has.
        year: { type: integer }
        monitored: { type: boolean }
        work_id:
          type: integer
          format: int64
          description: >-
            The work (album) this row's own cover art comes from -- set on a
            Tracks-level row (the track's own parent album), absent on an
            Albums row (its own id already is the work id) or an Artists row
            (see GET /people/{id}/artwork instead).
        present_count:
          type: integer
          format: int64
          description: >-
            How much of this row is here: tracks for an album, complete
            albums for an artist. Absent on a level that counts neither.
        required_count:
          type: integer
          format: int64
          description: How much it would take to be complete.
        status:
          type: string
          enum: [complete, incomplete, downloading, unreleased, unverified]
          description: >-
            PersonWork.status' own vocabulary, so the poster wall and the
            artist page colour a row the same way. Absent on a level with
            nothing to colour.
        artist_cover:
          type: boolean
          description: >-
            An album with no cover of its own, whose artwork falls back to its
            primary artist's image; the poster marks it. Albums only.
        size_bytes:
          type: integer
          format: int64
          description: Size on disk of the album's files. Albums only.
        overview:
          type: string
          description: The album's description, cut to a paragraph, for the Overview view. Albums only.

    LibraryLevelPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LibraryLevelItem" }
        next_cursor:
          type: string
          description: Empty on the last page.

    ImportList:
      type: object
      description: >-
        A per-library *Arr-shaped import list (ADR-38, todo 4.16).
        Scaffolding only -- nothing syncs against it yet (stage 12).
      required: [id, category_id, name, type, cadence_hours, monitor, exclusions, enabled]
      properties:
        id: { type: integer, format: int64 }
        category_id: { type: integer, format: int64 }
        name: { type: string }
        type:
          type: string
          description: >-
            Free-form for now -- no music-specific list type is baked in
            ahead of a real provider integration to name one against.
        url: { type: string }
        cadence_hours: { type: integer }
        monitor: { type: boolean }
        quality_profile_id: { type: integer, format: int64 }
        exclusions:
          type: string
          description: Free text; nothing reads this yet, since there is no sync job to enforce it.
        enabled: { type: boolean }

    ImportListWrite:
      type: object
      required: [name, type, cadence_hours]
      properties:
        name: { type: string, minLength: 1 }
        type: { type: string, minLength: 1 }
        url: { type: string }
        cadence_hours: { type: integer, minimum: 1 }
        monitor: { type: boolean, default: true }
        quality_profile_id: { type: integer, format: int64 }
        exclusions: { type: string }
        enabled: { type: boolean, default: true }

    GateResult:
      type: object
      description: A hard requirement, evaluated before any comparison (ADR-40 stage 1).
      required: [gate, passed, wanted, got]
      properties:
        gate: { type: string, example: "audio_language" }
        passed: { type: boolean }
        wanted: { type: string, example: "any of [en de]" }
        got: { type: string, example: "ru" }

    TierValue:
      type: object
      description: >-
        One compare-list dimension's position (ADR-40 stage 2). Equal rank
        between two candidates means this dimension did not decide.
      required: [dimension, rank, label, detail]
      properties:
        dimension: { type: string, example: "video_codec" }
        rank: { type: integer, description: Lower is better. }
        label: { type: string, example: "hevc" }
        detail: { type: string }

    ScoreComponent:
      type: object
      description: One additive-stage contribution (ADR-40 stage 3). Breaks ties only.
      required: [rule, label, delta]
      properties:
        rule: { type: string, example: "preferred-groups" }
        label: { type: string }
        delta: { type: number }

    Rejection:
      type: object
      description: One failed gate, as data rather than a formatted string (ADR-10).
      required: [rule, field, wanted, got]
      properties:
        rule: { type: string }
        field: { type: string }
        wanted: { type: string }
        got: { type: string }

    Deferral:
      type: object
      description: A reason this candidate is not actionable yet.
      required: [reason]
      properties:
        reason: { type: string }

    Decision:
      type: object
      description: >-
        ADR-10: reasons are the result, never a side channel. score is derived
        from components, never computed separately, so the explanation and the
        decision cannot drift apart.
      required: [outcome, gates, quality, components, rejections, deferrals, score]
      properties:
        outcome: { type: string, enum: [ACCEPT, REJECT, DEFER] }
        gates:
          type: array
          items: { $ref: "#/components/schemas/GateResult" }
        quality:
          type: array
          items: { $ref: "#/components/schemas/TierValue" }
        components:
          type: array
          items: { $ref: "#/components/schemas/ScoreComponent" }
        rejections:
          type: array
          items: { $ref: "#/components/schemas/Rejection" }
        deferrals:
          type: array
          items: { $ref: "#/components/schemas/Deferral" }
        score:
          type: number
          description: Decision.Score() -- the sum of components.

    CandidateDecision:
      type: object
      description: >-
        One release an indexer answered, decided against a specific desired
        item (section 10.1/12). components/rejections/deferrals are the same
        shape Decision itself carries -- quality is omitted here since a
        candidate is compared against a profile, not against another
        candidate (no ADR-40 tiered comparison to show).
      required:
        [
          id, candidate_id, outcome, score, components, rejections, deferrals,
          indexer_id, guid, title, protocol, source, decided_at,
        ]
      properties:
        id: { type: integer, format: int64 }
        candidate_id: { type: integer, format: int64 }
        outcome: { type: string, enum: [ACCEPT, REJECT, DEFER] }
        score: { type: number }
        components:
          type: array
          items: { $ref: "#/components/schemas/ScoreComponent" }
        rejections:
          type: array
          items: { $ref: "#/components/schemas/Rejection" }
        deferrals:
          type: array
          items: { $ref: "#/components/schemas/Deferral" }
        match_confidence:
          type: number
          nullable: true
          description: 1 - the match distance against this item's own identity (section 10.2).
        indexer_id: { type: integer, format: int64 }
        indexer_name:
          type: string
          description: The indexer's name; empty when it has since been removed.
        blocklisted:
          type: boolean
          description: The release is blocklisted and will not be offered again.
        no_client:
          type: boolean
          description: >-
            No enabled download client takes this release's protocol (a torrent with no torrent
            client), so it cannot be sent; such releases are listed after every sendable one.
        guid: { type: string }
        title: { type: string, description: The release's own raw title, unparsed. }
        size_bytes: { type: integer, format: int64, nullable: true }
        seeders: { type: integer, format: int64, nullable: true }
        leechers: { type: integer, format: int64, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        protocol: { type: string, enum: [usenet, torrent, ddl, feed] }
        source: { type: string, enum: [rss, search] }
        decided_at: { type: string, format: date-time }

    IndexerSearchError:
      type: object
      required: [indexer_id, indexer_name, error, too_slow]
      properties:
        indexer_id: { type: integer, format: int64 }
        indexer_name: { type: string }
        error: { type: string }
        too_slow:
          type: boolean
          description: The indexer had not answered when the search's 20-second deadline passed (ADR-37).

    Acquisition:
      type: object
      description: >-
        One dispatch to a download client (ADR-57, section 12) -- denormalised
        from the candidate it came from, since a candidate can expire while
        this row must outlive it.
      required:
        [
          id, downloader_id, download_client_ref, protocol, state, created_at,
          updated_at,
        ]
      properties:
        id: { type: integer, format: int64 }
        downloader_id: { type: integer, format: int64 }
        download_client_ref:
          type: string
          description: The client's own reference for this job (nzo_id for SABnzbd).
        client_category: { type: string }
        protocol: { type: string, enum: [usenet, torrent, ddl, feed] }
        state:
          type: string
          description: >-
            Section 10.3's own state machine (DISCOVERED, QUEUED,
            DOWNLOADING, ...). QUEUED right after dispatch -- acquire.send
            only confirms the client accepted the job, not that it has
            started (client polling, section 10.9, not built yet).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SearchItemResult:
      type: object
      description: One work's own search run (POST /works/{id}/search).
      required: [tier_used, decisions, indexer_errors]
      properties:
        tier_used:
          type: integer
          nullable: true
          description: >-
            Which tier (0 exact, 1 +year, 2 +alias) produced an acceptable
            match. null means no tier found anything worth persisting --
            not a failure, just nothing found yet.
        decisions:
          type: array
          items: { $ref: "#/components/schemas/CandidateDecision" }
        indexer_errors:
          type: array
          items: { $ref: "#/components/schemas/IndexerSearchError" }

    IncompleteDiscography:
      type: object
      required: [person_id, name, held, total, monitored]
      properties:
        person_id: { type: integer, format: int64 }
        name: { type: string }
        held: { type: integer, format: int64, description: Albums of the discography the library holds. }
        total: { type: integer, format: int64, description: Albums in the discography under the default filters. }
        monitored: { type: boolean, description: Whether the artist is already followed. }

    DuplicateReport:
      type: object
      required: [groups, reclaimable_bytes, limited]
      properties:
        limited: { type: boolean, description: "True when the library holds more groups than one report shows; the ones with the most to free come first." }
        reclaimable_bytes: { type: integer, format: int64, description: What dropping every copy but the recommended one would free. }
        groups:
          type: array
          items:
            type: object
            required: [artist, title, keep_reason, reclaimable_bytes, copies]
            properties:
              artist: { type: string }
              title: { type: string }
              keep_reason: { type: string, description: Why the recommended copy is the one to keep. }
              reclaimable_bytes: { type: integer, format: int64 }
              copies:
                type: array
                items:
                  type: object
                  required: [media_object_id, work_id, album, size_bytes, duration_ms, bitrate_kbps, audio_codec, lossless, keep, paths]
                  properties:
                    media_object_id: { type: integer, format: int64 }
                    work_id: { type: integer, format: int64 }
                    album: { type: string }
                    size_bytes: { type: integer, format: int64 }
                    duration_ms: { type: integer, format: int64 }
                    bitrate_kbps: { type: integer, format: int64 }
                    audio_codec: { type: string }
                    lossless: { type: boolean }
                    keep: { type: boolean, description: The copy to keep. }
                    paths: { type: array, items: { type: string } }

    LinkPreview:
      type: object
      required: [links, total, reclaimable_bytes, skipped]
      properties:
        total: { type: integer, description: How many paths would become links; links lists the first of them. }
        reclaimable_bytes: { type: integer, format: int64, description: What sharing the bytes would free. }
        links:
          type: array
          items:
            type: object
            required: [media_object_id, size_bytes, keep, replace, method]
            properties:
              media_object_id: { type: integer, format: int64 }
              size_bytes: { type: integer, format: int64 }
              keep: { type: string, description: The path whose file stays. }
              replace: { type: string, description: The path that becomes a link to it. }
              method: { type: string, enum: [reflink, hardlink] }
        skipped:
          type: array
          description: Paths left alone, counted by reason.
          items:
            type: object
            required: [reason, count]
            properties:
              reason: { type: string, enum: [missing, size-changed, other-filesystem, no-method] }
              count: { type: integer }

    CategoryStatistics:
      type: object
      required: [files_by_codec, albums_by_state, downloads_by_state, growth_by_month, decisions_by_outcome, window_days]
      properties:
        computed_at: { type: string, format: date-time, description: When the rollup last ran; absent before the first run. }
        window_days: { type: integer, description: How many days back the download figures reach. }
        files_by_codec:
          type: array
          items: { $ref: "#/components/schemas/StatisticsFiles" }
        files_by_video_codec:
          type: array
          description: Video libraries only; the measured video codec of each file.
          items: { $ref: "#/components/schemas/StatisticsFiles" }
        files_by_resolution:
          type: array
          items: { $ref: "#/components/schemas/StatisticsFiles" }
        files_by_hdr:
          type: array
          description: HDR format, or sdr.
          items: { $ref: "#/components/schemas/StatisticsFiles" }
        files_by_audio:
          type: array
          description: Audio codec and channel layout, e.g. "eac3 5.1".
          items: { $ref: "#/components/schemas/StatisticsFiles" }
        series_by_size:
          type: array
          description: Video libraries only; the 20 series taking most space.
          items: { $ref: "#/components/schemas/StatisticsSeries" }
        series_gaps:
          type: array
          description: Video libraries only; the 20 series with most aired episodes missing, with how many are still to air.
          items: { $ref: "#/components/schemas/StatisticsSeries" }
        size_per_hour:
          type: array
          description: Video libraries only; bytes per hour of picture and average video bitrate by resolution and codec.
          items: { $ref: "#/components/schemas/StatisticsPicture" }
        albums_by_state:
          type: array
          items: { $ref: "#/components/schemas/StatisticsCount" }
        downloads_by_state:
          type: array
          items: { $ref: "#/components/schemas/StatisticsCount" }
        growth_by_month:
          type: array
          description: Files and bytes first seen per month, oldest first; the first scan lands in one month.
          items: { $ref: "#/components/schemas/StatisticsFiles" }
        decisions_by_outcome:
          type: array
          description: Release decisions of the last window_days, by ACCEPT, REJECT or DEFER.
          items: { $ref: "#/components/schemas/StatisticsCount" }

    StatisticsFiles:
      type: object
      required: [key, files, bytes]
      properties:
        key: { type: string, description: The audio codec, or unknown until the probe has measured the file. }
        files: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }

    StatisticsSeries:
      type: object
      required: [series_id, title]
      properties:
        series_id: { type: integer, format: int64 }
        title: { type: string }
        files: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }
        missing: { type: integer, format: int64 }
        unaired: { type: integer, format: int64 }

    StatisticsPicture:
      type: object
      required: [key, files, bytes_per_hour, video_kbps]
      properties:
        key: { type: string, description: 'Resolution and codec, e.g. "1080p h265".' }
        files: { type: integer, format: int64 }
        bytes_per_hour: { type: integer, format: int64 }
        video_kbps: { type: integer, format: int64 }

    StatisticsCount:
      type: object
      required: [key, count]
      properties:
        key: { type: string }
        count: { type: integer, format: int64 }

    ImageOptions:
      type: object
      required: [options]
      properties:
        options:
          type: array
          items: { $ref: "#/components/schemas/ImageOption" }

    ImageOption:
      type: object
      required: [url, thumb_url, source, label]
      properties:
        url: { type: string, description: The picture to download and keep. }
        thumb_url: { type: string, description: A small rendition to browse by. }
        source: { type: string, description: The provider, such as Cover Art Archive. }
        label: { type: string, description: What it shows, such as Front or Fanart 2. }

    ImagePick:
      type: object
      required: [url]
      properties:
        url: { type: string, description: One of the offered urls, exactly. }

    CategorySearchEnqueued:
      type: object
      required: [duplicate]
      properties:
        duplicate:
          type: boolean
          description: True when a search for this category was already running.

    ParsedTitle:
      type: object
      description: internal/identify/parse's own reading of the pasted title, shown so a simulation is not a black box.
      required: [confidence]
      properties:
        artist: { type: string }
        album: { type: string }
        year: { type: integer }
        format: { type: string, example: "flac" }
        bitrate_kbps: { type: integer }
        source: { type: string }
        edition: { type: string }
        release_group: { type: string }
        confidence:
          type: number
          description: Never 1.0 -- a tag says what a tagger believed, a parse says what a name implies.
        unparsed:
          type: array
          items: { type: string }
          description: Trailing tokens nothing claimed (ADR-18's corpus-growth signal).

    ScoreSimulation:
      type: object
      required: [parsed, decision]
      properties:
        parsed: { $ref: "#/components/schemas/ParsedTitle" }
        decision: { $ref: "#/components/schemas/Decision" }

# Authenticated by default.
security:
  - session: []
  - apiKey: []
