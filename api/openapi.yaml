        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: attachRootFolderToCategory
      tags: [settings]
      summary: Put a root folder into a category. Administrator only.
      description: >-
        A category spans many roots (section 11.7); this is the many-to-many
