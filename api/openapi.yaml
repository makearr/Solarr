openapi: 3.0.3

# This document describes the API that EXISTS, not the one planned (section 13.2).
info:
  title: MediaNexus
  description: Media management, discovery and acquisition.
  version: 0.0.1
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: /api/v1

tags:
  - name: system
    description: Liveness, readiness and build identity. Unauthenticated.
  - name: auth
    description: Sessions.
  - name: setup
    description: First-run wizard. Skippable and resumable; a convenience, not a gate.
  - name: settings
    description: Configuration, exportable and importable as YAML (F9).
  - name: jobs
    description: The job queue.
  - name: events
    description: The server-sent event stream.

paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness.
      description: >-
        Reports that the process is working. It must not depend on plugins or
        external services: a dead indexer answering here would restart the
        container.
      security: []
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "503": { $ref: "#/components/responses/Problem" }

  /ready:
    get:
      operationId: getReady
      tags: [system]
      summary: Readiness.
      description: >-
        False during startup and shutdown, so an orchestrator stops sending work
        before the process stops accepting it.
      security: []
      responses:
        "200":
          description: Ready to serve.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyStatus" }
        "503": { $ref: "#/components/responses/Problem" }

  /about:
    get:
      operationId: getAbout
      tags: [system]
      summary: Build identity and the source offer.
      description: >-
        Unauthenticated by obligation, not by convenience. AGPL section 13
        requires the running program to offer its Corresponding Source to all
        users interacting with it remotely, which is not limited to those who
        can log in.
      security: []
      responses:
        "200":
          description: Build information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildInfo" }

  /dashboard:
    get:
      operationId: getDashboard
      tags: [system]
      summary: Configured libraries and current state, for the landing page.
      description: >-
        One call, because this is the first screen and three round trips to
        render it is three chances to look slow. Library counts are read from
        the `counter` table rather than aggregated live (section 21.12).
      responses:
        "200":
          description: A summary of configured storage, work in flight and library size.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
        "401": { $ref: "#/components/responses/Problem" }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange a username and password for a session cookie.
      description: >-
        Every failure returns the same 401. Distinguishing an unknown user from
        a wrong password turns the login form into an account enumerator.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Signed in. The session cookie is set on this response.
          headers:
            Set-Cookie:
              description: The `medianexus_session` cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
          description: This instance is configured for API keys only.

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Clear the session cookie.
      security: []
      responses:
        "200":
          description: Signed out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogoutStatus" }

  /setup:
    get:
      operationId: getSetupStatus
      tags: [setup]
      summary: What the first-run wizard still has to do.
      description: >-
        Unauthenticated, because before the first account exists there is nobody
        to authenticate as. It reports only what is outstanding, never anything
        about the install, so it is safe to answer to anyone.
      security: []
      responses:
        "200":
          description: Outstanding setup steps.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }

  /setup/admin:
    post:
      operationId: createFirstAdministrator
      tags: [setup]
      summary: Create the administrator account, once.
      description: >-
        Accepted only while no account exists; afterwards it is a conflict, for
        good. This is the standard first-run claim, and it does mean whoever
        reaches the port first owns the install -- which is why it closes
        permanently rather than whenever the wizard is finished.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 1 }
                password: { type: string, format: password, minLength: 12 }
      responses:
        "201":
          description: Created, and signed in. The session cookie is set here.
          headers:
            Set-Cookie:
              description: The `medianexus_session` cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "400": { $ref: "#/components/responses/Problem" }
        "409":
          $ref: "#/components/responses/Problem"
          description: An account already exists; setup is closed.

  /rootfolders:
    get:
      operationId: listRootFolders
      tags: [setup]
      summary: The configured library roots.
      responses:
        "200":
          description: Every root folder.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RootFolder" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: addRootFolder
      tags: [setup]
      summary: Add a library root.
      description: >-
        The path is probed for existence and writability before it is accepted,
        so a typo or a volume the container cannot write surfaces here rather
        than at the first import.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, minLength: 1 }
                label: { type: string }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RootFolder" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /settings/export:
    get:
      operationId: exportSettings
      tags: [settings]
      summary: Configuration as round-tripping YAML (F9).
      description: >-
        Policy only. Accounts, password hashes and API keys are deliberately
        absent: an export is attached to bug reports and committed to
        repositories, so anything in it ends up somewhere public. Identifiers
        are absent too, so a document from one install applies to another.
      responses:
        "200":
          description: The document.
          content:
            application/yaml:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /settings/import:
    post:
      operationId: importSettings
      tags: [settings]
      summary: Apply a configuration document, entirely or not at all.
      description: >-
        The document is validated whole and every problem is reported at once,
        because an import is arbitrary input and reporting one error per attempt
        turns a five-mistake file into five round trips. Nothing is written
        unless all of it is valid -- a partial import leaves settings in a state
        the user never chose. Merges on natural keys, so applying the same
        document twice changes nothing the second time.
      requestBody:
        required: true
        content:
          application/yaml:
            schema: { type: string }
      responses:
        "204":
          description: Applied.
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Who the caller is and what they may see.
      description: >-
        The endpoint a client uses to discover its own permissions, rather than
        inferring them from requests that fail.
      responses:
        "200":
          description: The caller's identity and visible categories.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: A page of jobs the caller may see.
      parameters:
        - name: cursor
          in: query
          description: >-
            From `next_cursor` of the previous page. Absent on the first page.
            There is no offset parameter and there will not be one.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: state
          in: query
          description: An unrecognised state is rejected rather than returning nothing.
          schema: { $ref: "#/components/schemas/JobState" }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503":
          $ref: "#/components/responses/Problem"
          description: The job queue is not running.

  /events:
    get:
      operationId: streamEvents
      tags: [events]
      summary: Server-sent events, filtered by category access.
      description: >-
        Events are lossy and for notification only; anything that must happen is
        a job. Progress is coalesced on a 250ms tick. Resume with `Last-Event-ID`;
        replay is best-effort over a bounded ring, and a client too far behind
        receives a `resync` event rather than a silently partial history.
      parameters:
        - name: topics
          in: query
          description: >-
            Comma-separated subset of topics. Absent means every topic the caller
            may see. An unrecognised name is rejected rather than ignored, so a
            typo is not a silently empty stream.
          required: false
          schema:
            type: array
            items: { $ref: "#/components/schemas/EventTopic" }
          style: form
          explode: false
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The stream. It does not end until the client disconnects.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: medianexus_session
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key

  responses:
    Problem:
      description: An RFC 7807 problem.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }

    ReadyStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ready] }

    LogoutStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [signed-out] }

    Problem:
      type: object
      description: RFC 7807. Every error uses this, including 404 and 405.
      required: [type, title, status]
      properties:
        type:
          description: >-
            A stable slug, not a resolvable URL, so a client can branch on it
            without following a link. Renaming one is a breaking change.
          $ref: "#/components/schemas/ProblemType"
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    ProblemType:
      type: string
      enum:
        - not-found
        - forbidden
        - conflict
        - bad-request
        - method-not-allowed
        - unavailable
        - internal
        - unauthorized

    BuildInfo:
      type: object
      required: [version, commit, build_date, source_url, license]
      properties:
        version: { type: string, example: "0.2.17" }
        commit:
          type: string
          description: >-
            Reported as `unknown` rather than a plausible-looking wrong value
            when it could not be determined; the source link depends on it.
        build_date: { type: string, format: date-time }
        source_url:
          type: string
          format: uri
          description: >-
            The Corresponding Source for *this* build. A modified build must not
            point at upstream.
        license: { type: string, example: "AGPL-3.0-or-later" }
        server_time:
          type: string
          format: date-time
          description: >-
            The server's wall clock at the moment of the response. Schedules,
            air dates and retention run on this clock, not the viewer's, and
            on a remote host the two routinely differ.
        timezone:
          type: string
          example: "Europe/Fefobo"
          description: The server's configured zone, from TZ. `UTC` when unset.

    SetupStatus:
      type: object
      required: [needs_administrator, has_root_folder]
      properties:
        needs_administrator:
          type: boolean
          description: True while no account exists, which is the only time setup can be claimed.
        has_root_folder: { type: boolean }

    RootFolder:
      type: object
      required: [id, path, online]
      properties:
        id: { type: integer, format: int64 }
        path: { type: string }
        label: { type: string }
        online:
          type: boolean
          description: >-
            An unmounted root counts as unavailable, never as free space
            (Invariant 20a).
        writable:
          type: boolean
          description: >-
            Whether this process can write here. False is reported, never
            enforced: ownership on the host is the operator's to decide, and
            MediaNexus does not chown a library it did not create. Absent when
            it has not been probed.

    Identity:
      type: object
      required: [user_id, username, role]
      properties:
        user_id: { type: integer, format: int64 }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    Role:
      type: string
      enum: [admin, operator, readonly]

    Permission:
      type: string
      description: >-
        `none` is never returned: a category a caller cannot read is absent
        entirely, and reaching it directly is a 404 rather than a 403.
      enum: [none, read, request, manage]

    Me:
      type: object
      required: [user_id, role, categories]
      properties:
        user_id: { type: integer, format: int64 }
        role: { $ref: "#/components/schemas/Role" }
        categories:
          type: array
          items: { $ref: "#/components/schemas/Category" }

    Category:
      type: object
      required: [id, media_type, name, permission]
      properties:
        id: { type: integer, format: int64 }
        media_type: { $ref: "#/components/schemas/MediaType" }
        name: { type: string, example: "anime" }
        permission: { $ref: "#/components/schemas/Permission" }

    MediaType:
      type: string
      description: >-
        Manga, magazines, music videos and adult galleries are categories of
        these rather than types of their own.
      enum:
        - music
        - tv
        - movie
        - audiobook
        - book
        - adult
        - comic
        - rom
        - podcast
        - news
        - youtube

    EventTopic:
      type: string
      enum: [job, acquisition, library, notification, pressure]

    DashboardSummary:
      type: object
      required: [root_folders, jobs, library]
      properties:
        root_folders:
          type: array
          items: { $ref: "#/components/schemas/RootFolder" }
        jobs: { $ref: "#/components/schemas/JobCounts" }
        library: { $ref: "#/components/schemas/LibraryCounts" }

    JobCounts:
      type: object
      description: Live counts over jobs.db, which retention keeps bounded.
      required: [total, pending, running, failed, succeeded, cancelled]
      properties:
        total: { type: integer }
        pending:
          type: integer
          description: PENDING and PENDING_RETRY together; both are waiting.
        running:
          type: integer
          description: RUNNING and LEASED together; both are claimed by a worker.
        failed: { type: integer }
        succeeded: { type: integer }
        cancelled: { type: integer }

    LibraryCounts:
      type: object
      description: >-
        Read from the `counter` table, never aggregated live (section 21.12,
        ADR-28). Absent counters report zero, so an empty library and an
        uncounted one look the same until the reconciliation job has run.
      required: [works, files, monitored, missing]
      properties:
        works: { type: integer }
        files: { type: integer }
        monitored: { type: integer }
        missing: { type: integer }

    JobState:
      type: string
      enum: [PENDING, PENDING_RETRY, LEASED, RUNNING, SUCCEEDED, FAILED, CANCELLED]

    JobPool:
      type: string
      enum: [search, acquire, import, metadata, maintenance]

    Job:
      type: object
      description: >-
        The job's payload is deliberately absent. It can carry paths and provider
        identifiers, and a listing is not the place to hand that out.
      required: [id, type, pool, state, priority, attempts, max_attempts, run_after, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, example: "library.scan" }
        pool: { $ref: "#/components/schemas/JobPool" }
        state: { $ref: "#/components/schemas/JobState" }
        priority: { type: integer }
        attempts: { type: integer }
        max_attempts: { type: integer }
        category_id: { type: integer, format: int64 }
        correlation_id: { type: string }
        last_error: { type: string }
        run_after: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    JobPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Job" }
        next_cursor:
          type: string
          description: >-
            Empty on the last page, which is how a client knows to stop without
            one more request that returns nothing.

# Authenticated by default.
security:
  - session: []
  - apiKey: []
