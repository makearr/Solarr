openapi: 3.0.3

# This document describes the API that EXISTS, not the one planned (section 13.2).
info:
  title: Solarr
  description: Media management, discovery and acquisition.
  version: 0.0.1
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: /api/v1

tags:
  - name: system
    description: Liveness, readiness and build identity. Unauthenticated.
  - name: auth
    description: Sessions.
  - name: setup
    description: First-run wizard. Skippable and resumable; a convenience, not a gate.
  - name: settings
    description: Configuration, exportable and importable as YAML (F9).
  - name: jobs
    description: The job queue.
  - name: events
    description: The server-sent event stream.
  - name: scoring
    description: ADR-40's quality/language interpreter.

paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness.
      description: >-
        Reports that the process is working. It must not depend on plugins or
        external services: a dead indexer answering here would restart the
        container.
      security: []
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "503": { $ref: "#/components/responses/Problem" }

  /ready:
    get:
      operationId: getReady
      tags: [system]
      summary: Readiness.
      description: >-
        False during startup and shutdown, so an orchestrator stops sending work
        before the process stops accepting it.
      security: []
      responses:
        "200":
          description: Ready to serve.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyStatus" }
        "503": { $ref: "#/components/responses/Problem" }

  /about:
    get:
      operationId: getAbout
      tags: [system]
      summary: Build identity and the source offer.
      description: >-
        Unauthenticated by obligation, not by convenience. AGPL section 13
        requires the running program to offer its Corresponding Source to all
        users interacting with it remotely, which is not limited to those who
        can log in.
      security: []
      responses:
        "200":
          description: Build information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildInfo" }

  /about/license:
    get:
      operationId: getAboutLicense
      tags: [system]
      summary: The full AGPL-3.0-or-later text (section 13).
      description: >-
        Served from the binary's own embedded copy rather than a link, so the
        licence is readable even by a caller that cannot reach GitHub.
      security: []
      responses:
        "200":
          description: Licence text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalText" }

  /about/attribution:
    get:
      operationId: getAboutAttribution
      tags: [system]
      summary: Third-party attributions (ADR-18, section 13).
      security: []
      responses:
        "200":
          description: Attribution text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalText" }

  /system/egress:
    get:
      operationId: getEgress
      tags: [system]
      summary: The address this host appears to come from.
      description: >-
        What the outside world sees when Solarr connects out, which is the
        number that matters for whether traffic is leaving past a VPN. Resolved
        by asking a configurable echo service through httpx, cached, and absent
        rather than guessed when the check is disabled or has not succeeded.
        Per-indexer proxies (ADR-47) can egress differently; this is the app's
        own path out.
      responses:
        "200":
          description: The last successful result, or an empty body when there is none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Egress" }
        "401": { $ref: "#/components/responses/Problem" }

  /system/activity:
    get:
      operationId: getActivity
      tags: [system]
      summary: The jobs running now, with progress and an estimate of the time left.
      description: >-
        For the status bar (2026-09-29). The rate is measured over the last one to five
        minutes; a job that does not know how much there is has no total and no estimate.
        Jobs of a library the caller cannot see are left out.
      responses:
        "200":
          description: Running jobs, longest running first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
        "401": { $ref: "#/components/responses/Problem" }

  /dashboard:
    get:
      operationId: getDashboard
      tags: [system]
      summary: Configured libraries and current state, for the landing page.
      description: >-
        One call, because this is the first screen and three round trips to
        render it is three chances to look slow. Library counts are read from
        the `counter` table rather than aggregated live (section 21.12).
      responses:
        "200":
          description: A summary of configured storage, work in flight and library size.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
        "401": { $ref: "#/components/responses/Problem" }

  /library/health:
    get:
      operationId: getLibraryHealth
      tags: [system]
      summary: Probe coverage, unmatched files, incomplete works, roots near reserve and blocked hashes still in the library (todo 4.8).
      description: >-
        Every list here is a compact sample (the first 20), not a second
        paginated browser -- "every figure a link" (todo 4.8) means the count
        is the headline and the sample names concrete instances, not that
        this endpoint replaces the identification queue or the blocklist
        screens. Blocked hashes found in the library are Invariant 83's own
        "reported, never touched": nothing here removes anything.
      responses:
        "200":
          description: The current report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryHealth" }
        "401": { $ref: "#/components/responses/Problem" }

  /calendar:
    get:
      operationId: listCalendar
      tags: [library]
      summary: Releases in a date window, earliest first.
      description: >-
        Only works this library has a reason to care about: something wants the
        work, or an artist credited on it is monitored. Dates come from the
        provider and may be partial ("2024", "2024-03"), which is shown as
        given rather than guessed into a day.
      parameters:
        - name: from
          in: query
          required: true
          description: ISO date, inclusive.
          schema: { type: string }
        - name: to
          in: query
          required: true
          description: ISO date, inclusive.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: Matching releases.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CalendarEntry" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /calendar/dates:
    get:
      operationId: listCalendarDates
      tags: [library]
      summary: How many releases fall on each date of a window, for the year view.
      description: >-
        The same releases listCalendar answers, counted per date so a busy
        year is never cut off by a page size. A date is as precise as the
        provider gave it: "2024", "2024-03" or "2024-03-01".
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: One row per date that has a release.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CalendarDate" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /me/calendar-feed:
    get:
      operationId: getMyCalendarFeed
      tags: [auth]
      summary: The caller's calendar feed token, if one exists.
      responses:
        "200":
          description: The token, or none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarFeed" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createMyCalendarFeed
      tags: [auth]
      summary: Give the caller a new calendar feed token, revoking the previous one.
      responses:
        "200":
          description: The new token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarFeed" }
        "401": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteMyCalendarFeed
      tags: [auth]
      summary: Revoke the caller's calendar feed; the link stops working at once.
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Problem" }

  /calendar/feed.ics:
    get:
      operationId: getCalendarFeedICS
      tags: [library]
      summary: The calendar as iCalendar, for a calendar client. Authenticated by the token alone.
      description: >-
        Calendar clients cannot log in, so the per-user token in the URL is
        the credential (2026-09-19). It shows only the libraries its user
        can see, and only releases with a full date.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: past_days
          in: query
          schema: { type: integer, minimum: 0, maximum: 3650, default: 30 }
        - name: future_days
          in: query
          schema: { type: integer, minimum: 0, maximum: 3650, default: 365 }
      responses:
        "200":
          description: An iCalendar document.
          content:
            text/calendar:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Problem" }

  /system/logs:
    get:
      operationId: listLogs
      tags: [system]
      summary: The most recent log records, newest first.
      description: >-
        A bounded in-memory buffer of what this process logged since it
        started, not a log file: there is no history across restarts, and
        raising the configured log level quiets this too. Advanced tier.
      parameters:
        - name: level
          in: query
          description: Drop anything below this level. Defaults to everything captured.
          schema: { type: string, enum: [debug, info, warn, error] }
        - name: q
          in: query
          description: Match the message or any attribute, case-insensitively.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 2000, default: 200 }
      responses:
        "200":
          description: Matching records, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LogRecord" }
        "401": { $ref: "#/components/responses/Problem" }

  /system/backups:
    get:
      operationId: listBackups
      tags: [system]
      summary: The backup files on disk, newest first.
      description: >-
        Reads the backup directory itself rather than a record of what was
        taken: a backup that is not on disk is not a backup. Restoring stays
        the documented offline procedure (ADR-15) -- nothing here restores.
      responses:
        "200":
          description: Every backup file currently present.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BackupFile" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: runBackupNow
      tags: [system]
      summary: Back up every database now. Administrator only.
      description: >-
        A routine backup, which the Clean old backups task later prunes like
        the scheduled ones.
        Runs synchronously: a backup that has not finished is not one a user
        should be told about.
      responses:
        "200":
          description: The backups that were written.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BackupFile" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }

  /system/health:
    get:
      operationId: getSystemHealth
      tags: [system]
      summary: Configuration and operational problems with this instance (Lidarr's System health).
      description: >-
        Distinct from /library/health, which reports on the library's own
        data. This reports on the instance: things the operator has not
        configured yet, a root folder that is offline or unwritable, and
        backups that have stopped running. Each check names itself so the
        interface can link somewhere useful, and an empty list means
        everything checked is fine.
      responses:
        "200":
          description: Every check that currently has something to say, worst first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HealthCheck" }
        "401": { $ref: "#/components/responses/Problem" }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange a username and password for a session cookie.
      description: >-
        Every failure returns the same 401. Distinguishing an unknown user from
        a wrong password turns the login form into an account enumerator.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                remember:
                  type: boolean
                  default: false
                  description: >-
                    Keep the session across browser restarts. Unset issues a
                    session cookie that dies when the browser closes; the
                    server-side lifetime is the same either way.
      responses:
        "200":
          description: Signed in. The session cookie is set on this response.
          headers:
            Set-Cookie:
              description: The `solarr_session` cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
          description: This instance is configured for API keys only.
        "429":
          $ref: "#/components/responses/Problem"
          description: >-
            Five sign-ins from this address failed within a minute; Retry-After says how many seconds to wait.

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Clear the session cookie.
      security: []
      responses:
        "200":
          description: Signed out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogoutStatus" }

  /setup:
    get:
      operationId: getSetupStatus
      tags: [setup]
      summary: What the first-run wizard still has to do.
      description: >-
        Unauthenticated, because before the first account exists there is nobody
        to authenticate as. It reports only what is outstanding, never anything
        about the install, so it is safe to answer to anyone.
      security: []
      responses:
        "200":
          description: Outstanding setup steps.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }

  /setup/admin:
    post:
      operationId: createFirstAdministrator
      tags: [setup]
      summary: Create the administrator account, once.
      description: >-
        Accepted only while no account exists; afterwards it is a conflict, for
        good. This is the standard first-run claim, and it does mean whoever
        reaches the port first owns the install -- which is why it closes
        permanently rather than whenever the wizard is finished.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 1 }
                password: { type: string, format: password, minLength: 12 }
      responses:
        "201":
          description: Created, and signed in. The session cookie is set here.
          headers:
            Set-Cookie:
              description: The `solarr_session` cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "400": { $ref: "#/components/responses/Problem" }
        "409":
          $ref: "#/components/responses/Problem"
          description: An account already exists; setup is closed.

  /users:
    get:
      operationId: listUsers
      tags: [settings]
      summary: Every account, with its role and category grants.
      responses:
        "200":
          description: The accounts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserAccount" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createUser
      tags: [settings]
      summary: Add an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                role: { $ref: "#/components/schemas/Role" }
                access:
                  type: array
                  description: The libraries the account may use. An administrator manages every one regardless.
                  items: { $ref: "#/components/schemas/CategoryGrant" }
                limits: { $ref: "#/components/schemas/UserLimits" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAccount" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateUser
      tags: [settings]
      summary: Change a role, set a password, or change the account's limits.
      description: >-
        Demoting or deleting the only administrator is refused: nothing else can
        restore the role, so the interface would be locked out of its own
        settings (ADR-44).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: "#/components/schemas/Role" }
                password: { type: string, format: password }
                limits: { $ref: "#/components/schemas/UserLimits" }
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAccount" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteUser
      tags: [settings]
      summary: Remove an account.
      responses:
        "204": { description: Removed. }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /users/{id}/access:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: setUserAccess
      tags: [settings]
      summary: Grant or change access to one category.
      description: >-
        An absent grant denies, so a new category is private until shared.
        Sending "none" revokes rather than storing a denial.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id, permission]
              properties:
                category_id: { type: integer, format: int64 }
                permission: { $ref: "#/components/schemas/Permission" }
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAccount" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /settings/users:
    get:
      operationId: getUserDefaults
      tags: [settings]
      summary: What a new account starts with. Administrator only.
      responses:
        "200":
          description: The defaults.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDefaults" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: setUserDefaults
      tags: [settings]
      summary: Change what a new account starts with. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserDefaults" }
      responses:
        "200":
          description: The defaults now in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDefaults" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /settings/backups:
    get:
      operationId: getBackupRetention
      tags: [settings]
      summary: How the Clean old backups task decides what to remove. Administrator only.
      responses:
        "200":
          description: The rule in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRetention" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: setBackupRetention
      tags: [settings]
      summary: Change the backup retention rule. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupRetention" }
      responses:
        "200":
          description: The rule now in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRetention" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /settings/auth:
    get:
      operationId: getAuthPolicy
      tags: [settings]
      summary: Whether a login is required.
      security: []
      description: >-
        Unauthenticated, because an instance that requires no login has nobody
        to authenticate and the interface still has to discover that.
      responses:
        "200":
          description: The policy in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthPolicy" }
    put:
      operationId: setAuthPolicy
      tags: [settings]
      summary: Require a login, or stop requiring one.
      description: >-
        Administrators only, except during first-run setup when there is no
        account yet and therefore nobody to be one. Turning authentication off
        serves every subsequent request as the administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_required]
              properties:
                auth_required: { type: boolean }
                username:
                  type: string
                  description: >-
                    Required when turning a login back on and no account has a
                    password yet, which is the state an open-access install is
                    left in. Names the account the credential is set on.
                password: { type: string, format: password }
      responses:
        "200":
          description: The policy now in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthPolicy" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /rootfolders:
    get:
      operationId: listRootFolders
      tags: [setup]
      summary: The configured library roots.
      responses:
        "200":
          description: Every root folder.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RootFolder" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: addRootFolder
      tags: [setup]
      summary: Add a library root.
      description: >-
        The path is probed for existence and writability before it is accepted,
        so a typo or a volume the container cannot write surfaces here rather
        than at the first import.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, minLength: 1 }
                label: { type: string }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RootFolder" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /rootfolders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateRootFolderPolicy
      tags: [setup]
      summary: Change a root's own placement policy (Invariant 69). Administrator only.
      description: >-
        read_only blocks new placement, upgrade-in-place and tag
        write-back, and blocks renaming unless allow_rename is also set.
        min_free_bytes is the reserve placement refuses to dip below. All
        three are replaced wholesale, matching every other policy-write
        endpoint's own shape -- there is no partial update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [read_only, allow_rename, min_free_bytes]
              properties:
                read_only: { type: boolean }
                allow_rename: { type: boolean }
                min_free_bytes: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RootFolder" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteRootFolder
      tags: [setup]
      summary: >-
        Remove a root folder. Administrator only. Refused, with the
        categories that still attach it, while any category does
        (settings.ErrInUse) -- detach it from every category first.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /rootfolders/{id}/online:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: setRootFolderOnline
      tags: [setup]
      summary: Declare a root online or offline (section 10.4). Administrator only.
      description: >-
        A declared-offline root stays that way indefinitely: nothing on it
        is missing, counted as missing, or re-acquired (Invariant 87), and
        it is excluded from placement, capacity totals and free-space
        gates. A probe finding the disk back never clears this by itself --
        declaring it online again is the only thing that does, so a
        flapping mount cannot toggle the state under the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [online]
              properties:
                online: { type: boolean }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RootFolder" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /rootfolders/{id}/vanished/accept:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: acceptVanishedFiles
      tags: [setup]
      summary: Accept the files a full scan found gone as deleted (section 10.4). Administrator only.
      description: >-
        A full scan that finds a mass of a root's files gone marks none of them missing until this is called, so a
        failed mount never makes a library missing. Accepting marks every path not seen since that scan started:
        a file that came back meanwhile stays.
      responses:
        "200":
          description: Marked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RootFolder" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /downloadfolders:
    get:
      operationId: listDownloadFolders
      tags: [setup]
      summary: The configured download folders (todo 4.18, section 5.1).
      responses:
        "200":
          description: Every download folder.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DownloadFolder" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: addDownloadFolder
      tags: [setup]
      summary: Watch a folder upstream download clients write to. Administrator only.
      description: >-
        The path is probed for existence and readability before it is
        accepted, the same as a root folder's own write probe -- a typo or
        an unmounted volume surfaces here rather than silently sitting
        unreadable. Never written to by Solarr (section 5.1):
        readability is checked, not writability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, minLength: 1 }
                label: { type: string }
                category_id:
                  type: integer
                  format: int64
                  description: The library what lands in the folder is imported into; a watched folder must name one.
                watch:
                  type: boolean
                  description: Absent means watched when a library is named, and not watched otherwise.
                transfer_ladder:
                  type: array
                  description: This folder's own transfer order; absent means the Import screen's.
                  items: { type: string }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadFolder" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
          description: The given category_id does not exist.

  /downloadfolders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateDownloadFolder
      tags: [setup]
      summary: Change a download folder's label, library hint, watching and transfer order. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [watch]
              properties:
                label: { type: string }
                category_id:
                  type: integer
                  format: int64
                  description: The library hint; absent means any library.
                watch: { type: boolean }
                transfer_ladder:
                  type: array
                  description: Absent means the Import screen's order.
                  items: { type: string }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadFolder" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteDownloadFolder
      tags: [setup]
      summary: Stop watching a download folder. Administrator only.
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /downloadfolders/{id}/contents:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listDownloadFolderContents
      tags: [setup]
      summary: What is sitting in a download folder right now.
      description: >-
        A live, non-recursive top-level listing, read fresh on every call --
        not cached, and not matched against import state (that comparison
        is stage 5's own job, not built yet).
      responses:
        "200":
          description: The folder's own top-level entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DownloadFolderEntry" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /storage/browse:
    get:
      operationId: browsePath
      tags: [setup]
      summary: List a directory, for picking a path by hand. Administrator only.
      description: >-
        Reads one directory live, non-recursively, so a path can be browsed
        rather than typed from memory (2026-09-19 review). A path that is
        not itself a directory lists the nearest real directory above it and
        keeps only the entries whose names start with what was typed, which
        is what makes this serve as typeahead as well as a browser. An
        absent or empty path lists the filesystem root. Administrator only:
        it reports what exists on the host, the same trust boundary adding a
        root folder already carries.
      parameters:
        - name: path
          in: query
          schema: { type: string }
        - name: dirs_only
          in: query
          description: Leave out plain files. Default false.
          schema: { type: boolean }
      responses:
        "200":
          description: The directory's own entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PathListing" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /schedules:
    get:
      operationId: listSchedules
      tags: [settings]
      summary: Every registered periodic task (ADR-59).
      responses:
        "200":
          description: Every task, its effective cadence and its own run-state.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Schedule" }
        "401": { $ref: "#/components/responses/Problem" }

  /schedules/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateSchedule
      tags: [settings]
      summary: Override a task's schedules, enabled flag or startup run. Administrator only.
      description: >-
        Each field is independent -- omitting one leaves it unchanged. cadences
        are validated on write (ADR-44): 1-12 distinct five-field cron
        expressions that can each actually fire; the task runs at the earliest.
        run_at_startup is refused for a task that does not offer it.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cadences:
                  type: array
                  items: { type: string }
                enabled: { type: boolean }
                run_at_startup: { type: boolean }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /schedules/{key}/run:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: runSchedule
      tags: [settings]
      summary: Fire a task immediately. Administrator only.
      description: >-
        This is 4.8's "trigger a scan, a probe sweep or a metadata refresh
        from the interface" -- refused with 409 rather than double-queued
        when a fire, scheduled or manual, is already in flight for this task
        (ADR-59). Enqueuing is asynchronous: 202 means the trigger was
        accepted, not that the underlying job has finished.
      parameters:
        - name: full
          in: query
          schema: { type: boolean }
          description: >-
            Requests the task's own full-run mode instead of its ordinary
            one, when it has one (Schedule.supports_full) -- library scan's
            full rescan is the only one today (private/questions.md), which
            rereads every directory regardless of mtime rather than the
            incremental sweep the schedule otherwise always runs. 400 for a
            task with no full-run mode.
      responses:
        "202": { description: Triggered. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          $ref: "#/components/responses/Problem"
          description: A fire is already in flight for this task.

  /settings/registry:
    get:
      operationId: listSettingDefinitions
      tags: [settings]
      summary: Every registered scalar setting (ADR-26) -- its tier, kind, default and help text.
      description: >-
        todo 4.14's first slice: the registry mechanism and the scalar
        settings that already exist (auth, import commit line, network,
        cache budget). Read-side only for now -- the per-user tier switch,
        cross-tier search and full YAML export integration are a fast
        follow. A registered task's own tier (ADR-59) is not repeated here;
        see GET /schedules.
      responses:
        "200":
          description: Every registered setting, sorted by key.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SettingDefinition" }
        "401": { $ref: "#/components/responses/Problem" }

  /network:
    get:
      operationId: getNetworkSettings
      tags: [settings]
      summary: Port resolution, egress proxy and IP allowlist (ADR-58).
      responses:
        "200":
          description: The current policy, plus the port actually in effect.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkSettings" }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateNetworkSettings
      tags: [settings]
      summary: Change the port, proxy or IP whitelist. Administrator only.
      description: >-
        Written wholesale, like the cache budget. A port change needs a
        restart before it takes effect. An enabled allow_cidrs list that
        would exclude the address making this very change is refused outright
        (ADR-44, Invariant 89) -- this is the one setting where a mistake
        costs a container shell to undo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetworkSettingsUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkSettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /cache:
    get:
      operationId: getCache
      tags: [settings]
      summary: The cache's own budgets and last-measured size per namespace (ADR-60).
      responses:
        "200":
          description: Budgets and the last measurement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheReport" }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateCacheBudget
      tags: [settings]
      summary: Change the cache's budgets. Administrator only.
      description: >-
        The two namespace shares must sum to 100 (ADR-44, validated on
        write). Takes effect on the cache maintenance task's own next tick,
        not immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [max_bytes, max_age_days, images_share_percent, metadata_share_percent]
              properties:
                max_bytes: { type: integer, format: int64 }
                max_age_days: { type: integer, format: int64 }
                images_share_percent: { type: integer, format: int64 }
                metadata_share_percent: { type: integer, format: int64 }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheReport" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /recyclebin:
    get:
      operationId: getRecycleBinLimits
      tags: [settings]
      summary: The recycle bin's space bound (section 10.8); each library keeps its own retention days.
      responses:
        "200":
          description: The limits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecycleBinLimits" }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateRecycleBinLimits
      tags: [settings]
      summary: Change the recycle bin's space bound. Administrator only.
      description: Takes effect at the next recycle bin cleanup.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecycleBinLimits" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecycleBinLimits" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /recyclebin/entries:
    get:
      operationId: listRecycleBinEntries
      tags: [settings]
      summary: What the recycle bins hold now, newest first.
      responses:
        "200":
          description: The entries (at most 500) and the totals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecycleBinContents" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /recyclebin/empty:
    post:
      operationId: emptyRecycleBin
      tags: [settings]
      summary: Remove everything in the recycle bins for good. Administrator only.
      responses:
        "200":
          description: What was removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecycleBinEmptied" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /cache/clear:
    post:
      operationId: clearCache
      tags: [settings]
      summary: Remove everything in both namespaces immediately. Administrator only.
      description: >-
        Always safe (Invariant 5) -- nothing in the cache is the only copy
        of anything, so a miss after this just costs a re-fetch.
      responses:
        "200":
          description: Cleared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheReport" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /priority:
    get:
      operationId: getPrioritySettings
      tags: [settings]
      summary: ADR-36's trigger weights and ADR-55's freshness window.
      description: >-
        Settings only -- internal/identify/priority.Compute has no caller
        until stage 5/6's planner exists, so this cannot yet show a waiting
        item's own priority broken into its components (todo 4.7's own
        remaining piece).
      responses:
        "200":
          description: The current policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrioritySettings" }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updatePrioritySettings
      tags: [settings]
      summary: Change the weights or the freshness window. Administrator only.
      description: >-
        Written wholesale, like the cache budget and network settings
        (ADR-44: validated on write -- every weight non-negative,
        new_release_days positive).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrioritySettings" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrioritySettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /metadata/settings:
    get:
      operationId: getMetadataSettings
      tags: [settings]
      summary: The metadata providers' own settings.
      responses:
        "200":
          description: The current policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataSettings" }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateMetadataSettings
      tags: [settings]
      summary: Change the metadata providers' settings. Administrator only.
      description: >-
        Written wholesale and validated on write (ADR-44). The BrainzMash
        User-Agent applies to the next request, with no restart.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MetadataSettings" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataSettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /metadata/acoustid/apikey:
    post:
      operationId: setAcoustIDAPIKey
      tags: [settings]
      summary: >-
        Replace or clear the AcoustID application key. Administrator only. A
        separate endpoint from PATCH /metadata/settings, the same shape an
        indexer's own key uses: resealing the credential on every unrelated
        edit would be silent, pointless churn. An empty api_key clears it,
        which disables the fingerprint rung rather than failing it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key: { type: string }
      responses:
        "204": { description: Replaced. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /metadata/theaudiodb/apikey:
    post:
      operationId: setTheAudioDBAPIKey
      tags: [settings]
      summary: Replace or clear an own TheAudioDB key; clearing it goes back to the public key. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key: { type: string }
      responses:
        "204": { description: Replaced. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /metadata/tmdb/apikey:
    post:
      operationId: setTMDBAPIKey
      tags: [settings]
      summary: Replace or clear the user's own TMDB credential, a v4 read access token or a v3 API key. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key: { type: string }
      responses:
        "204": { description: Replaced. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /metadata/tvdb/apikey:
    post:
      operationId: setTVDBAPIKey
      tags: [settings]
      summary: Replace or clear an own TheTVDB v4 project key; clearing it goes back to the built-in key. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key: { type: string }
      responses:
        "204": { description: Replaced. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /metadata/tv/providers:
    get:
      operationId: listTVProviders
      tags: [settings]
      summary: The TV metadata providers, what each adds and whether it has the key it needs. Asks nothing of the providers.
      responses:
        "200":
          description: One entry per provider, in the order they are asked.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TVProvider" }
        "401": { $ref: "#/components/responses/Problem" }

  /metadata/tv/providers/test:
    post:
      operationId: testTVProviders
      tags: [settings]
      summary: Ask each TV metadata provider one cheap question and report what came back. Administrator only.
      responses:
        "200":
          description: One result per provider.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TVProviderTest" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /import/settings:
    get:
      operationId: getImportSettings
      tags: [settings]
      summary: The commit line and the transfer ladder.
      responses:
        "200":
          description: The current threshold.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportSettings" }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateImportSettings
      tags: [settings]
      summary: Change the commit line or the transfer ladder. Administrator only.
      description: >-
        Applies to every entry point (manual import, watched folder,
        post-download import and bulk adoption alike): read once when each
        import.inspect run starts, so a session already INSPECTING keeps the
        threshold it was recorded with (ImportSession.threshold) until it
        next resumes, not retroactively (todo 4.9's own five named levels:
        0.95 "Only what was proven" down to 0.75 "Permissive", 0.90
        "Confident" the shipped default). Validated on write (ADR-44).
        A field left out is left as it is, the threshold included.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportSettings" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportSettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /rootfolders/{id}/drain:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: drainRootFolder
      tags: [library]
      summary: Evacuate a root folder (ADR-51). Administrator only.
      description: >-
        Groups every file on the root by its own top-level directory (the
        same directory every shipped naming template already nests one
        artist, show or series beneath) and places each group, largest
        first, on whichever other root sharing a category with this one has
        the most free space. `preview: true`, or a plan that refuses
        outright, persists nothing -- `accepted` is false and the response
        explains why. Otherwise the move job is created, `accepts_new = 0`
        and `drain_state = DRAINING` are forced across every category this
        root shares, and the job that actually moves the files is enqueued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preview: { type: boolean, default: false }
      responses:
        "200":
          description: >-
            The computed plan. accepted is false for a preview or a refused
            plan; true once the move job is created and enqueued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DrainPlan" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          $ref: "#/components/responses/Problem"
          description: The root folder has no files to drain.
    delete:
      operationId: stopDrainingRootFolder
      tags: [library]
      summary: Stop draining a root; restores accepts_new. Administrator only.
      description: >-
        Clears drain_state back to NONE and restores accepts_new across
        every category the root shares. Files already moved stay where they
        landed; a move job already running is not itself cancelled (see
        `DELETE /moves/{id}` for that, once it exists).
      responses:
        "204": { description: Stopped. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /rootfolders/{id}/rename:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: renameRootFolder
      tags: [library]
      summary: >-
        Preview or apply the shipped naming template to a root's own
        already-identified files (section 11.8). Administrator only.
      description: >-
        For every file with a resolved work_part identity, computes its
        proposed path under the shipped default template and compares it
        to its current one -- files with no identity, or whose identity
        names no real part, are silently skipped, not fatal to the whole
        preview. `preview: true`, or a plan that changes nothing, persists
        nothing -- `accepted` is false and the response explains why.
        There is only the one shipped template today; a naming_profile
        system letting a category choose between several is its own,
        later follow-up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preview: { type: boolean, default: false }
      responses:
        "200":
          description: >-
            The computed plan, in the same shape a drain plan uses --
            `accepted` is false for a preview or a refused plan; true once
            the move job is created and enqueued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DrainPlan" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /moves:
    get:
      operationId: listMoveJobs
      tags: [library]
      summary: Every move job (ADR-51), newest first.
      description: >-
        Unpaginated -- move job counts never approach library scale, the
        same reasoning `/import/sessions` already gives.
      parameters:
        - name: reason
          in: query
          schema: { type: string, enum: [RENAME, CATEGORY, REBALANCE, DRAIN] }
        - name: state
          in: query
          schema: { type: string, enum: [PLANNED, RUNNING, PAUSED, DONE, FAILED] }
      responses:
        "200":
          description: The move jobs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MoveJob" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /settings/export:
    get:
      operationId: exportSettings
      tags: [settings]
      summary: Configuration as round-tripping YAML (F9).
      description: >-
        Policy only. Accounts, password hashes and API keys are deliberately
        absent: an export is attached to bug reports and committed to
        repositories, so anything in it ends up somewhere public. Identifiers
        are absent too, so a document from one install applies to another.
      responses:
        "200":
          description: The document.
          content:
            application/yaml:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /settings/import:
    post:
      operationId: importSettings
      tags: [settings]
      summary: Apply a configuration document, entirely or not at all.
      description: >-
        The document is validated whole and every problem is reported at once,
        because an import is arbitrary input and reporting one error per attempt
        turns a five-mistake file into five round trips. Nothing is written
        unless all of it is valid -- a partial import leaves settings in a state
        the user never chose. Merges on natural keys, so applying the same
        document twice changes nothing the second time. A key the document
        format does not have is not an error: what is known is applied, and
        every unknown key comes back as a warning with the nearest valid one.
      requestBody:
        required: true
        content:
          application/yaml:
            schema: { type: string }
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsImportResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Who the caller is and what they may see.
      description: >-
        The endpoint a client uses to discover its own permissions, rather than
        inferring them from requests that fail.
      responses:
        "200":
          description: The caller's identity and visible categories.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }

  /me/tier:
    patch:
      operationId: setMyTier
      tags: [auth]
      summary: >-
        Change how much of the settings surface the caller is shown
        (ADR-26). Self-service: any authenticated user may set their own
        tier, not just an administrator -- raising or lowering it never
        changes behaviour, only what is displayed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier]
              properties:
                tier: { type: string, enum: [normal, advanced, expert] }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /me/preferences:
    get:
      operationId: getMyPreferences
      tags: [auth]
      summary: >-
        The caller's own interface state -- sort order, chosen columns and the
        like. Self-service and per user: none of it changes behaviour, only
        what this one person sees.
      responses:
        "200":
          description: Every preference this caller has stored, as raw JSON values.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: string }
        "401": { $ref: "#/components/responses/Problem" }

  /me/preferences/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: setMyPreference
      tags: [auth]
      summary: Store one of the caller's own interface preferences.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
                  description: The preference's value, itself encoded as JSON.
      responses:
        "204": { description: Stored. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /me/apikeys:
    get:
      operationId: listMyAPIKeys
      tags: [auth]
      summary: >-
        The caller's own non-interactive credentials for programmatic access
        (X-Api-Key or Bearer), for an upstream app that is not a person
        signing in. Never the key itself, or its hash -- ADR-14: a secret is
        shown once, at creation, and never again.
      responses:
        "200":
          description: The caller's own keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/APIKey" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createMyAPIKey
      tags: [auth]
      summary: Mint a new key for the caller, self-service.
      description: >-
        The response's own `key` field is the only time the plaintext is
        ever returned -- store it now. Every other read of this key (this
        list included) only ever shows its name and timestamps.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: "Prowlarr" }
      responses:
        "201":
          description: Created. Store the key now; it is never shown again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedAPIKey" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /me/apikeys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: deleteMyAPIKey
      tags: [auth]
      summary: >-
        Revoke one of the caller's own keys. Refused (404, indistinguishable
        from missing, Invariant 37) for a key belonging to someone else --
        never even reveals that a different user's key by that id exists.
      responses:
        "204": { description: Revoked. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: A page of jobs the caller may see.
      parameters:
        - name: cursor
          in: query
          description: >-
            From `next_cursor` of the previous page. Absent on the first page.
            There is no offset parameter and there will not be one.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: state
          in: query
          description: An unrecognised state is rejected rather than returning nothing.
          schema: { $ref: "#/components/schemas/JobState" }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503":
          $ref: "#/components/responses/Problem"
          description: The job queue is not running.

  /works:
    get:
      operationId: listWorks
      tags: [library]
      summary: A page of the library the caller may see (ADR-27).
      description: >-
        Category-filtered: a work not under a root folder attached to a category
        the caller can read is excluded, never 403 -- it simply is not in the
        list (Invariant 37's "hidden means absent", applied to a listing rather
        than a single item).
      parameters:
        - name: cursor
          in: query
          description: >-
            From `next_cursor` of the previous page. Absent on the first page.
            There is no offset parameter and there will not be one.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: category_id
          in: query
          description: >-
            Narrows to one category. Naming a category the caller cannot read
            answers 404, matching a single-item lookup (Invariant 37) rather
            than a filter that silently returns nothing.
          schema: { type: integer, format: int64 }
        - name: sort
          in: query
          description: >-
            Which column orders the list; title is the default. artist orders by
            the primary artist's sort name, then title -- the Albums view's
            grouping -- with a work that has no artist first. imported orders by when
            the newest file arrived and lists only works with files (the dashboard's
            Recently added). facet:<key> orders by one of the library's media type's sortable facets (a series'
            network, an album's label); an unknown or unsortable one is refused.
          schema: { type: string, pattern: '^(title|year|added|artist|searched|imported|size|profile|status|genre|tag|facet:[a-z_]+)$' }
        - name: dir
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: fresh
          in: query
          description: >-
            Only works released within priority.new_release_days (ADR-55's
            release-date window; the 48h indexer/RSS window is not built --
            it needs candidate.first_seen_at, stage 5). A work with no known
            release date, or one known only to the year or month, never
            matches: day precision is required.
          schema: { type: boolean, default: false }
        - name: wanted
          in: query
          description: >-
            Only works with a monitored desired_item that is not yet
            COMPLETE (the per-library Wanted screen). Its own state, when the
            work has one, comes back as wanted_state.
          schema: { type: boolean, default: false }
        - name: cutoff_unmet
          in: query
          description: >-
            Only works whose monitored album has every track but a file below the library's cutoff
            (UPGRADABLE; Lidarr's Wanted -> Cutoff Unmet). Wanted, by contrast, is MISSING or PARTIAL.
          schema: { type: boolean, default: false }
        - name: where
          in: query
          description: >-
            A custom filter, a JSON array of conditions (field, op, value) that must all hold: title, artist, genre, tag
            (text); year, size_mb (number); monitored, on_disk, verified (bool); status.
          schema: { type: string }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
          description: category_id does not exist, or the caller cannot read it.

    post:
      operationId: addWork
      tags: [library]
      summary: >-
        Add a looked-up candidate to a library as intent, never a download (ADR-56): an album or a series becomes
        wanted with the chosen monitoring, an artist is followed. Manage on the library.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddWorkRequest" }
      responses:
        "200":
          description: What was stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AddWorkResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }

  /discover/incomplete:
    get:
      operationId: listIncompleteDiscographies
      tags: [library]
      summary: Artists in a library whose discography has albums the library does not hold.
      description: >-
        Library-derived discovery: an artist with at least one album held, compared against the albums their
        MusicBrainz discography has under the default filters (no live recordings, compilations and the like). Most
        missing first. Computed by a weekly background job, so empty until it has run.
      parameters:
        - name: category_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: The artists, most missing first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IncompleteDiscography" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /arr/instances:
    get:
      operationId: listArrInstances
      tags: [settings]
      summary: Every configured *Arr connection (todo 4.13, ADR-52).
      responses:
        "200":
          description: Every connection. api_key is always masked.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArrInstance" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: addArrInstance
      tags: [settings]
      summary: Connect a new *Arr instance. Administrator only.
      description: >-
        api_key is sealed at rest (secrets.Cipher) and never returned in
        plaintext again -- every response shows Masked instead. Only Lidarr
        has a real sync this pass; the other four apps can still be
        connected, for when their own stage ships.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddArrInstanceRequest" }
      responses:
        "201":
          description: Connected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArrInstance" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
          description: The given category_id does not exist.

  /arr/instances/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateArrInstance
      tags: [settings]
      summary: >-
        Change a connection's own facts. Administrator only. Never touches
        api_key -- see /arr/instances/{id}/apikey.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateArrInstanceRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArrInstance" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteArrInstance
      tags: [settings]
      summary: Remove a connection. Administrator only.
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /arr/instances/{id}/apikey:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: setArrInstanceKey
      tags: [settings]
      summary: >-
        Replace a connection's own API key. Administrator only. A separate
        endpoint from PATCH: resealing on every unrelated edit would be
        silent, pointless churn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: { type: string, minLength: 1 }
      responses:
        "204": { description: Replaced. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /arr/instances/{id}/sync:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: syncArrInstance
      tags: [settings]
      summary: Start one import (todo 4.13). Administrator only.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArrSyncOptions" }
      description: >-
        Starts the run and answers immediately with it in state RUNNING --
        a real library (hundreds of artists, each needing its own Albums
        call) can run for minutes, well past this process's own HTTP write
        timeout, so the caller polls GET /arr/imports/{id} for DONE/FAILED
        rather than waiting on this response. A monitored artist becomes
        person+subscription, a monitored album becomes a desired_item, each
        matched by its own MusicBrainz id -- idempotent and additive
        (Invariant 80): re-running never duplicates what a previous run
        already created, and never resurrects something unmonitored locally
        since. The run is recorded either way, so a connection failure still
        shows as its own FAILED run, not a silently missing one.
      responses:
        "200":
          description: The run, just started (state RUNNING).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArrImportRun" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          $ref: "#/components/responses/Problem"
          description: >-
            Either this app is not yet wired for a real sync
            (connect/preview/park only), or this instance already has a sync
            running.

  /arr/instances/{id}/indexers:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listArrInstanceIndexers
      tags: [settings]
      summary: >-
        A Prowlarr connection's indexers, each reachable through Prowlarr, marked when already
        used here. Administrator only.
      responses:
        "200":
          description: Prowlarr's indexers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProwlarrIndexer" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
    post:
      operationId: useArrInstanceIndexers
      tags: [settings]
      summary: >-
        Use the named Prowlarr indexers here, through Prowlarr and with the connection's own key,
        which never leaves the server. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prowlarr_ids]
              properties:
                prowlarr_ids:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        "200":
          description: How many were added; one already used is skipped.
          content:
            application/json:
              schema:
                type: object
                required: [added]
                properties:
                  added: { type: integer, format: int64 }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }

  /arr/instances/{id}/downloadclients:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listArrInstanceDownloadClients
      tags: [settings]
      summary: >-
        The connection's own download clients, address and category, to add here. Their API keys
        and passwords come back masked from the *Arr, so adding one asks for them once.
        Administrator only.
      responses:
        "200":
          description: The download clients.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArrDownloadClient" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }

  /arr/instances/{id}/rootfolders:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listArrInstanceRootFolders
      tags: [settings]
      summary: >-
        The instance's own configured root folders, read live. Administrator
        only.
      description: >-
        For the setup wizard's own "import the root folder(s)" step: the
        paths as *this* instance's own container sees them, not translated
        against Solarr's own mounts -- creating a Solarr root folder
        at one of them only succeeds when the two containers share the same
        mount layout, the common case for sibling containers in one compose
        file. A path that does not exist here is refused the same way any
        other POST /rootfolders is, not silently accepted.
      responses:
        "200":
          description: Every root folder the instance itself reports.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArrRootFolder" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          $ref: "#/components/responses/Problem"
          description: This app is not yet wired for a real connection (connect/preview/park only).

  /indexers:
    get:
      operationId: listIndexers
      tags: [settings]
      summary: Every configured indexer connection (stage 5, ADR-37/43/47).
      responses:
        "200":
          description: Every connection. api_key is always masked.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Indexer" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: addIndexer
      tags: [settings]
      summary: Connect a new indexer. Administrator only.
      description: >-
        api_key is sealed at rest (secrets.Cipher) and never returned in
        plaintext again -- every response shows Masked instead. A public
        Torznab endpoint may need no key at all (ADR-47).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddIndexerRequest" }
      responses:
        "201":
          description: Connected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Indexer" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /indexers/prowlarr:
    post:
      operationId: listProwlarrIndexers
      tags: [settings]
      summary: >-
        Every indexer a Prowlarr serves, each reachable through Prowlarr as Lidarr's Prowlarr sync
        reaches it. Nothing is saved; adding one is POST /indexers with its base_url and the same
        API key. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_url, api_key]
              properties:
                base_url: { type: string, minLength: 1 }
                api_key: { type: string, minLength: 1 }
      responses:
        "200":
          description: Prowlarr's indexers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProwlarrIndexer" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }

  /indexers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateIndexer
      tags: [settings]
      summary: >-
        Change a connection's own facts. Administrator only. Never touches
        api_key -- see /indexers/{id}/apikey.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateIndexerRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Indexer" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteIndexer
      tags: [settings]
      summary: Remove a connection. Administrator only.
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /indexers/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: testIndexer
      tags: [settings]
      summary: >-
        Fetch t=caps against the real indexer (todo 5.2's own "every
        connection tested before it is accepted"). Records the response via
        the same path a periodic caps refresh would (ADR-43); never a
        t=search, so this never counts as an acquisition search.
      responses:
        "200":
          description: >-
            The connection was reachable. ok is false, with message
            explaining why, when the indexer answered but not usefully
            (a malformed caps response, for instance) -- a connection
            problem is a 200 with ok=false, not an HTTP error, the same
            "the call succeeded; the answer is what it is" shape as
            everything else that tests an external system.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionTestResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /indexers/{id}/apikey:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: setIndexerAPIKey
      tags: [settings]
      summary: >-
        Replace or clear a connection's own API key. Administrator only. A
        separate endpoint from PATCH: resealing on every unrelated edit
        would be silent, pointless churn. An empty api_key clears it, for a
        public endpoint that no longer needs one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key: { type: string }
      responses:
        "204": { description: Replaced. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /downloaders:
    get:
      operationId: listDownloaders
      tags: [settings]
      summary: Every configured download client connection (stage 5, ADR-46/57).
      responses:
        "200":
          description: Every connection. credentials is always masked.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Downloader" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: addDownloader
      tags: [settings]
      summary: Connect a new download client. Administrator only.
      description: >-
        credentials is sealed at rest (secrets.Cipher) and never returned in
        plaintext again -- every response shows Masked instead.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddDownloaderRequest" }
      responses:
        "201":
          description: Connected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Downloader" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /downloaders/test:
    post:
      operationId: testDownloaderConfig
      tags: [settings]
      summary: Test a download client before it is added, and read its download folder. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestDownloaderRequest" }
      responses:
        "200":
          description: What the client answered; ok false says why.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionTestResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /downloaders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateDownloader
      tags: [settings]
      summary: >-
        Change a connection's own facts. Administrator only. Never touches
        credentials -- see /downloaders/{id}/credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDownloaderRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Downloader" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteDownloader
      tags: [settings]
      summary: Remove a connection. Administrator only.
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /downloaders/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: testDownloader
      tags: [settings]
      summary: >-
        Fetch the client's own version (todo 5.2's own "every connection
        tested before it is accepted") -- the same read-only connection
        check as SABnzbd's own Version() call, never a queue or dispatch
        action.
      responses:
        "200":
          description: >-
            The connection was reachable. ok is false, with message
            explaining why, when it answered but not usefully.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionTestResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /downloaders/{id}/credentials:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: setDownloaderCredentials
      tags: [settings]
      summary: >-
        Replace or clear a connection's own credentials. Administrator only.
        A separate endpoint from PATCH, the same reasoning
        /indexers/{id}/apikey already gives.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                credentials: { type: string }
      responses:
        "204": { description: Replaced. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /arr/imports:
    get:
      operationId: listArrImports
      tags: [settings]
      summary: Every import run for one instance, newest first.
      parameters:
        - name: instance_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Every run.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArrImportRun" }
        "401": { $ref: "#/components/responses/Problem" }

  /arr/imports/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getArrImport
      tags: [settings]
      summary: One run's own detail, including every item it touched.
      responses:
        "200":
          description: The run and its items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArrImportDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /arr/imports/{id}/revert:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: revertArrImport
      tags: [settings]
      summary: Undo one run. Administrator only.
      description: >-
        Only what the run itself created (its own arr_import_item
        *_created flags), never something it only matched -- the same
        distinction library.ImportRevert already draws for a normal import.
        Best-effort per item; a person or work still referenced elsewhere is
        a real, reported failure, not a reason to abandon the rest.
      responses:
        "200":
          description: What was actually undone, and any per-item failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArrImportRevertResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          $ref: "#/components/responses/Problem"
          description: The run is not in a revertible state (still running, or already reverted).

  /wanted/parts:
    get:
      operationId: listWantedParts
      tags: [library]
      summary: >-
        Wanted at the grain of a part (Sonarr's episodes) for a library whose type declares it: missing (monitored,
        out, no file; newest first) or cutoff (held, measured, and below the library's target or cutoff).
      parameters:
        - name: category_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: view
          in: query
          schema: { type: string, enum: [missing, cutoff], default: missing }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WantedPartPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /works/lookup:
    get:
      operationId: lookupWorks
      tags: [library]
      summary: >-
        Search one library's media type's sources for something to add (ADR-56's per-library half): albums or
        artists for music, series for TV. Each result is marked when the library already holds it.
      parameters:
        - name: category_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: q
          in: query
          required: true
          description: At least 2 characters (section 21.5's floor).
          schema: { type: string }
        - name: kind
          in: query
          description: One of the type's add_kinds; the first when absent.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Candidates, best first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AddCandidate" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }

  /works/exclusions:
    get:
      operationId: listWorkExclusions
      tags: [library]
      summary: The works of one media type that were removed and must not be added again. Administrator only.
      parameters:
        - name: media_type
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: One entry per removed work.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkExclusion" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeWorkExclusion
      tags: [library]
      summary: Allow a removed work to be added again, by any of the ids it was excluded by. Administrator only.
      parameters:
        - name: media_type
          in: query
          required: true
          schema: { type: string }
        - name: provider
          in: query
          required: true
          schema: { type: string }
        - name: external_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "204": { description: Allowed again. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /works/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getWork
      tags: [library]
      summary: >-
        A work's full structural detail: its own fields, editions, parts, and
        every level's external ids.
      description: >-
        Read-only. There is no scoring, decision or candidate history here yet
        -- that renders from a persisted Decision object section 21.3
        describes, which stage 4's acquisition planner has not built. A work
        not under a root folder attached to a category the caller can read
        answers 404, indistinguishable from a work that does not exist
        (Invariant 37).
      responses:
        "200":
          description: The work's detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /works/{id}/parts:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listWorkParts
      tags: [library]
      summary: One page of a work's parts (tracks, episodes), of one group or of all, in order.
      parameters:
        - name: group
          in: query
          description: A group's ref (GET /works/{id} lists them); absent is every part.
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkPartPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /works/{id}/monitor:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: setWorkMonitored
      tags: [library]
      summary: Monitor or unmonitor a work, one of its groups, some of its parts, or apply one of its type's monitor options.
      description: >-
        Without a group, parts or option it is the whole work: every group's wanted item (a work with none
        gets one in its library, monitored or not: an explicit "not interested" is recorded too). A group
        sets its item and every part under it; parts set those parts alone; an option is one of the media
        type's monitor options (GET /mediatypes). Never deletes an item (Invariant 71).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                monitored: { type: boolean, description: Required except with an option. }
                group: { type: string, description: "A group's ref (\"s03\"); \"\" is a work's single group." }
                parts:
                  type: array
                  items: { type: integer, format: int64 }
                option: { type: string, description: One of the media type's monitor options. }
                specials: { type: boolean, description: With an option, the specials group too. }
                search:
                  type: boolean
                  default: false
                  description: >-
                    Search the work at once when it becomes monitored (D16: the person's "Start search
                    for missing albums" preference). Ignored when monitored is false.
      responses:
        "200":
          description: The work's groups after the change.
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items: { $ref: "#/components/schemas/WorkGroup" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /works/{id}/edit:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getWorkEdit
      tags: [library]
      summary: What an album's Edit dialog shows (Radarr's Edit).
      responses:
        "200":
          description: The album's own monitoring, quality profile and tags.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkEdit" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: saveWorkEdit
      tags: [library]
      summary: Save an album's Edit dialog in one call.
      description: >-
        Replaces monitored, the quality profile and the user's tags together. A null profile returns the
        album to its library's profiles; a named one replaces them for this album's search and upgrades.
        Tags the user assigned are replaced; tags a provider assigned are never touched (ADR-33).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkEdit" }
      responses:
        "200":
          description: The album as saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkEdit" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /tags:
    get:
      operationId: listTags
      tags: [library]
      summary: Every tag, by name, for the Edit dialog's tag picker.
      responses:
        "200":
          description: The tags.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "401": { $ref: "#/components/responses/Problem" }

  /tags/own:
    get:
      operationId: listOwnTags
      tags: [library]
      summary: The tags created from the Edit dialog, with how many albums carry each.
      responses:
        "200":
          description: The tags, by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, works]
                  properties:
                    id: { type: integer, format: int64 }
                    name: { type: string }
                    works: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Problem" }

  /tags/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: renameTag
      tags: [library]
      summary: Rename one of the user's own tags. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "204": { description: Renamed. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteTag
      tags: [library]
      summary: Delete one of the user's own tags and take it off every album. Administrator only.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /works/{id}/parts/{partId}/wanted:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: partId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: setTrackWanted
      tags: [library]
      summary: >-
        Want (or stop wanting) this one track on its own, independent of the
        album (section 19.6's track-level SINGLE, todo 4.4).
      description: >-
        Always ensures the track's own SINGLE desired_item exists (creating
        it on first use, wanted or not) and sets its monitored flag either
        way -- the same "record the decision either way, never delete"
        shape SetWorkMonitored already uses one level up (Invariant 71).
        Distinct from monitor: monitoring a part only changes the *album's*
        own required_count; this creates a standalone acquisition target for
        the track by itself, for someone who wants one song rather than the
        whole release.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wanted]
              properties:
                wanted: { type: boolean }
      responses:
        "200":
          description: The track's own wanted state after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wanted" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /works/bulk/monitor:
    post:
      operationId: bulkSetWorkMonitored
      tags: [library]
      summary: Monitor or unmonitor every work matching a selection (section 21.7).
      description: >-
        Selection is a query, never a list of ids fetched client-side: either
        explicit ids, or the category currently being browsed plus excluded
        ids ("select all matching" minus what the user deselected). preview:
        true only counts what would be affected, changing nothing -- the
        consequences preview section 21.7 requires before a bulk action
        commits. A work outside every root folder the caller can read is
        never matched, id or no id (ADR-27).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monitored]
              properties:
                ids:
                  type: array
                  items: { type: integer, format: int64 }
                  description: Explicit ids ("select all matching" was never used). Takes precedence over category_id/excluded_ids when non-empty.
                category_id: { type: integer, format: int64 }
                excluded_ids:
                  type: array
                  items: { type: integer, format: int64 }
                fresh: { type: boolean, default: false, description: The list's Fresh filter, when "select all matching" was made under it. }
                where: { type: string, description: The list's custom filter (the JSON the list carried), when "select all matching" was made under it. }
                wanted: { type: boolean, default: false, description: The list's Wanted filter. }
                cutoff_unmet: { type: boolean, default: false, description: The list's Cutoff Unmet filter. }
                monitored: { type: boolean }
                preview: { type: boolean, default: false }
      responses:
        "200":
          description: How many works matched (and, unless preview, were changed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /works/bulk/edit:
    post:
      operationId: bulkEditWorks
      tags: [library]
      summary: >-
        Change monitoring, a monitor option, quality profile, tags and editable fields of every work matching a
        selection (Radarr's and Sonarr's Edit selected).
      description: >-
        The selection is the one /works/bulk/monitor takes, filters included, so "select all matching" under a
        filter touches only what the list showed. Only what is present is changed: monitored, profile (an object
        whose id null returns the albums to their library's profiles), and tags to add or remove. preview counts
        and changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: integer, format: int64 }
                category_id: { type: integer, format: int64 }
                excluded_ids:
                  type: array
                  items: { type: integer, format: int64 }
                fresh: { type: boolean, default: false }
                where: { type: string }
                wanted: { type: boolean, default: false }
                cutoff_unmet: { type: boolean, default: false }
                preview: { type: boolean, default: false }
                monitored: { type: boolean }
                profile:
                  type: object
                  required: [id]
                  properties:
                    id: { type: integer, format: int64, nullable: true }
                add_tags:
                  type: array
                  items: { type: string }
                remove_tags:
                  type: array
                  items: { type: string }
                fields:
                  type: object
                  additionalProperties: { type: string }
                  description: The type's editable facets to set, by key ("" returns one to its sources).
                monitor_option:
                  type: string
                  description: One of the type's monitor options, applied after the rest.
                specials: { type: boolean, default: false, description: With monitor_option, also the specials group. }
      responses:
        "200":
          description: How many works matched (and, unless preview, were changed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /works/{id}/artwork:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getWorkArtwork
      tags: [library]
      summary: A work's cached cover art (section 21.6), if any has been fetched yet.
      description: >-
        WebP bytes straight from the on-disk cache ArtworkJob wrote -- never
        re-encoded per request. A work with no cover of its own serves its
        provider poster (fetched once into the same cache), else its lead's
        image. 404 both when the work is
        not visible to the caller (ADR-27, indistinguishable from missing) and
        when no cover has been recorded yet; a client cannot and need not tell
        the two apart.
      parameters:
        - name: size
          in: query
          schema: { type: string, enum: [thumb, small, full], default: small }
      responses:
        "200":
          description: The image.
          content:
            image/webp:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

    put:
      operationId: chooseWorkArtwork
      tags: [library]
      summary: Make one of the offered pictures this work's image; it is kept over later refreshes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImagePick" }
      responses:
        "204": { description: The image was replaced. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }

  /works/{id}/artwork/options:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getWorkArtworkOptions
      tags: [library]
      summary: The pictures providers hold for this work, to pick one from.
      description: >-
        Asked of the work's media type: music asks Cover Art Archive and TheAudioDB live, so it can be slow, and a
        provider that is down is left out as long as another answered; TV lists the posters its sources gave. 409 for
        a type that has no picture choice. Visibility as for the image itself.
      responses:
        "200":
          description: The options, possibly none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageOptions" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }

  /works/{id}/candidates:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - { $ref: "#/components/parameters/SearchGroup" }
      - { $ref: "#/components/parameters/SearchPart" }
    get:
      operationId: listWorkCandidates
      tags: [acquisition]
      summary: >-
        The latest search's decisions for what the scope names, best first (section 12's "why wasn't this
        downloaded"). Empty, never 404, for something nobody has searched yet.
      responses:
        "200":
          description: Every decision recorded, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CandidateDecision" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /works/{id}/candidates/{decisionId}/send:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: decisionId
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - { $ref: "#/components/parameters/SearchGroup" }
      - { $ref: "#/components/parameters/SearchPart" }
    post:
      operationId: sendCandidate
      tags: [acquisition]
      summary: >-
        Dispatch one ACCEPTed decision's own release to a matching
        downloader (ADR-57's acquire.send). No resource gate yet -- every
        dispatch here is a user's own explicit action (ADR-12's own "user
        request: never paused"), since nothing automatic calls this until
        stage 6's planner exists.
      responses:
        "200":
          description: The acquisition this dispatch created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Acquisition" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          description: >-
            The decision is not ACCEPT, no downloader matches its own
            protocol, or the desired item already has an acquisition in
            flight (Invariant 15).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /works/{id}/candidates/{decisionId}/blocklist:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: decisionId
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - { $ref: "#/components/parameters/SearchGroup" }
      - { $ref: "#/components/parameters/SearchPart" }
    post:
      operationId: blocklistCandidate
      tags: [acquisition]
      summary: >-
        Never offer this release again (section 10.11): blocklisted by its
        indexer and guid, permanently, as the user's own choice. Later
        searches drop it before it is decided. Administrator only.
      responses:
        "204": { description: Blocklisted. }
        "404": { $ref: "#/components/responses/Problem" }

  /works/{id}/search:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - { $ref: "#/components/parameters/SearchGroup" }
      - { $ref: "#/components/parameters/SearchPart" }
    post:
      operationId: searchWork
      tags: [acquisition]
      summary: >-
        Interactive search: ask every enabled indexer for what the scope names (the work's own item, one group,
        or one part of a group) and record a decision per release. Nothing is sent. With a body, searches those
        terms instead, keyed by the media type's search_terms; a release matching them counts as matching the work.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: string }
      responses:
        "200":
          description: What this run found, decided and persisted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchItemResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          description: >-
            Nothing wanted covers the scope, the type searches whole items only, or no indexer is enabled.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /works/{id}/grab:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - { $ref: "#/components/parameters/SearchGroup" }
      - { $ref: "#/components/parameters/SearchPart" }
    post:
      operationId: grabWork
      tags: [acquisition]
      summary: >-
        Automatic search, as in Lidarr and Sonarr: search what the scope names and send its best accepted release
        to a download client. Nothing is searched while a download for it is already on its way.
      responses:
        "200":
          description: What the search found and what, if anything, was sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrabResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          description: The work is not wanted, no indexer is enabled, or no client takes the release.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /categories/{id}/search:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: searchCategory
      tags: [acquisition]
      summary: >-
        Automatic search of every monitored, incomplete album in one library, or
        of the albums named in work_ids ("search this page"). Each album's best
        release is sent. Runs as a background job; GET /jobs shows its progress.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                work_ids:
                  type: array
                  items: { type: integer, format: int64 }
                  maxItems: 200
                cutoff_unmet:
                  type: boolean
                  description: >-
                    Search the monitored albums below the library's cutoff (Lidarr's Cutoff Unmet "Search all")
                    instead of the missing ones; each is judged strictly: only a better release is sent.
      responses:
        "202":
          description: Enqueued (or already running -- duplicate says which).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategorySearchEnqueued" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /search:
    get:
      operationId: search
      tags: [library]
      summary: Ranked cross-media title search (section 21.5), category-filtered (ADR-27).
      description: >-
        A work not under a root folder attached to a category the caller can read is
        excluded, same as `/works`. A capped, ranked array rather than a cursor-paginated
        page: re-running the same query after data changes can reorder results, so stable
        cursor pagination is not meaningful here.
      parameters:
        - name: q
          in: query
          required: true
          description: Below 2 characters answers 400 rather than searching.
          schema: { type: string }
        - name: media_type
          in: query
          schema: { type: string, example: "music" }
        - name: limit
          in: query
          description: Sized for an interactive search box, not a browsing page.
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Matches, best first. Empty when nothing matches.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SearchResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /score/simulate:
    post:
      operationId: simulateScore
      tags: [scoring]
      summary: >-
        F6: paste a release title, see how it would score against a profile --
        no candidate, no acquisition, no side effects.
      description: >-
        Parses title with the ADR-18 release-name parser and evaluates the
        result against quality_profile_id (and, if given, language_profile_id)
        through the ADR-40 interpreter. Since there is no real file to probe,
        the parser's claims stand in for measured facts -- this shows what the
        title implies, not a guarantee of what a real download would measure
        (ADR-39). preferred_release_groups substitutes a scoring rule's
        "$preferred" placeholder, the same allowlist a real evaluation would use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, quality_profile_id]
              properties:
                title: { type: string, example: "Artist - Album (2024) [FLAC]" }
                quality_profile_id: { type: integer, format: int64 }
                language_profile_id: { type: integer, format: int64 }
                preferred_release_groups:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: The parse and the resulting decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoreSimulation" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
          description: quality_profile_id or language_profile_id does not exist.

  /library/unidentified:
    get:
      operationId: listUnidentified
      tags: [library]
      summary: >-
        Files a scan recorded that the ADR-24 chain could not confidently
        resolve (F29's manual identification queue).
      description: >-
        Oldest-queued first. Category-filtered the same way `/works` and
        `/search` are -- a file under a root folder attached to a category
        the caller cannot read is excluded, never 403. A file leaves the
        queue the moment a later sweep resolves it; this is not history.
      parameters:
        - name: cursor
          in: query
          description: >-
            From `next_cursor` of the previous page. Absent on the first page.
            There is no offset parameter and there will not be one.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: category_id
          in: query
          description: >-
            Narrows to one category. Naming a category the caller cannot read
            answers 404, matching a single-item lookup (Invariant 37) rather
            than a filter that silently returns nothing.
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnidentifiedPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
          description: category_id does not exist, or the caller cannot read it.

  /library/unidentified/{mediaObjectId}/resolve:
    parameters:
      - name: mediaObjectId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: resolveUnidentified
      tags: [library]
      summary: >-
        Confirm a candidate for a queued file (section 21.3's manual-resolve
        action).
      description: >-
        Fetches the candidate's real title from the provider, resolves or
        creates the work, links the file's own root folder, and clears the
        queue entry. Confidence is 1.0 -- a human explicitly chose this. Reaches
        only as far as automatic search identification does: the work becomes
        real and browsable, but no edition or tracklist alignment is attempted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, external_id]
              properties:
                category_id:
                  type: integer
                  format: int64
                  description: >-
                    The library to place the file in, one its root folder serves; the root folder's first library
                    when left out. Its media type places the file.
                provider:
                  type: string
                  description: >-
                    A work id as the library's lookup answers it: musicbrainz:release-group for music, tvdb or tmdb
                    for a series.
                external_id: { type: string }
                group:
                  type: integer
                  description: "For a type with groups (a season): the file's group, when its name does not say."
                parts:
                  type: array
                  items: { type: integer }
                  description: "For a type with groups (episodes): the parts the file holds, when its name does not say."
                whole_folder:
                  type: boolean
                  description: >-
                    Also resolve every other queued file directly in the same
                    folder to this album or series ("identify the whole folder as"); a TV file is placed by its own name.
      responses:
        "200":
          description: Resolved.
          content:
            application/json:
              schema:
                type: object
                required: [work_id, resolved]
                properties:
                  work_id: { type: integer, format: int64 }
                  resolved:
                    type: integer
                    format: int64
                    description: How many queued files were resolved, this one included.
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
          description: No such queued file, or the caller cannot read its root folder.

  /library/unidentified/{mediaObjectId}/not-media:
    parameters:
      - name: mediaObjectId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: markUnidentifiedNotMedia
      tags: [library]
      summary: Take a queued file out of the queue for good ("not media", F29).
      description: >-
        Keyed on the file's bytes, never its name (ADR-53): a later scan finds
        it and asks nothing; changed bytes are judged afresh. Nothing is moved
        or deleted.
      responses:
        "204": { description: Marked. }
        "401": { $ref: "#/components/responses/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
          description: No such queued file, or the caller cannot read its root folder.

  /library/unidentified/{mediaObjectId}/attempts:
    parameters:
      - name: mediaObjectId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listIdentificationAttempts
      tags: [library]
      summary: How identification of a queued file went, newest run first.
      description: >-
        Every recent run past the file's embedded MBIDs: each pass, what it
        concluded, and the candidates it weighed with the evidence for each
        verdict -- what a person needs to make the decision the queue is
        asking for. The newest five runs are kept.
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentificationAttemptList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
          description: No such queued file, or the caller cannot read its root folder.

  /exclusions:
    get:
      operationId: listExclusionPatterns
      tags: [library]
      summary: Every unwanted-file pattern (ADR-53 part 1).
      description: >-
        Shipped defaults and user-added patterns together, unfiltered by
        category (an administrator sees every pattern that exists, the same
        way root folders are listed). Unpaginated -- pattern counts are
        small, dozens at most.
      responses:
        "200":
          description: The patterns.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExclusionPattern" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createExclusionPattern
      tags: [library]
      summary: Add an unwanted-file pattern. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExclusionPatternWrite" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExclusionPattern" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /exclusions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateExclusionPattern
      tags: [library]
      summary: >-
        Change a pattern's content. Administrator only. `builtin` never
        changes -- a shipped default stays a shipped default, only editable
        and removable (ADR-53's own text), never rebrandable as user-added.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExclusionPatternWrite" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExclusionPattern" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteExclusionPattern
      tags: [library]
      summary: >-
        Remove a pattern -- a shipped default exactly as freely as a
        user-added one. Administrator only.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /qualityprofiles:
    get:
      operationId: listQualityProfiles
      tags: [settings]
      summary: Every quality profile (ADR-40).
      description: >-
        Unfiltered, unpaginated -- profile counts are small, same reasoning
        as /exclusions.
      responses:
        "200":
          description: The profiles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QualityProfile" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createQualityProfile
      tags: [settings]
      summary: Add a quality profile. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QualityProfileWrite" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualityProfile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /qualityprofiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateQualityProfile
      tags: [settings]
      summary: Replace a quality profile's policy. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QualityProfileWrite" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualityProfile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteQualityProfile
      tags: [settings]
      summary: >-
        Remove a quality profile. Administrator only. Refused, with the
        categories that still default to it, while any category does
        (settings.ErrInUse).
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /qualitytargets:
    get:
      operationId: listQualityTargets
      tags: [settings]
      summary: Every named target quality a library may aim for.
      responses:
        "200":
          description: The targets, by media type then name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QualityTarget" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createQualityTarget
      tags: [settings]
      summary: Add a target quality. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QualityTarget" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualityTarget" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /qualitytargets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: updateQualityTarget
      tags: [settings]
      summary: Replace a target quality; the libraries aiming for it follow. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QualityTarget" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualityTarget" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteQualityTarget
      tags: [settings]
      summary: Remove a target quality no library aims for. Administrator only.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /languageprofiles:
    get:
      operationId: listLanguageProfiles
      tags: [settings]
      summary: Every language profile (section 19.8).
      description: >-
        Unfiltered, unpaginated -- profile counts are small, same reasoning
        as /exclusions.
      responses:
        "200":
          description: The profiles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LanguageProfile" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createLanguageProfile
      tags: [settings]
      summary: Add a language profile. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LanguageProfileWrite" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanguageProfile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /languageprofiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateLanguageProfile
      tags: [settings]
      summary: Replace a language profile's policy. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LanguageProfileWrite" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanguageProfile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteLanguageProfile
      tags: [settings]
      summary: >-
        Remove a language profile. Administrator only. Refused, with the
        categories that still default to it, while any category does
        (settings.ErrInUse).
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /blocked:
    get:
      operationId: listBlockedContent
      tags: [library]
      summary: Every blocked-by-hash entry (ADR-53 part 2).
      description: >-
        Oldest first. `after_id` pages through the list (the id of the last
        item already seen, 0 for the first page) -- a plain ascending id
        cursor, not the compound sort/id cursor `/works` and `/search` use,
        since this list has only one sort order.
      parameters:
        - name: after_id
          in: query
          schema: { type: integer, format: int64, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: A page of blocks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BlockedContentEntry" }
        "401": { $ref: "#/components/responses/Problem" }

  /blocked/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: removeBlockedContent
      tags: [library]
      summary: Reverse a block. Administrator only.
      description: >-
        Removes the block only -- it does not restore a recycled file or
        undo a blocklist entry; those are their own separate reversals
        (`POST /recycleBin/{id}/restore`, not yet built, and
        `DELETE` on the blocklist, not yet exposed either).
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /files/{mediaObjectId}/remove-block:
    parameters:
      - name: mediaObjectId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: removeAndBlockFile
      tags: [library]
      summary: >-
        "This is fake, get rid of it and make sure it never comes back"
        (architecture.md section 10.8/ADR-53 section 3). Administrator only.
      description: >-
        Four steps, each independently requestable: recycle every copy of
        the file's bytes (never a direct delete, restorable), block its
        hashes, blocklist the source release so it is not re-grabbed, and
        detach the file from every desired item it satisfied so that item
        returns to wanting the real thing. Requesting none of the four is a
        no-op, not an error.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoveAndBlockRequest" }
      responses:
        "200":
          description: What actually happened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoveAndBlockResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
          description: No such file.

  /import/inspect:
    post:
      operationId: inspectImport
      tags: [library]
      summary: >-
        Point at any path and enqueue ADR-48's own inspection pipeline.
        Administrator only.
      description: >-
        Enqueues `import.inspect` (WALK/CLASSIFY/GROUP/EVIDENCE/IDENTIFY/
        SHAPE/DECIDE) over `source_path`. A unit whose confidence clears the
        threshold is placed immediately when `category_id` is given: the file
        is placed into that category's own library (reflink/hardlink/copy,
        never the source touched) and its work/edition resolved -- `work_id`/
        `edition_id` on the unit becoming non-null is what "actually in the
        library" means, not the `COMMIT` decision alone. Omitting
        `category_id` leaves every unit decided but unplaced, since placement
        has nowhere to put anything. Poll `GET /import/sessions/{id}` for
        progress. A retry of an interrupted run resumes the same session
        rather than starting over. Session revert is not built yet.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportInspectRequest" }
      responses:
        "202":
          description: Enqueued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportInspectResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /import/sessions:
    get:
      operationId: listImportSessions
      tags: [library]
      summary: Every import session (ADR-48), newest first.
      description: >-
        Unpaginated -- session counts never approach library scale
        (Invariant 22 is about files, not import runs).
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [INSPECTING, IMPORTING, CANCELLING, DONE, FAILED, REVERTED, CANCELLED]
        - name: include_dismissed
          in: query
          description: Include sessions hidden from the screen. Default false.
          schema: { type: boolean }
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImportSession" }
        "401": { $ref: "#/components/responses/Problem" }

  /import/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getImportSession
      tags: [library]
      summary: One session's own progress and counts.
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportSession" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /import/sessions/{id}/category:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: assignImportSessionCategory
      tags: [library]
      summary: >-
        Give a session a destination category, and place everything it
        already decided COMMIT (ADR-48). Administrator only.
      description: >-
        `POST /import/inspect` may omit category_id and decide per unit later
        (questions.md) -- this is that later. Idempotent for the category
        already on the session: calling it again with the same category_id
        re-runs the placement catch-up rather than refusing, which is how a
        caller retries after a transient placement failure (a root folder's
        capacity not probed yet, say). Refused with 409 only for a genuinely
        *different* category_id than the one already set, or if the session
        was reverted (its own placements were already undone, never
        resurrected by this). Every unit this session already decided COMMIT
        but has not yet placed (work_id still null -- a session that started
        INSPECTING before it had a category never places anything as it
        walks) is placed now, best-effort: one bad unit is reported (its
        reason included -- a unit sharing its own rel_path with siblings,
        the same known gap `POST .../commit` documents, is one such case),
        not fatal to the rest. A session still INSPECTING also starts
        placing its own future clusters immediately, since the running job
        re-reads its category every cluster rather than trusting what it
        was given at
        enqueue time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id]
              properties:
                category_id: { type: integer, format: int64 }
      responses:
        "200":
          description: Assigned; every already-decided unit placed or reported.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportPlacementResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          $ref: "#/components/responses/Problem"
          description: The session already has a category, or was reverted.

  /import/sessions/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: cancelImportSession
      tags: [library]
      summary: Ask a running session to stop. Administrator only.
      description: >-
        Cooperative: the job itself checks between clusters and is what
        actually stops and records CANCELLED, so the session stays resumable
        up to whatever it had already committed (ADR-48). Refused with 409 if
        the session is not currently INSPECTING.
      responses:
        "202": { description: Cancellation requested. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          $ref: "#/components/responses/Problem"
          description: The session is not running.

  /import/sessions/{id}/dismiss:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: dismissImportSession
      tags: [library]
      summary: Hide a finished session from the Import screen. Administrator only.
      description: >-
        Hides, never deletes (2026-09-19 review): the row stays as the
        record of what the session placed, and revert still reaches it by
        id. Only a session that has stopped may be dismissed, so a run in
        progress cannot be hidden out from under itself.
      responses:
        "204": { description: Hidden. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          $ref: "#/components/responses/Problem"
          description: The session has not finished.

  /import/sessions/{id}/commit:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: commitHeldImportUnits
      tags: [library]
      summary: >-
        Commit the units this session held for review, all or a chosen
        subset. Administrator only.
      description: >-
        The bulk half of "commit what was held" (ADR-48): each unit is placed
        with the same top-ranked candidate IDENTIFY already found, exactly as
        `POST .../units/{unitId}/commit` does one at a time, never a re-run of
        IDENTIFY and never a choice among the other candidates. Pairs with a
        `preview` inspection, which holds every unit on purpose. Best-effort:
        a unit that cannot be committed is reported in `errors` and the rest
        still go. Refused with 409 if the session has no category yet (assign
        one first) or was reverted; a unit that is not QUEUE is skipped, not
        an error.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportCommitHeldRequest" }
      responses:
        "200":
          description: Committed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportCommitHeldResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          $ref: "#/components/responses/Problem"
          description: The session has no category, or was reverted.

  /import/sessions/{id}/revert:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: revertImportSession
      tags: [library]
      summary: Undo every file this session placed. Administrator only.
      description: >-
        Every placed unit's own files move back through the recycle bin (section
        10.8) and the rows this session created (never one it only matched
        against an existing work -- ADR-48) are removed: work_id/edition_id
        go back to null on the unit, and a work or edition CommitUnit itself
        created is deleted. Refused with 409 unless the session already
        finished (DONE or FAILED) -- there is nothing to undo from a session
        still running, and nothing left once it is already REVERTED.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRevertRequest" }
      responses:
        "200":
          description: Reverted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportRevertResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          $ref: "#/components/responses/Problem"
          description: The session cannot be reverted from its current state.

  /import/sessions/{id}/units:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listImportUnits
      tags: [library]
      summary: One session's own units, in the order they were committed.
      description: >-
        `after_id` pages through the list (the id of the last item already
        seen, 0 for the first page) -- the same plain ascending id cursor
        `/blocked` uses, since a session's own unit count can be large (a
        whole-library adoption run).
      parameters:
        - name: decision
          in: query
          schema:
            type: string
            enum: [COMMIT, QUEUE, SKIP, FAILED]
        - name: after_id
          in: query
          schema: { type: integer, format: int64, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: A page of units.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImportUnit" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /import/sessions/{id}/units/{unitId}/commit:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: unitId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: commitImportUnit
      tags: [library]
      summary: >-
        Commit one unit DECIDE queued below the confidence threshold, by
        hand ("commit what was held", ADR-48). Administrator only.
      description: >-
        A human override of DECIDE's own threshold, not a second
        identification: places the unit using the same top-ranked candidate
        IDENTIFY already found (GET .../units already shows it), never a
        re-run of IDENTIFY and never a choice among the other candidates.
        Refused with 409 if the unit is not currently QUEUE, if it has no
        candidate to commit (IDENTIFY found nothing at all), if the session
        has no category yet (assign one first, POST .../category), or if the
        session was reverted. Refused with 409, distinctly, if the unit's own
        files no longer match what WALK originally found (re-walked to place
        it, since import_unit keeps no member-file list of its own) -- the
        source changed since inspection. Also refused with 409 when this
        unit's own rel_path is not unique within the session: a flat
        directory GROUP split into several sibling units by track
        continuity alone re-walks back into all of them at once, with no
        reliable way to say which one this was -- a known, narrow gap
        (private/questions.md), not attempted this pass.


        With a body naming a provider and an external id ("Identify as..."),
        the unit is placed as that album instead of its top candidate, which
        is also how a unit IDENTIFY found nothing for is resolved by hand.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required: [provider, external_id]
              properties:
                provider: { type: string, example: "musicbrainz:release-group" }
                external_id: { type: string }
      responses:
        "200":
          description: Placed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportUnit" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          $ref: "#/components/responses/Problem"
          description: >-
            Not QUEUE, no candidate, no category on the session, the session
            was reverted, or the unit's own files changed since inspection.

  /packs:
    get:
      operationId: listPacks
      tags: [library]
      summary: Every detected pack (ADR-50, todo 4.11), newest first.
      description: >-
        `after_id` pages through the list (the id of the last item already
        seen, 0 for the first page) -- the same plain ascending id cursor
        `/blocked` already uses. Detected once, at the end of a non-adoption
        session's own WALK (private/questions.md has the exact rule); an
        adoption session (an existing, already-organised library) never
        produces one.
      parameters:
        - name: after_id
          in: query
          schema: { type: integer, format: int64, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: A page of packs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pack" }
        "401": { $ref: "#/components/responses/Problem" }

  /packs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getPack
      tags: [library]
      summary: One pack and its own members, in the order they were recorded.
      responses:
        "200":
          description: The pack.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /mediatypes:
    get:
      operationId: listMediaTypes
      tags: [library]
      summary: The media types this build can manage, with what each calls its entities.
      description: >-
        Only types with a module are listed, so a library can be created for
        exactly these. The words are what the interface shows for a work, a
        part and the people of a library of that type.
      responses:
        "200":
          description: The media types, in registration order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MediaTypeInfo" }
        "401": { $ref: "#/components/responses/Problem" }

  /libraries:
    get:
      operationId: listLibraries
      tags: [library]
      summary: The navigation tree -- libraries the caller may see, with their levels (ADR-54).
      description: >-
        Unpaginated, same reasoning as GET /categories: the number of
        libraries is small. Each level's count comes from the counter table
        (section 21.12), never a live COUNT.
      responses:
        "200":
          description: The libraries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Library" }
        "401": { $ref: "#/components/responses/Problem" }

  /libraries/{id}/last-level:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: setLibraryLastLevel
      tags: [library]
      summary: Remember the level last visited in this library (ADR-54).
      description: >-
        A per-user preference (user_preference), so the sidebar tree costs
        one click on return rather than three. Deliberately its own endpoint
        rather than a field on GET/PUT /me -- it changes on ordinary
        navigation, not an account edit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level: { type: string }
      responses:
        "204": { description: Stored. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
          description: The library does not exist, is not readable, or declares no such level.

  /libraries/{id}/{level}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: level
        in: path
        required: true
        description: One of the library's own declared level keys (see GET /libraries).
        schema: { type: string, example: "albums" }
    get:
      operationId: listLibraryLevel
      tags: [library]
      summary: One page of one navigation level (ADR-54).
      description: >-
        A generic row shape (LibraryLevelItem) rather than one schema per
        entity: only one media type exists today, so there is no second real
        case yet to generalize a typed-per-level response from. Click through
        to the existing typed detail endpoint (GET /works/{id}, etc.) for
        everything this row does not carry.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: sort
          in: query
          description: >-
            Which order to list in. Every level defaults to title (an
            artist's own name at the Artists level), which is what a browse
            view opens on. A level that cannot honour a key ignores it.
          schema: { type: string, enum: [title, artist, year, added] }
        - name: dir
          in: query
          schema: { type: string, enum: [asc, desc] }
        - name: monitored
          in: query
          description: At the Artists level, only monitored (true) or only unmonitored (false) artists; absent means both. Other levels ignore it.
          schema: { type: boolean }
        - name: where
          in: query
          description: >-
            A custom filter, a JSON array of conditions (field, op, value) that must all hold. Albums: title, artist,
            genre, tag (text); year, size_mb (number); monitored, on_disk, verified (bool); status. Artists: name, country
            (text); albums_wanted, albums_complete (number); monitored (bool). Tracks: title, album, artist (text); year
            (number); monitored, has_file (bool). Other levels ignore it.
          schema: { type: string }
        - name: q
          in: query
          description: Tracks only, for now -- the tracks whose title, album or artist contains it, any case.
          schema: { type: string }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryLevelPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
          description: The library does not exist, is not readable, or declares no such level.
        "503":
          $ref: "#/components/responses/Problem"
          description: This level exists but has no reader wired up yet.

