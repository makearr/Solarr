openapi: 3.0.3

# This document describes the API that EXISTS, not the one planned (section 13.2).
info:
  title: MediaNexus
  description: Media management, discovery and acquisition.
  version: 0.0.1
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: /api/v1

tags:
  - name: system
    description: Liveness, readiness and build identity. Unauthenticated.
  - name: auth
    description: Sessions.
  - name: setup
    description: First-run wizard. Skippable and resumable; a convenience, not a gate.
  - name: settings
    description: Configuration, exportable and importable as YAML (F9).
  - name: jobs
    description: The job queue.
  - name: events
    description: The server-sent event stream.
  - name: scoring
    description: ADR-40's quality/language interpreter.

paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness.
      description: >-
        Reports that the process is working. It must not depend on plugins or
        external services: a dead indexer answering here would restart the
        container.
      security: []
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "503": { $ref: "#/components/responses/Problem" }

  /ready:
    get:
      operationId: getReady
      tags: [system]
      summary: Readiness.
      description: >-
        False during startup and shutdown, so an orchestrator stops sending work
        before the process stops accepting it.
      security: []
      responses:
        "200":
          description: Ready to serve.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyStatus" }
        "503": { $ref: "#/components/responses/Problem" }

  /about:
    get:
      operationId: getAbout
      tags: [system]
      summary: Build identity and the source offer.
      description: >-
        Unauthenticated by obligation, not by convenience. AGPL section 13
        requires the running program to offer its Corresponding Source to all
        users interacting with it remotely, which is not limited to those who
        can log in.
      security: []
      responses:
        "200":
          description: Build information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildInfo" }

  /about/license:
    get:
      operationId: getAboutLicense
      tags: [system]
      summary: The full AGPL-3.0-or-later text (section 13).
      description: >-
        Served from the binary's own embedded copy rather than a link, so the
        licence is readable even by a caller that cannot reach GitHub.
      security: []
      responses:
        "200":
          description: Licence text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalText" }

  /about/attribution:
    get:
      operationId: getAboutAttribution
      tags: [system]
      summary: Third-party attributions (ADR-18, section 13).
      security: []
      responses:
        "200":
          description: Attribution text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalText" }

  /system/egress:
    get:
      operationId: getEgress
      tags: [system]
      summary: The address this host appears to come from.
      description: >-
        What the outside world sees when MediaNexus connects out, which is the
        number that matters for whether traffic is leaving past a VPN. Resolved
        by asking a configurable echo service through httpx, cached, and absent
        rather than guessed when the check is disabled or has not succeeded.
        Per-indexer proxies (ADR-47) can egress differently; this is the app's
        own path out.
      responses:
        "200":
          description: The last successful result, or an empty body when there is none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Egress" }
        "401": { $ref: "#/components/responses/Problem" }

  /dashboard:
    get:
      operationId: getDashboard
      tags: [system]
      summary: Configured libraries and current state, for the landing page.
      description: >-
        One call, because this is the first screen and three round trips to
        render it is three chances to look slow. Library counts are read from
        the `counter` table rather than aggregated live (section 21.12).
      responses:
        "200":
          description: A summary of configured storage, work in flight and library size.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
        "401": { $ref: "#/components/responses/Problem" }

  /library/health:
    get:
      operationId: getLibraryHealth
      tags: [system]
      summary: Probe coverage, unmatched files, incomplete works, roots near reserve and blocked hashes still in the library (todo 4.8).
      description: >-
        Every list here is a compact sample (the first 20), not a second
        paginated browser -- "every figure a link" (todo 4.8) means the count
        is the headline and the sample names concrete instances, not that
        this endpoint replaces the identification queue or the blocklist
        screens. Blocked hashes found in the library are Invariant 83's own
        "reported, never touched": nothing here removes anything.
      responses:
        "200":
          description: The current report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryHealth" }
        "401": { $ref: "#/components/responses/Problem" }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange a username and password for a session cookie.
      description: >-
        Every failure returns the same 401. Distinguishing an unknown user from
        a wrong password turns the login form into an account enumerator.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                remember:
                  type: boolean
                  default: false
                  description: >-
                    Keep the session across browser restarts. Unset issues a
                    session cookie that dies when the browser closes; the
                    server-side lifetime is the same either way.
      responses:
        "200":
          description: Signed in. The session cookie is set on this response.
          headers:
            Set-Cookie:
              description: The `medianexus_session` cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403":
          $ref: "#/components/responses/Problem"
          description: This instance is configured for API keys only.

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Clear the session cookie.
      security: []
      responses:
        "200":
          description: Signed out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogoutStatus" }

  /setup:
    get:
      operationId: getSetupStatus
      tags: [setup]
      summary: What the first-run wizard still has to do.
      description: >-
        Unauthenticated, because before the first account exists there is nobody
        to authenticate as. It reports only what is outstanding, never anything
        about the install, so it is safe to answer to anyone.
      security: []
      responses:
        "200":
          description: Outstanding setup steps.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }

  /setup/admin:
    post:
      operationId: createFirstAdministrator
      tags: [setup]
      summary: Create the administrator account, once.
      description: >-
        Accepted only while no account exists; afterwards it is a conflict, for
        good. This is the standard first-run claim, and it does mean whoever
        reaches the port first owns the install -- which is why it closes
        permanently rather than whenever the wizard is finished.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 1 }
                password: { type: string, format: password, minLength: 12 }
      responses:
        "201":
          description: Created, and signed in. The session cookie is set here.
          headers:
            Set-Cookie:
              description: The `medianexus_session` cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "400": { $ref: "#/components/responses/Problem" }
        "409":
          $ref: "#/components/responses/Problem"
          description: An account already exists; setup is closed.

  /users:
    get:
      operationId: listUsers
      tags: [settings]
      summary: Every account, with its role and category grants.
      responses:
        "200":
          description: The accounts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserAccount" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createUser
      tags: [settings]
      summary: Add an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAccount" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateUser
      tags: [settings]
      summary: Change a role or set a password.
      description: >-
        Demoting or deleting the only administrator is refused: nothing else can
        restore the role, so the interface would be locked out of its own
        settings (ADR-44).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: "#/components/schemas/Role" }
                password: { type: string, format: password }
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAccount" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteUser
      tags: [settings]
      summary: Remove an account.
      responses:
        "204": { description: Removed. }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /users/{id}/access:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: setUserAccess
      tags: [settings]
      summary: Grant or change access to one category.
      description: >-
        An absent grant denies, so a new category is private until shared.
        Sending "none" revokes rather than storing a denial.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id, permission]
              properties:
                category_id: { type: integer, format: int64 }
                permission: { $ref: "#/components/schemas/Permission" }
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAccount" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /settings/auth:
    get:
      operationId: getAuthPolicy
      tags: [settings]
      summary: Whether a login is required.
      security: []
      description: >-
        Unauthenticated, because an instance that requires no login has nobody
        to authenticate and the interface still has to discover that.
      responses:
        "200":
          description: The policy in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthPolicy" }
    put:
      operationId: setAuthPolicy
      tags: [settings]
      summary: Require a login, or stop requiring one.
      description: >-
        Administrators only, except during first-run setup when there is no
        account yet and therefore nobody to be one. Turning authentication off
        serves every subsequent request as the administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_required]
              properties:
                auth_required: { type: boolean }
                username:
                  type: string
                  description: >-
                    Required when turning a login back on and no account has a
                    password yet, which is the state an open-access install is
                    left in. Names the account the credential is set on.
                password: { type: string, format: password }
      responses:
        "200":
          description: The policy now in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthPolicy" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /rootfolders:
    get:
      operationId: listRootFolders
      tags: [setup]
      summary: The configured library roots.
      responses:
        "200":
          description: Every root folder.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RootFolder" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: addRootFolder
      tags: [setup]
      summary: Add a library root.
      description: >-
        The path is probed for existence and writability before it is accepted,
        so a typo or a volume the container cannot write surfaces here rather
        than at the first import.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, minLength: 1 }
                label: { type: string }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RootFolder" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /rootfolders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateRootFolderPolicy
      tags: [setup]
      summary: Change a root's own placement policy (Invariant 69). Administrator only.
      description: >-
        read_only blocks new placement, upgrade-in-place and tag
        write-back, and blocks renaming unless allow_rename is also set.
        min_free_bytes is the reserve placement refuses to dip below. All
        three are replaced wholesale, matching every other policy-write
        endpoint's own shape -- there is no partial update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [read_only, allow_rename, min_free_bytes]
              properties:
                read_only: { type: boolean }
                allow_rename: { type: boolean }
                min_free_bytes: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RootFolder" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteRootFolder
      tags: [setup]
      summary: >-
        Remove a root folder. Administrator only. Refused, with the
        categories that still attach it, while any category does
        (settings.ErrInUse) -- detach it from every category first.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /rootfolders/{id}/online:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: setRootFolderOnline
      tags: [setup]
      summary: Declare a root online or offline (section 10.4). Administrator only.
      description: >-
        A declared-offline root stays that way indefinitely: nothing on it
        is missing, counted as missing, or re-acquired (Invariant 87), and
        it is excluded from placement, capacity totals and free-space
        gates. A probe finding the disk back never clears this by itself --
        declaring it online again is the only thing that does, so a
        flapping mount cannot toggle the state under the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [online]
              properties:
                online: { type: boolean }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RootFolder" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /downloadfolders:
    get:
      operationId: listDownloadFolders
      tags: [setup]
      summary: The configured download folders (todo 4.18, section 5.1).
      responses:
        "200":
          description: Every download folder.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DownloadFolder" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: addDownloadFolder
      tags: [setup]
      summary: Watch a folder upstream download clients write to. Administrator only.
      description: >-
        The path is probed for existence and readability before it is
        accepted, the same as a root folder's own write probe -- a typo or
        an unmounted volume surfaces here rather than silently sitting
        unreadable. Never written to by MediaNexus (section 5.1):
        readability is checked, not writability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, minLength: 1 }
                label: { type: string }
                category_id: { type: integer, format: int64 }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadFolder" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
          description: The given category_id does not exist.

  /downloadfolders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: deleteDownloadFolder
      tags: [setup]
      summary: Stop watching a download folder. Administrator only.
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /downloadfolders/{id}/contents:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listDownloadFolderContents
      tags: [setup]
      summary: What is sitting in a download folder right now.
      description: >-
        A live, non-recursive top-level listing, read fresh on every call --
        not cached, and not matched against import state (that comparison
        is stage 5's own job, not built yet).
      responses:
        "200":
          description: The folder's own top-level entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DownloadFolderEntry" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /schedules:
    get:
      operationId: listSchedules
      tags: [settings]
      summary: Every registered periodic task (ADR-59).
      responses:
        "200":
          description: Every task, its effective cadence and its own run-state.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Schedule" }
        "401": { $ref: "#/components/responses/Problem" }

  /schedules/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateSchedule
      tags: [settings]
      summary: Override a task's cadence and/or enabled flag. Administrator only.
      description: >-
        cadence and enabled are independent -- omitting either leaves it
        unchanged. cadence is validated on write (ADR-44): a five-field cron
        expression that can actually fire, not merely one that parses (a
        nonexistent calendar date is rejected the same as a syntax error).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cadence: { type: string }
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /schedules/{key}/run:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: runSchedule
      tags: [settings]
      summary: Fire a task immediately. Administrator only.
      description: >-
        This is 4.8's "trigger a scan, a probe sweep or a metadata refresh
        from the interface" -- refused with 409 rather than double-queued
        when a fire, scheduled or manual, is already in flight for this task
        (ADR-59). Enqueuing is asynchronous: 202 means the trigger was
        accepted, not that the underlying job has finished.
      parameters:
        - name: full
          in: query
          schema: { type: boolean }
          description: >-
            Requests the task's own full-run mode instead of its ordinary
            one, when it has one (Schedule.supports_full) -- library scan's
            full rescan is the only one today (private/questions.md), which
            rereads every directory regardless of mtime rather than the
            incremental sweep the schedule otherwise always runs. 400 for a
            task with no full-run mode.
      responses:
        "202": { description: Triggered. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          $ref: "#/components/responses/Problem"
          description: A fire is already in flight for this task.

  /settings/registry:
    get:
      operationId: listSettingDefinitions
      tags: [settings]
      summary: Every registered scalar setting (ADR-26) -- its tier, kind, default and help text.
      description: >-
        todo 4.14's first slice: the registry mechanism and the scalar
        settings that already exist (auth, import commit line, network,
        cache budget). Read-side only for now -- the per-user tier switch,
        cross-tier search and full YAML export integration are a fast
        follow. A registered task's own tier (ADR-59) is not repeated here;
        see GET /schedules.
      responses:
        "200":
          description: Every registered setting, sorted by key.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SettingDefinition" }
        "401": { $ref: "#/components/responses/Problem" }

  /network:
    get:
      operationId: getNetworkSettings
      tags: [settings]
      summary: Port resolution, egress proxy and IP allowlist (ADR-58).
      responses:
        "200":
          description: The current policy, plus the port actually in effect.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkSettings" }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateNetworkSettings
      tags: [settings]
      summary: Change the port, egress proxy or IP allowlist. Administrator only.
      description: >-
        Written wholesale, like the cache budget. A port change needs a
        restart before it takes effect. An allow_cidrs list that would
        exclude the address making this very change is refused outright
        (ADR-44, Invariant 89) -- this is the one setting where a mistake
        costs a container shell to undo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetworkSettingsUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkSettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /cache:
    get:
      operationId: getCache
      tags: [settings]
      summary: The cache's own budgets and last-measured size per namespace (ADR-60).
      responses:
        "200":
          description: Budgets and the last measurement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheReport" }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateCacheBudget
      tags: [settings]
      summary: Change the cache's budgets. Administrator only.
      description: >-
        The two namespace shares must sum to 100 (ADR-44, validated on
        write). Takes effect on the cache maintenance task's own next tick,
        not immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [max_bytes, max_age_days, images_share_percent, metadata_share_percent]
              properties:
                max_bytes: { type: integer, format: int64 }
                max_age_days: { type: integer, format: int64 }
                images_share_percent: { type: integer, format: int64 }
                metadata_share_percent: { type: integer, format: int64 }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheReport" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /cache/clear:
    post:
      operationId: clearCache
      tags: [settings]
      summary: Remove everything in both namespaces immediately. Administrator only.
      description: >-
        Always safe (Invariant 5) -- nothing in the cache is the only copy
        of anything, so a miss after this just costs a re-fetch.
      responses:
        "200":
          description: Cleared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheReport" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /priority:
    get:
      operationId: getPrioritySettings
      tags: [settings]
      summary: ADR-36's trigger weights and ADR-55's freshness window.
      description: >-
        Settings only -- internal/identify/priority.Compute has no caller
        until stage 5/6's planner exists, so this cannot yet show a waiting
        item's own priority broken into its components (todo 4.7's own
        remaining piece).
      responses:
        "200":
          description: The current policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrioritySettings" }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updatePrioritySettings
      tags: [settings]
      summary: Change the weights or the freshness window. Administrator only.
      description: >-
        Written wholesale, like the cache budget and network settings
        (ADR-44: validated on write -- every weight non-negative,
        new_release_days positive).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrioritySettings" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrioritySettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /import/settings:
    get:
      operationId: getImportSettings
      tags: [settings]
      summary: The commit line (ADR-48's own single knob, import.auto_commit_confidence).
      responses:
        "200":
          description: The current threshold.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportSettings" }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateImportSettings
      tags: [settings]
      summary: Change the commit line. Administrator only.
      description: >-
        Applies to every entry point (manual import, watched folder,
        post-download import and bulk adoption alike): read once when each
        import.inspect run starts, so a session already INSPECTING keeps the
        threshold it was recorded with (ImportSession.threshold) until it
        next resumes, not retroactively (todo 4.9's own five named levels:
        0.95 "Only what was proven" down to 0.75 "Permissive", 0.90
        "Confident" the shipped default). Validated on write (ADR-44).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportSettings" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportSettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /rootfolders/{id}/drain:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: drainRootFolder
      tags: [library]
      summary: Evacuate a root folder (ADR-51). Administrator only.
      description: >-
        Groups every file on the root by its own top-level directory (the
        same directory every shipped naming template already nests one
        artist, show or series beneath) and places each group, largest
        first, on whichever other root sharing a category with this one has
        the most free space. `preview: true`, or a plan that refuses
        outright, persists nothing -- `accepted` is false and the response
        explains why. Otherwise the move job is created, `accepts_new = 0`
        and `drain_state = DRAINING` are forced across every category this
        root shares, and the job that actually moves the files is enqueued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preview: { type: boolean, default: false }
      responses:
        "200":
          description: >-
            The computed plan. accepted is false for a preview or a refused
            plan; true once the move job is created and enqueued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DrainPlan" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          $ref: "#/components/responses/Problem"
          description: The root folder has no files to drain.
    delete:
      operationId: stopDrainingRootFolder
      tags: [library]
      summary: Stop draining a root; restores accepts_new. Administrator only.
      description: >-
        Clears drain_state back to NONE and restores accepts_new across
        every category the root shares. Files already moved stay where they
        landed; a move job already running is not itself cancelled (see
        `DELETE /moves/{id}` for that, once it exists).
      responses:
        "204": { description: Stopped. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /rootfolders/{id}/rename:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: renameRootFolder
      tags: [library]
      summary: >-
        Preview or apply the shipped naming template to a root's own
        already-identified files (section 11.8). Administrator only.
      description: >-
        For every file with a resolved work_part identity, computes its
        proposed path under the shipped default template and compares it
        to its current one -- files with no identity, or whose identity
        names no real part, are silently skipped, not fatal to the whole
        preview. `preview: true`, or a plan that changes nothing, persists
        nothing -- `accepted` is false and the response explains why.
        There is only the one shipped template today; a naming_profile
        system letting a category choose between several is its own,
        later follow-up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preview: { type: boolean, default: false }
      responses:
        "200":
          description: >-
            The computed plan, in the same shape a drain plan uses --
            `accepted` is false for a preview or a refused plan; true once
            the move job is created and enqueued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DrainPlan" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /moves:
    get:
      operationId: listMoveJobs
      tags: [library]
      summary: Every move job (ADR-51), newest first.
      description: >-
        Unpaginated -- move job counts never approach library scale, the
        same reasoning `/import/sessions` already gives.
      parameters:
        - name: reason
          in: query
          schema: { type: string, enum: [RENAME, CATEGORY, REBALANCE, DRAIN] }
        - name: state
          in: query
          schema: { type: string, enum: [PLANNED, RUNNING, PAUSED, DONE, FAILED] }
      responses:
        "200":
          description: The move jobs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MoveJob" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /settings/export:
    get:
      operationId: exportSettings
      tags: [settings]
      summary: Configuration as round-tripping YAML (F9).
      description: >-
        Policy only. Accounts, password hashes and API keys are deliberately
        absent: an export is attached to bug reports and committed to
        repositories, so anything in it ends up somewhere public. Identifiers
        are absent too, so a document from one install applies to another.
      responses:
        "200":
          description: The document.
          content:
            application/yaml:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /settings/import:
    post:
      operationId: importSettings
      tags: [settings]
      summary: Apply a configuration document, entirely or not at all.
      description: >-
        The document is validated whole and every problem is reported at once,
        because an import is arbitrary input and reporting one error per attempt
        turns a five-mistake file into five round trips. Nothing is written
        unless all of it is valid -- a partial import leaves settings in a state
        the user never chose. Merges on natural keys, so applying the same
        document twice changes nothing the second time.
      requestBody:
        required: true
        content:
          application/yaml:
            schema: { type: string }
      responses:
        "204":
          description: Applied.
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Who the caller is and what they may see.
      description: >-
        The endpoint a client uses to discover its own permissions, rather than
        inferring them from requests that fail.
      responses:
        "200":
          description: The caller's identity and visible categories.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }

  /me/tier:
    patch:
      operationId: setMyTier
      tags: [auth]
      summary: >-
        Change how much of the settings surface the caller is shown
        (ADR-26). Self-service: any authenticated user may set their own
        tier, not just an administrator -- raising or lowering it never
        changes behaviour, only what is displayed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier]
              properties:
                tier: { type: string, enum: [normal, advanced, expert] }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /me/apikeys:
    get:
      operationId: listMyAPIKeys
      tags: [auth]
      summary: >-
        The caller's own non-interactive credentials for programmatic access
        (X-Api-Key or Bearer), for an upstream app that is not a person
        signing in. Never the key itself, or its hash -- ADR-14: a secret is
        shown once, at creation, and never again.
      responses:
        "200":
          description: The caller's own keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/APIKey" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createMyAPIKey
      tags: [auth]
      summary: Mint a new key for the caller, self-service.
      description: >-
        The response's own `key` field is the only time the plaintext is
        ever returned -- store it now. Every other read of this key (this
        list included) only ever shows its name and timestamps.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: "Prowlarr" }
      responses:
        "201":
          description: Created. Store the key now; it is never shown again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedAPIKey" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /me/apikeys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: deleteMyAPIKey
      tags: [auth]
      summary: >-
        Revoke one of the caller's own keys. Refused (404, indistinguishable
        from missing, Invariant 37) for a key belonging to someone else --
        never even reveals that a different user's key by that id exists.
      responses:
        "204": { description: Revoked. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: A page of jobs the caller may see.
      parameters:
        - name: cursor
          in: query
          description: >-
            From `next_cursor` of the previous page. Absent on the first page.
            There is no offset parameter and there will not be one.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: state
          in: query
          description: An unrecognised state is rejected rather than returning nothing.
          schema: { $ref: "#/components/schemas/JobState" }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503":
          $ref: "#/components/responses/Problem"
          description: The job queue is not running.

  /works:
    get:
      operationId: listWorks
      tags: [library]
      summary: A page of the library the caller may see (ADR-27).
      description: >-
        Category-filtered: a work not under a root folder attached to a category
        the caller can read is excluded, never 403 -- it simply is not in the
        list (Invariant 37's "hidden means absent", applied to a listing rather
        than a single item).
      parameters:
        - name: cursor
          in: query
          description: >-
            From `next_cursor` of the previous page. Absent on the first page.
            There is no offset parameter and there will not be one.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: category_id
          in: query
          description: >-
            Narrows to one category. Naming a category the caller cannot read
            answers 404, matching a single-item lookup (Invariant 37) rather
            than a filter that silently returns nothing.
          schema: { type: integer, format: int64 }
        - name: sort
          in: query
          description: >-
            Which column orders the list. artist is not a valid value here
            (Work.artist's own description explains why); title is the default.
          schema: { type: string, enum: [title, year, added] }
        - name: dir
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: fresh
          in: query
          description: >-
            Only works released within priority.new_release_days (ADR-55's
            release-date window; the 48h indexer/RSS window is not built --
            it needs candidate.first_seen_at, stage 5). A work with no known
            release date, or one known only to the year or month, never
            matches: day precision is required.
          schema: { type: boolean, default: false }
        - name: wanted
          in: query
          description: >-
            Only works with a monitored desired_item that is not yet
            COMPLETE (the per-library Wanted screen). Its own state, when the
            work has one, comes back as wanted_state.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
          description: category_id does not exist, or the caller cannot read it.

  /discover/search:
    get:
      operationId: discoverSearch
      tags: [library]
      summary: >-
        Search one category's own metadata provider for something not in the
        library yet (ADR-56's per-library half). The global, cross-media-type
        half with its destination-suggestion ladder is not built.
      parameters:
        - name: category_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: q
          in: query
          required: true
          description: At least 2 characters (section 21.5's own floor).
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Up to limit candidates, ranked by the provider.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DiscoverResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
          description: category_id does not exist, or the caller cannot read it.

  /discover/add:
    post:
      operationId: discoverAdd
      tags: [library]
      summary: >-
        Add a search result as intent: resolves or creates the work and
        ensures a monitored album-level desired_item for it -- never a
        download (ADR-56). Administrator or a manage grant on category_id.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoverAddRequest" }
      responses:
        "200":
          description: The work and desired_item, and the priority the item will get.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoverAddResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
          description: category_id does not exist, or the caller cannot read it.

  /arr/instances:
    get:
      operationId: listArrInstances
      tags: [settings]
      summary: Every configured *Arr connection (todo 4.13, ADR-52).
      responses:
        "200":
          description: Every connection. api_key is always masked.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArrInstance" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: addArrInstance
      tags: [settings]
      summary: Connect a new *Arr instance. Administrator only.
      description: >-
        api_key is sealed at rest (secrets.Cipher) and never returned in
        plaintext again -- every response shows Masked instead. Only Lidarr
        has a real sync this pass; the other four apps can still be
        connected, for when their own stage ships.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddArrInstanceRequest" }
      responses:
        "201":
          description: Connected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArrInstance" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
          description: The given category_id does not exist.

  /arr/instances/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateArrInstance
      tags: [settings]
      summary: >-
        Change a connection's own facts. Administrator only. Never touches
        api_key -- see /arr/instances/{id}/apikey.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateArrInstanceRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArrInstance" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteArrInstance
      tags: [settings]
      summary: Remove a connection. Administrator only.
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /arr/instances/{id}/apikey:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: setArrInstanceKey
      tags: [settings]
      summary: >-
        Replace a connection's own API key. Administrator only. A separate
        endpoint from PATCH: resealing on every unrelated edit would be
        silent, pointless churn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: { type: string, minLength: 1 }
      responses:
        "204": { description: Replaced. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /arr/instances/{id}/sync:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: syncArrInstance
      tags: [settings]
      summary: Start one import (todo 4.13). Administrator only.
      description: >-
        Starts the run and answers immediately with it in state RUNNING --
        a real library (hundreds of artists, each needing its own Albums
        call) can run for minutes, well past this process's own HTTP write
        timeout, so the caller polls GET /arr/imports/{id} for DONE/FAILED
        rather than waiting on this response. A monitored artist becomes
        person+subscription, a monitored album becomes a desired_item, each
        matched by its own MusicBrainz id -- idempotent and additive
        (Invariant 80): re-running never duplicates what a previous run
        already created, and never resurrects something unmonitored locally
        since. The run is recorded either way, so a connection failure still
        shows as its own FAILED run, not a silently missing one.
      responses:
        "200":
          description: The run, just started (state RUNNING).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArrImportRun" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          $ref: "#/components/responses/Problem"
          description: >-
            Either this app is not yet wired for a real sync
            (connect/preview/park only), or this instance already has a sync
            running.

  /arr/instances/{id}/rootfolders:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listArrInstanceRootFolders
      tags: [settings]
      summary: >-
        The instance's own configured root folders, read live. Administrator
        only.
      description: >-
        For the setup wizard's own "import the root folder(s)" step: the
        paths as *this* instance's own container sees them, not translated
        against MediaNexus's own mounts -- creating a MediaNexus root folder
        at one of them only succeeds when the two containers share the same
        mount layout, the common case for sibling containers in one compose
        file. A path that does not exist here is refused the same way any
        other POST /rootfolders is, not silently accepted.
      responses:
        "200":
          description: Every root folder the instance itself reports.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArrRootFolder" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          $ref: "#/components/responses/Problem"
          description: This app is not yet wired for a real connection (connect/preview/park only).

  /arr/imports:
    get:
      operationId: listArrImports
      tags: [settings]
      summary: Every import run for one instance, newest first.
      parameters:
        - name: instance_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Every run.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArrImportRun" }
        "401": { $ref: "#/components/responses/Problem" }

  /arr/imports/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getArrImport
      tags: [settings]
      summary: One run's own detail, including every item it touched.
      responses:
        "200":
          description: The run and its items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArrImportDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /arr/imports/{id}/revert:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: revertArrImport
      tags: [settings]
      summary: Undo one run. Administrator only.
      description: >-
        Only what the run itself created (its own arr_import_item
        *_created flags), never something it only matched -- the same
        distinction library.ImportRevert already draws for a normal import.
        Best-effort per item; a person or work still referenced elsewhere is
        a real, reported failure, not a reason to abandon the rest.
      responses:
        "200":
          description: What was actually undone, and any per-item failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArrImportRevertResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          $ref: "#/components/responses/Problem"
          description: The run is not in a revertible state (still running, or already reverted).

  /works/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getWork
      tags: [library]
      summary: >-
        A work's full structural detail: its own fields, editions, parts, and
        every level's external ids.
      description: >-
        Read-only. There is no scoring, decision or candidate history here yet
        -- that renders from a persisted Decision object section 21.3
        describes, which stage 4's acquisition planner has not built. A work
        not under a root folder attached to a category the caller can read
        answers 404, indistinguishable from a work that does not exist
        (Invariant 37).
      responses:
        "200":
          description: The work's detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /works/{id}/monitor:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: setWorkMonitored
      tags: [library]
      summary: Monitor or unmonitor a work at the album level (section 19.6).
      description: >-
        Always ensures the work's album-level SET desired_item exists
        (creating it on first use, monitored or not) and sets its monitored
        flag either way -- an explicit "not interested" is worth recording
        the same way a category's monitor_discovered policy would. Never
        deletes the item (Invariant 71): a later scan or subscription pass
        finds it and leaves it exactly as the user set it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monitored]
              properties:
                monitored: { type: boolean }
      responses:
        "200":
          description: The album's wanted state after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wanted" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /works/{id}/parts/{partId}/monitor:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: partId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: setPartMonitored
      tags: [library]
      summary: Monitor or unmonitor a single part (track) of a work.
      description: >-
        Toggles work_part.monitored and recomputes every album-level SET
        item over the work in the same transaction: unmonitoring a bonus
        track shrinks the album's required_count rather than holding it
        PARTIAL forever (Appendix E D3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monitored]
              properties:
                monitored: { type: boolean }
      responses:
        "204": { description: Updated. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /works/{id}/parts/{partId}/wanted:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: partId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: setTrackWanted
      tags: [library]
      summary: >-
        Want (or stop wanting) this one track on its own, independent of the
        album (section 19.6's track-level SINGLE, todo 4.4).
      description: >-
        Always ensures the track's own SINGLE desired_item exists (creating
        it on first use, wanted or not) and sets its monitored flag either
        way -- the same "record the decision either way, never delete"
        shape SetWorkMonitored already uses one level up (Invariant 71).
        Distinct from monitor: monitoring a part only changes the *album's*
        own required_count; this creates a standalone acquisition target for
        the track by itself, for someone who wants one song rather than the
        whole release.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wanted]
              properties:
                wanted: { type: boolean }
      responses:
        "200":
          description: The track's own wanted state after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wanted" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /works/bulk/monitor:
    post:
      operationId: bulkSetWorkMonitored
      tags: [library]
      summary: Monitor or unmonitor every work matching a selection (section 21.7).
      description: >-
        Selection is a query, never a list of ids fetched client-side: either
        explicit ids, or the category currently being browsed plus excluded
        ids ("select all matching" minus what the user deselected). preview:
        true only counts what would be affected, changing nothing -- the
        consequences preview section 21.7 requires before a bulk action
        commits. A work outside every root folder the caller can read is
        never matched, id or no id (ADR-27).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monitored]
              properties:
                ids:
                  type: array
                  items: { type: integer, format: int64 }
                  description: Explicit ids ("select all matching" was never used). Takes precedence over category_id/excluded_ids when non-empty.
                category_id: { type: integer, format: int64 }
                excluded_ids:
                  type: array
                  items: { type: integer, format: int64 }
                monitored: { type: boolean }
                preview: { type: boolean, default: false }
      responses:
        "200":
          description: How many works matched (and, unless preview, were changed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /works/{id}/artwork:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getWorkArtwork
      tags: [library]
      summary: A work's cached cover art (section 21.6), if any has been fetched yet.
      description: >-
        WebP bytes straight from the on-disk cache ArtworkJob wrote -- never
        fetched live, never re-encoded per request. 404 both when the work is
        not visible to the caller (ADR-27, indistinguishable from missing) and
        when no cover has been recorded yet; a client cannot and need not tell
        the two apart.
      parameters:
        - name: size
          in: query
          schema: { type: string, enum: [thumb, small, full], default: small }
      responses:
        "200":
          description: The image.
          content:
            image/webp:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /search:
    get:
      operationId: search
      tags: [library]
      summary: Ranked cross-media title search (section 21.5), category-filtered (ADR-27).
      description: >-
        A work not under a root folder attached to a category the caller can read is
        excluded, same as `/works`. A capped, ranked array rather than a cursor-paginated
        page: re-running the same query after data changes can reorder results, so stable
        cursor pagination is not meaningful here.
      parameters:
        - name: q
          in: query
          required: true
          description: Below 2 characters answers 400 rather than searching.
          schema: { type: string }
        - name: media_type
          in: query
          schema: { type: string, example: "music" }
        - name: limit
          in: query
          description: Sized for an interactive search box, not a browsing page.
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Matches, best first. Empty when nothing matches.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SearchResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /score/simulate:
    post:
      operationId: simulateScore
      tags: [scoring]
      summary: >-
        F6: paste a release title, see how it would score against a profile --
        no candidate, no acquisition, no side effects.
      description: >-
        Parses title with the ADR-18 release-name parser and evaluates the
        result against quality_profile_id (and, if given, language_profile_id)
        through the ADR-40 interpreter. Since there is no real file to probe,
        the parser's claims stand in for measured facts -- this shows what the
        title implies, not a guarantee of what a real download would measure
        (ADR-39). preferred_release_groups substitutes a scoring rule's
        "$preferred" placeholder, the same allowlist a real evaluation would use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, quality_profile_id]
              properties:
                title: { type: string, example: "Artist - Album (2024) [FLAC]" }
                quality_profile_id: { type: integer, format: int64 }
                language_profile_id: { type: integer, format: int64 }
                preferred_release_groups:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: The parse and the resulting decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoreSimulation" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
          description: quality_profile_id or language_profile_id does not exist.

  /library/unidentified:
    get:
      operationId: listUnidentified
      tags: [library]
      summary: >-
        Files a scan recorded that the ADR-24 chain could not confidently
        resolve (F29's manual identification queue).
      description: >-
        Oldest-queued first. Category-filtered the same way `/works` and
        `/search` are -- a file under a root folder attached to a category
        the caller cannot read is excluded, never 403. A file leaves the
        queue the moment a later sweep resolves it; this is not history.
      parameters:
        - name: cursor
          in: query
          description: >-
            From `next_cursor` of the previous page. Absent on the first page.
            There is no offset parameter and there will not be one.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: category_id
          in: query
          description: >-
            Narrows to one category. Naming a category the caller cannot read
            answers 404, matching a single-item lookup (Invariant 37) rather
            than a filter that silently returns nothing.
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnidentifiedPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
          description: category_id does not exist, or the caller cannot read it.

  /library/unidentified/{mediaObjectId}/resolve:
    parameters:
      - name: mediaObjectId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: resolveUnidentified
      tags: [library]
      summary: >-
        Confirm a candidate for a queued file (section 21.3's manual-resolve
        action).
      description: >-
        Fetches the candidate's real title from the provider, resolves or
        creates the work, links the file's own root folder, and clears the
        queue entry. Confidence is 1.0 -- a human explicitly chose this. Reaches
        only as far as automatic search identification does: the work becomes
        real and browsable, but no edition or tracklist alignment is attempted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, external_id]
              properties:
                provider:
                  type: string
                  description: Only musicbrainz:release-group is supported today.
                external_id: { type: string }
      responses:
        "200":
          description: Resolved.
          content:
            application/json:
              schema:
                type: object
                required: [work_id]
                properties:
                  work_id: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
          description: No such queued file, or the caller cannot read its root folder.

  /exclusions:
    get:
      operationId: listExclusionPatterns
      tags: [library]
      summary: Every unwanted-file pattern (ADR-53 part 1).
      description: >-
        Shipped defaults and user-added patterns together, unfiltered by
        category (an administrator sees every pattern that exists, the same
        way root folders are listed). Unpaginated -- pattern counts are
        small, dozens at most.
      responses:
        "200":
          description: The patterns.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExclusionPattern" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createExclusionPattern
      tags: [library]
      summary: Add an unwanted-file pattern. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExclusionPatternWrite" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExclusionPattern" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /exclusions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateExclusionPattern
      tags: [library]
      summary: >-
        Change a pattern's content. Administrator only. `builtin` never
        changes -- a shipped default stays a shipped default, only editable
        and removable (ADR-53's own text), never rebrandable as user-added.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExclusionPatternWrite" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExclusionPattern" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteExclusionPattern
      tags: [library]
      summary: >-
        Remove a pattern -- a shipped default exactly as freely as a
        user-added one. Administrator only.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /qualityprofiles:
    get:
      operationId: listQualityProfiles
      tags: [settings]
      summary: Every quality profile (ADR-40).
      description: >-
        Unfiltered, unpaginated -- profile counts are small, same reasoning
        as /exclusions.
      responses:
        "200":
          description: The profiles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QualityProfile" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createQualityProfile
      tags: [settings]
      summary: Add a quality profile. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QualityProfileWrite" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualityProfile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /qualityprofiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateQualityProfile
      tags: [settings]
      summary: Replace a quality profile's policy. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QualityProfileWrite" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualityProfile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteQualityProfile
      tags: [settings]
      summary: >-
        Remove a quality profile. Administrator only. Refused, with the
        categories that still default to it, while any category does
        (settings.ErrInUse).
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /languageprofiles:
    get:
      operationId: listLanguageProfiles
      tags: [settings]
      summary: Every language profile (section 19.8).
      description: >-
        Unfiltered, unpaginated -- profile counts are small, same reasoning
        as /exclusions.
      responses:
        "200":
          description: The profiles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LanguageProfile" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createLanguageProfile
      tags: [settings]
      summary: Add a language profile. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LanguageProfileWrite" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanguageProfile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /languageprofiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateLanguageProfile
      tags: [settings]
      summary: Replace a language profile's policy. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LanguageProfileWrite" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanguageProfile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteLanguageProfile
      tags: [settings]
      summary: >-
        Remove a language profile. Administrator only. Refused, with the
        categories that still default to it, while any category does
        (settings.ErrInUse).
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /blocked:
    get:
      operationId: listBlockedContent
      tags: [library]
      summary: Every blocked-by-hash entry (ADR-53 part 2).
      description: >-
        Oldest first. `after_id` pages through the list (the id of the last
        item already seen, 0 for the first page) -- a plain ascending id
        cursor, not the compound sort/id cursor `/works` and `/search` use,
        since this list has only one sort order.
      parameters:
        - name: after_id
          in: query
          schema: { type: integer, format: int64, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: A page of blocks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BlockedContentEntry" }
        "401": { $ref: "#/components/responses/Problem" }

  /blocked/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: removeBlockedContent
      tags: [library]
      summary: Reverse a block. Administrator only.
      description: >-
        Removes the block only -- it does not restore a quarantined file or
        undo a blocklist entry; those are their own separate reversals
        (`POST /quarantine/{id}/restore`, not yet built, and
        `DELETE` on the blocklist, not yet exposed either).
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /files/{mediaObjectId}/remove-block:
    parameters:
      - name: mediaObjectId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: removeAndBlockFile
      tags: [library]
      summary: >-
        "This is fake, get rid of it and make sure it never comes back"
        (architecture.md section 10.8/ADR-53 section 3). Administrator only.
      description: >-
        Four steps, each independently requestable: quarantine every copy of
        the file's bytes (never a direct delete, restorable), block its
        hashes, blocklist the source release so it is not re-grabbed, and
        detach the file from every desired item it satisfied so that item
        returns to wanting the real thing. Requesting none of the four is a
        no-op, not an error.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoveAndBlockRequest" }
      responses:
        "200":
          description: What actually happened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoveAndBlockResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
          description: No such file.

  /import/inspect:
    post:
      operationId: inspectImport
      tags: [library]
      summary: >-
        Point at any path and enqueue ADR-48's own inspection pipeline.
        Administrator only.
      description: >-
        Enqueues `import.inspect` (WALK/CLASSIFY/GROUP/EVIDENCE/IDENTIFY/
        SHAPE/DECIDE) over `source_path`. A unit whose confidence clears the
        threshold is placed immediately when `category_id` is given: the file
        is placed into that category's own library (reflink/hardlink/copy,
        never the source touched) and its work/edition resolved -- `work_id`/
        `edition_id` on the unit becoming non-null is what "actually in the
        library" means, not the `COMMIT` decision alone. Omitting
        `category_id` leaves every unit decided but unplaced, since placement
        has nowhere to put anything. Poll `GET /import/sessions/{id}` for
        progress. A retry of an interrupted run resumes the same session
        rather than starting over. Session revert is not built yet.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportInspectRequest" }
      responses:
        "202":
          description: Enqueued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportInspectResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /import/sessions:
    get:
      operationId: listImportSessions
      tags: [library]
      summary: Every import session (ADR-48), newest first.
      description: >-
        Unpaginated -- session counts never approach library scale
        (Invariant 22 is about files, not import runs).
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [INSPECTING, IMPORTING, CANCELLING, DONE, FAILED, REVERTED, CANCELLED]
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImportSession" }
        "401": { $ref: "#/components/responses/Problem" }

  /import/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getImportSession
      tags: [library]
      summary: One session's own progress and counts.
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportSession" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /import/sessions/{id}/category:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: assignImportSessionCategory
      tags: [library]
      summary: >-
        Give a session a destination category, and place everything it
        already decided COMMIT (ADR-48). Administrator only.
      description: >-
        `POST /import/inspect` may omit category_id and decide per unit later
        (questions.md) -- this is that later. Idempotent for the category
        already on the session: calling it again with the same category_id
        re-runs the placement catch-up rather than refusing, which is how a
        caller retries after a transient placement failure (a root folder's
        capacity not probed yet, say). Refused with 409 only for a genuinely
        *different* category_id than the one already set, or if the session
        was reverted (its own placements were already undone, never
        resurrected by this). Every unit this session already decided COMMIT
        but has not yet placed (work_id still null -- a session that started
        INSPECTING before it had a category never places anything as it
        walks) is placed now, best-effort: one bad unit is reported (its
        reason included -- a unit sharing its own rel_path with siblings,
        the same known gap `POST .../commit` documents, is one such case),
        not fatal to the rest. A session still INSPECTING also starts
        placing its own future clusters immediately, since the running job
        re-reads its category every cluster rather than trusting what it
        was given at
        enqueue time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id]
              properties:
                category_id: { type: integer, format: int64 }
      responses:
        "200":
          description: Assigned; every already-decided unit placed or reported.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportPlacementResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          $ref: "#/components/responses/Problem"
          description: The session already has a category, or was reverted.

  /import/sessions/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: cancelImportSession
      tags: [library]
      summary: Ask a running session to stop. Administrator only.
      description: >-
        Cooperative: the job itself checks between clusters and is what
        actually stops and records CANCELLED, so the session stays resumable
        up to whatever it had already committed (ADR-48). Refused with 409 if
        the session is not currently INSPECTING.
      responses:
        "202": { description: Cancellation requested. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          $ref: "#/components/responses/Problem"
          description: The session is not running.

  /import/sessions/{id}/revert:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: revertImportSession
      tags: [library]
      summary: Undo every file this session placed. Administrator only.
      description: >-
        Every placed unit's own files move back through quarantine (section
        10.8) and the rows this session created (never one it only matched
        against an existing work -- ADR-48) are removed: work_id/edition_id
        go back to null on the unit, and a work or edition CommitUnit itself
        created is deleted. Refused with 409 unless the session already
        finished (DONE or FAILED) -- there is nothing to undo from a session
        still running, and nothing left once it is already REVERTED.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRevertRequest" }
      responses:
        "200":
          description: Reverted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportRevertResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          $ref: "#/components/responses/Problem"
          description: The session cannot be reverted from its current state.

  /import/sessions/{id}/units:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listImportUnits
      tags: [library]
      summary: One session's own units, in the order they were committed.
      description: >-
        `after_id` pages through the list (the id of the last item already
        seen, 0 for the first page) -- the same plain ascending id cursor
        `/blocked` uses, since a session's own unit count can be large (a
        whole-library adoption run).
      parameters:
        - name: decision
          in: query
          schema:
            type: string
            enum: [COMMIT, QUEUE, SKIP, FAILED]
        - name: after_id
          in: query
          schema: { type: integer, format: int64, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: A page of units.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImportUnit" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /import/sessions/{id}/units/{unitId}/commit:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: unitId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: commitImportUnit
      tags: [library]
      summary: >-
        Commit one unit DECIDE queued below the confidence threshold, by
        hand ("commit what was held", ADR-48). Administrator only.
      description: >-
        A human override of DECIDE's own threshold, not a second
        identification: places the unit using the same top-ranked candidate
        IDENTIFY already found (GET .../units already shows it), never a
        re-run of IDENTIFY and never a choice among the other candidates.
        Refused with 409 if the unit is not currently QUEUE, if it has no
        candidate to commit (IDENTIFY found nothing at all), if the session
        has no category yet (assign one first, POST .../category), or if the
        session was reverted. Refused with 409, distinctly, if the unit's own
        files no longer match what WALK originally found (re-walked to place
        it, since import_unit keeps no member-file list of its own) -- the
        source changed since inspection. Also refused with 409 when this
        unit's own rel_path is not unique within the session: a flat
        directory GROUP split into several sibling units by track
        continuity alone re-walks back into all of them at once, with no
        reliable way to say which one this was -- a known, narrow gap
        (private/questions.md), not attempted this pass.
      responses:
        "200":
          description: Placed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportUnit" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          $ref: "#/components/responses/Problem"
          description: >-
            Not QUEUE, no candidate, no category on the session, the session
            was reverted, or the unit's own files changed since inspection.

  /packs:
    get:
      operationId: listPacks
      tags: [library]
      summary: Every detected pack (ADR-50, todo 4.11), newest first.
      description: >-
        `after_id` pages through the list (the id of the last item already
        seen, 0 for the first page) -- the same plain ascending id cursor
        `/blocked` already uses. Detected once, at the end of a non-adoption
        session's own WALK (private/questions.md has the exact rule); an
        adoption session (an existing, already-organised library) never
        produces one.
      parameters:
        - name: after_id
          in: query
          schema: { type: integer, format: int64, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: A page of packs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pack" }
        "401": { $ref: "#/components/responses/Problem" }

  /packs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getPack
      tags: [library]
      summary: One pack and its own members, in the order they were recorded.
      responses:
        "200":
          description: The pack.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /libraries:
    get:
      operationId: listLibraries
      tags: [library]
      summary: The navigation tree -- libraries the caller may see, with their levels (ADR-54).
      description: >-
        Unpaginated, same reasoning as GET /categories: the number of
        libraries is small. Each level's count comes from the counter table
        (section 21.12), never a live COUNT.
      responses:
        "200":
          description: The libraries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Library" }
        "401": { $ref: "#/components/responses/Problem" }

  /libraries/{id}/last-level:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: setLibraryLastLevel
      tags: [library]
      summary: Remember the level last visited in this library (ADR-54).
      description: >-
        A per-user preference (user_preference), so the sidebar tree costs
        one click on return rather than three. Deliberately its own endpoint
        rather than a field on GET/PUT /me -- it changes on ordinary
        navigation, not an account edit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level: { type: string }
      responses:
        "204": { description: Stored. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
          description: The library does not exist, is not readable, or declares no such level.

  /libraries/{id}/{level}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: level
        in: path
        required: true
        description: One of the library's own declared level keys (see GET /libraries).
        schema: { type: string, example: "albums" }
    get:
      operationId: listLibraryLevel
      tags: [library]
      summary: One page of one navigation level (ADR-54).
      description: >-
        A generic row shape (LibraryLevelItem) rather than one schema per
        entity: only one media type exists today, so there is no second real
        case yet to generalize a typed-per-level response from. Click through
        to the existing typed detail endpoint (GET /works/{id}, etc.) for
        everything this row does not carry.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryLevelPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
          description: The library does not exist, is not readable, or declares no such level.
        "503":
          $ref: "#/components/responses/Problem"
          description: This level exists but has no reader wired up yet.

  /libraries/{id}/import-lists:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listImportLists
      tags: [library]
      summary: >-
        A library's own *Arr-shaped import lists (ADR-38). Scaffolding only
        -- the sync job that admits anything from one is stage 12.
      responses:
        "200":
          description: The import lists.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImportList" }
        "401": { $ref: "#/components/responses/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
          description: The library does not exist, or the caller cannot read it.
    post:
      operationId: createImportList
      tags: [settings]
      summary: Add an import list to a library. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportListWrite" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
          description: The library does not exist.

  /import-lists/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateImportList
      tags: [settings]
      summary: Replace an import list's fields. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportListWrite" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportList" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteImportList
      tags: [settings]
      summary: Remove an import list. Administrator only.
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /categories:
    get:
      operationId: listCategories
      tags: [library]
      summary: Every category the caller may read (ADR-27).
      description: >-
        Unpaginated: category counts are small (dozens, not thousands), so a
        plain array is correct and simpler than cursor machinery. In the
        caller's snapshot order (Invariant 36).
      responses:
        "200":
          description: The categories.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LibraryCategory" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createCategory
      tags: [settings]
      summary: Add a category. Administrator only.
      description: >-
        Grants every administrator manage on the new category (ADR-27).
        priority_rank orders categories for ADR-36's composite acquisition
        priority; omitted, it places the new category after every existing
        one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_type, name]
              properties:
                media_type: { type: string }
                name: { type: string, minLength: 1 }
                priority_rank: { type: integer, format: int64 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryCategory" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getCategory
      tags: [settings]
      summary: >-
        A category's full settings-side detail. Administrator only --
        richer than LibraryCategory (`GET /categories`), which stays lean
        for the many navigation callers that never need any of this.
      responses:
        "200":
          description: The category.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategorySettings" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateCategory
      tags: [settings]
      summary: >-
        Rename a category, reprioritise it, or change its default quality/
        language profile or monitor-discovered policy. Administrator only.
        `media_type` never changes -- it is identity, not policy.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryWrite" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategorySettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteCategory
      tags: [settings]
      summary: Remove a category. Administrator only.
      description: >-
        Refused, naming what still uses it, while any root folder is
        attached, any user holds explicit access, or a discovery job
        references it (Invariant 41).
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          $ref: "#/components/responses/Problem"
          description: Still referenced; the detail names what by.

  /categories/{id}/rootfolders:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: attachRootFolderToCategory
      tags: [settings]
      summary: Put a root folder into a category. Administrator only.
      description: >-
        A category spans many roots (section 11.7); this is the many-to-many
        join. accepts_new defaults true -- draining is a separate, explicit
        action (ADR-51), never the default state of a freshly attached root.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [root_folder_id]
              properties:
                root_folder_id: { type: integer, format: int64 }
                accepts_new: { type: boolean, default: true }
      responses:
        "200":
          description: The root folder, with its updated category list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RootFolder" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
          description: The category or the root folder does not exist.

  /categories/{id}/rootfolders/{rootFolderId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: rootFolderId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: detachRootFolderFromCategory
      tags: [settings]
      summary: Take a root folder out of a category. Administrator only.
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /people:
    get:
      operationId: listPeople
      tags: [people]
      summary: A page of people (ADR-32) -- first-class monitorable entities, not just credits.
      parameters:
        - name: cursor
          in: query
          description: >-
            From `next_cursor` of the previous page. Absent on the first page.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: monitored
          in: query
          schema: { type: boolean }
        - name: q
          in: query
          description: Matches the start of the sort name.
          schema: { type: string }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /people/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getPerson
      tags: [people]
      summary: A person's full detail, including their discography.
      description: >-
        Coverage (held vs missing vs upgradable, architecture.md's own
        sketch) is not included -- it reuses Satisfaction, which needs
        desired_item populated for music, not yet true. discography lists
        every work credited to them, any role.
      responses:
        "200":
          description: The person's detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /people/{id}/artwork:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getPersonArtwork
      tags: [people]
      summary: A person's cached Wikidata image, if one was found.
      description: >-
        WebP bytes straight from the on-disk cache EnrichJob wrote from the
        artist's own Wikidata P18 claim, when they have one -- most people do
        not, so 404 is the common case, indistinguishable from "no such
        person" the same way GET /works/{id}/artwork's own 404 is. An
        album's own cover falls back to this same image when the album has
        none of its own (that fallback lives in GET /works/{id}/artwork
        itself, not here).
      parameters:
        - name: size
          in: query
          schema: { type: string, enum: [thumb, small, full], default: small }
      responses:
        "200":
          description: The image.
          content:
            image/webp:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /people/{id}/subscribe:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: subscribePerson
      tags: [people]
      summary: Subscribe to a person (ADR-32) -- media types x roles x filters.
      description: >-
        Marks the person monitored (ADR-32: "adding a performer monitors
        their scenes regardless of studio"). Back-catalogue is an explicit
        choice, never implied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_types]
              properties:
                media_types:
                  type: array
                  items: { type: string }
                  example: ["music"]
                roles:
                  type: array
                  items: { type: string }
                  description: Empty or absent means any role.
                monitor_back_catalogue: { type: boolean, default: false }
                exclude_secondary_types:
                  type: array
                  items: { type: string }
                  description: >-
                    Overrides music.DefaultExcludedSecondaryTypes (compilation,
                    live, remix, dj-mix, mixtape) when present -- an empty
                    array means "exclude nothing", a real choice, distinct
                    from absent (todo 4.4). Music-specific for now
                    (internal/media/music.SubscriptionFilters); opaque to
                    every other media type, per ADR-23.
      responses:
        "204": { description: Subscribed. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /people/{id}/subscription-preview:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: previewSubscription
      tags: [people]
      summary: >-
        Every release group in the artist's discography, unfiltered, so the
        subscribe screen can show what a filter choice would admit or
        exclude before saving (todo 4.4, ADR-38's preview-before-enable
        shape).
      description: >-
        The same MusicBrainz call SubscriptionExpandJob itself makes
        (provider.ArtistReleaseGroups, cache-first per ADR-29 -- this is not
        a second network round trip once an artist has been browsed once).
        Returns every release group unfiltered; the client applies
        SubscriptionFilters.Admits's own substring-match rule locally
        against whichever exclusions the user is currently trying, so
        toggling a checkbox costs no round trip. The real admission decision
        at expand time still runs server-side against the saved filters --
        this is preview-only.
      responses:
        "200":
          description: The artist's discography and the default exclusion list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionPreview" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /events:
    get:
      operationId: streamEvents
      tags: [events]
      summary: Server-sent events, filtered by category access.
      description: >-
        Events are lossy and for notification only; anything that must happen is
        a job. Progress is coalesced on a 250ms tick. Resume with `Last-Event-ID`;
        replay is best-effort over a bounded ring, and a client too far behind
        receives a `resync` event rather than a silently partial history.
      parameters:
        - name: topics
          in: query
          description: >-
            Comma-separated subset of topics. Absent means every topic the caller
            may see. An unrecognised name is rejected rather than ignored, so a
            typo is not a silently empty stream.
          required: false
          schema:
            type: array
            items: { $ref: "#/components/schemas/EventTopic" }
          style: form
          explode: false
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The stream. It does not end until the client disconnects.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: medianexus_session
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key

  responses:
    Problem:
      description: An RFC 7807 problem.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }

    ReadyStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ready] }

    LogoutStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [signed-out] }

    Problem:
      type: object
      description: RFC 7807. Every error uses this, including 404 and 405.
      required: [type, title, status]
      properties:
        type:
          description: >-
            A stable slug, not a resolvable URL, so a client can branch on it
            without following a link. Renaming one is a breaking change.
          $ref: "#/components/schemas/ProblemType"
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    ProblemType:
      type: string
      enum:
        - not-found
        - forbidden
        - conflict
        - bad-request
        - method-not-allowed
        - unavailable
        - internal
        - unauthorized

    BuildInfo:
      type: object
      required: [version, commit, build_date, source_url, license, sqlite_driver]
      properties:
        version: { type: string, example: "26.09.1.35" }
        milestone:
          type: string
          example: "music, usenet"
          description: >-
            A name, not a version component (documentation/versioning.md). Empty
            until set with `make milestone NAME="name"`.
        commit:
          type: string
          description: >-
            Reported as `unknown` rather than a plausible-looking wrong value
            when it could not be determined; the source link depends on it.
        build_date: { type: string, format: date-time }
        source_url:
          type: string
          format: uri
          description: >-
            The Corresponding Source for *this* build. A modified build must not
            point at upstream.
        license: { type: string, example: "AGPL-3.0-or-later" }
        sqlite_driver:
          type: string
          example: "modernc"
          description: >-
            Which SQLite implementation this binary was built with (ADR-5). A build
            property, not a setting: it is chosen by a build tag.
        server_time:
          type: string
          format: date-time
          description: >-
            The server's wall clock at the moment of the response. Schedules,
            air dates and retention run on this clock, not the viewer's, and
            on a remote host the two routinely differ.
        timezone:
          type: string
          example: "Europe/Fefobo"
          description: The server's configured zone, from TZ. `UTC` when unset.

    SubscriptionPreview:
      type: object
      required: [release_groups, default_excluded_secondary_types]
      properties:
        release_groups:
          type: array
          items: { $ref: "#/components/schemas/PreviewReleaseGroup" }
        default_excluded_secondary_types:
          type: array
          items: { type: string }
          description: >-
            music.DefaultExcludedSecondaryTypes, so the client can pre-check
            the same boxes a subscription with no filter override would get.

    PreviewReleaseGroup:
      type: object
      required: [mbid, title, secondary_types]
      properties:
        mbid: { type: string }
        title: { type: string }
        primary_type: { type: string, description: "MusicBrainz's own vocabulary (Album, EP, Single, ...)." }
        first_release_date:
          type: string
          description: A partial date (YYYY, YYYY-MM or YYYY-MM-DD), MusicBrainz's own convention, verbatim.
        secondary_types:
          type: array
          items: { type: string }
          description: "MusicBrainz's own vocabulary (Compilation, Live, Remix, ...) -- what a filter matches against."

    LegalText:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: Verbatim file content -- rendered as-is, never reformatted.

    CategoryGrant:
      type: object
      required: [category_id, permission]
      properties:
        category_id: { type: integer, format: int64 }
        permission: { $ref: "#/components/schemas/Permission" }

    UserAccount:
      type: object
      required: [id, username, role, has_password, created_at, access]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        has_password:
          type: boolean
          description: >-
            False for an account that authenticates by proxy header or API key,
            or the passwordless one an open-access install creates.
        created_at: { type: string, format: date-time }
        access:
          type: array
          items: { $ref: "#/components/schemas/CategoryGrant" }

    AuthPolicy:
      type: object
      required: [auth_required, configured_mode, can_sign_in]
      properties:
        auth_required:
          type: boolean
          description: >-
            Whether a caller must present a credential. False serves every
            request as the administrator.
        administrator:
          type: string
          description: >-
            The account a login would use, when one exists. Shown rather than
            asked for: turning a login on sets a password on this account.
        can_sign_in:
          type: boolean
          description: >-
            Whether any account has a password. False means turning a login on
            must set one in the same request, or nobody could get back in.
        configured_mode:
          type: string
          enum: [local, proxy, apikey_only, none]
          description: >-
            How config.yml says callers authenticate when they must. Turning
            authentication back on restores this mode rather than guessing one.

    SetupStatus:
      type: object
      required: [needs_administrator, has_root_folder]
      properties:
        needs_administrator:
          type: boolean
          description: True while no account exists, which is the only time setup can be claimed.
        has_root_folder: { type: boolean }

    RootFolder:
      type: object
      required: [id, path, online]
      properties:
        id: { type: integer, format: int64 }
        path: { type: string }
        label: { type: string }
        online:
          type: boolean
          description: >-
            An unmounted root counts as unavailable, never as free space
            (Invariant 20a).
        writable:
          type: boolean
          description: >-
            Whether this process can write here. False is reported, never
            enforced: ownership on the host is the operator's to decide, and
            MediaNexus does not chown a library it did not create. Absent when
            it has not been probed.
        read_only:
          type: boolean
          description: >-
            Curated policy, not a probed fact: blocks new placement,
            upgrade-in-place and tag write-back, and blocks renaming unless
            allow_rename is also set (Invariant 69).
        allow_rename:
          type: boolean
          description: Overrides read_only for renaming alone (Invariant 69).
        total_bytes: { type: integer, format: int64 }
        free_bytes: { type: integer, format: int64 }
        min_free_bytes:
          type: integer
          format: int64
          description: The user's own reserve; placement refuses to dip below it.
        capacity_checked_at:
          type: string
          format: date-time
          description: Absent until the capacity job has run once for this root.
        categories:
          type: array
          items: { $ref: "#/components/schemas/RootFolderCategory" }
        drain_state:
          type: string
          enum: [NONE, DRAINING, PAUSED, DRAINED]
          description: ADR-51's own drain state machine.
        drain_job_id: { type: integer, format: int64 }

    RootFolderCategory:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }

    DownloadFolder:
      type: object
      description: >-
        One watched upstream-download destination (todo 4.18, section 5.1).
        Registry only -- nothing acts on what lands here until stage 5.
      required: [id, path, readable]
      properties:
        id: { type: integer, format: int64 }
        path: { type: string }
        label: { type: string }
        category_id: { type: integer, format: int64 }
        readable:
          type: boolean
          description: >-
            Probed once, at creation. Nothing refreshes it after -- the same
            gap root_folder.writable had before the capacity job existed.
        readable_reason: { type: string }

    DownloadFolderEntry:
      type: object
      description: >-
        One top-level entry a live directory read found. Not matched
        against import state -- that comparison is stage 5's own job, not
        built yet, so this is a plain listing, not an "unimported files" view.
      required: [name, is_dir]
      properties:
        name: { type: string }
        is_dir: { type: boolean }

    Schedule:
      type: object
      description: One registered periodic task (ADR-59), its effective settings and run-state.
      required: [key, name, tier, default_cadence, cadence, enabled, supports_full]
      properties:
        key: { type: string }
        name: { type: string }
        tier:
          type: string
          enum: [normal, advanced, expert]
          description: ADR-26's visibility tier.
        default_cadence: { type: string, description: The registry's own fallback cadence. }
        cadence:
          type: string
          description: Effective cadence -- a stored override if one exists, default_cadence otherwise.
        enabled: { type: boolean }
        supports_full:
          type: boolean
          description: >-
            Whether POST /schedules/{key}/run?full=true does something different
            from an ordinary run for this task -- library scan's full rescan is
            the only one today (private/questions.md).
        last_run_at: { type: string, format: date-time }
        last_duration_ms: { type: integer, format: int64 }
        last_outcome:
          type: string
          enum: [enqueued, duplicate, error]
          description: Absent until the task has fired at least once.
        last_error: { type: string }
        next_run_at: { type: string, format: date-time }

    SettingDefinition:
      type: object
      description: >-
        One setting registered once in Go (ADR-26, todo 4.14) -- the single
        source for its tier, default and help text. Either a scalar
        instance_setting key, or (kind entity, since the non-scalar audit's
        own deep pass) a whole settings surface such as quality profiles or
        categories, which has no single value and so an always-empty default.
      required: [key, name, tier, kind, default]
      properties:
        key: { type: string }
        name: { type: string }
        tier:
          type: string
          enum: [normal, advanced, expert]
          description: ADR-26's visibility tier.
        kind:
          type: string
          enum: [string, int, float, bool, string_list, entity]
        default:
          type: string
          description: >-
            Encoded the same way the value itself is stored (a JSON array
            for string_list). Always empty for kind entity.
        help_text: { type: string }

    CacheReport:
      type: object
      description: The cache's own budgets and last-measured size per namespace (ADR-60).
      required: [max_bytes, max_age_days, images_share_percent, metadata_share_percent]
      properties:
        max_bytes: { type: integer, format: int64 }
        max_age_days: { type: integer, format: int64 }
        images_share_percent: { type: integer, format: int64 }
        metadata_share_percent: { type: integer, format: int64 }
        images_bytes:
          type: integer
          format: int64
          description: Absent until the cache maintenance task has run once.
        metadata_bytes:
          type: integer
          format: int64
          description: >-
            Logical bytes stored, a real measurement -- not metadata.db's own
            physical file size, which does not shrink on eviction without a
            VACUUM this codebase deliberately does not run.
        measured_at: { type: string, format: date-time }

    NetworkSettings:
      type: object
      description: >-
        ADR-58's own port resolution, egress proxy and IP allowlist. The IP
        allowlist can only ever deny -- it never authenticates and never
        grants (Invariant 89).
      required: [port, in_effect_port, restart_required, proxy_bypass, allow_cidrs]
      properties:
        port:
          type: integer
          description: >-
            0 means nothing has been written from this screen yet --
            config.yml (or its own 5454 default) governs until it is.
        in_effect_port:
          type: integer
          description: The port this running instance actually bound to at startup.
        restart_required:
          type: boolean
          description: port disagrees with in_effect_port -- the change is stored but not live yet.
        proxy_url:
          type: string
          description: Empty means no egress proxy. Scheme is http, https or socks5.
        proxy_bypass:
          type: array
          items: { type: string }
          description: CIDRs and host suffixes (".lan") that always go direct.
        allow_cidrs:
          type: array
          items: { type: string }
          description: Empty means every address is allowed, the default.

    NetworkSettingsUpdate:
      type: object
      description: The writable half of NetworkSettings.
      required: [port, proxy_bypass, allow_cidrs]
      properties:
        port: { type: integer }
        proxy_url: { type: string }
        proxy_bypass: { type: array, items: { type: string } }
        allow_cidrs: { type: array, items: { type: string } }

    DrainPlan:
      type: object
      description: >-
        What one drainRootFolder call computed -- a preview, a refusal, or
        an accepted and enqueued plan (ADR-51).
      required: [accepted, files_total, bytes_total, moves, refused, root_deltas]
      properties:
        accepted:
          type: boolean
          description: False for a preview or a refused plan; nothing was persisted.
        move_job_id: { type: integer, format: int64 }
        files_total: { type: integer, format: int64 }
        bytes_total: { type: integer, format: int64 }
        moves:
          type: array
          items: { $ref: "#/components/schemas/DrainMove" }
        refused:
          type: array
          items: { $ref: "#/components/schemas/DrainRefusal" }
        root_deltas:
          type: array
          items: { $ref: "#/components/schemas/RootDelta" }

    DrainMove:
      type: object
      required: [media_object_id, dest_root_folder_id, dest_rel_path, size_bytes, affinity_key]
      properties:
        media_object_id: { type: integer, format: int64 }
        source_rel_path:
          type: string
          description: >-
            The file's current path -- present so a caller can render the
            full "current vs proposed" diff section 11.8 asks for, not just
            the proposed side.
        dest_root_folder_id: { type: integer, format: int64 }
        dest_rel_path: { type: string }
        size_bytes: { type: integer, format: int64 }
        affinity_key:
          type: string
          description: The top-level directory this file was grouped and moved with.
        warnings:
          type: array
          items: { type: string }
          description: >-
            Non-fatal notices about dest_rel_path -- today, only naming's
            own total-path-length recommendation. Always present but only
            ever populated for a rename plan; a drain never renames a file,
            so this is always empty there.

    DrainRefusal:
      type: object
      required: [media_object_id, affinity_key, reason]
      properties:
        media_object_id: { type: integer, format: int64 }
        affinity_key: { type: string }
        reason: { type: string }

    RootDelta:
      type: object
      description: One root's own preview -- Invariant 73's "preview first".
      required: [root_folder_id, bytes_in, bytes_out, resulting_free_bytes]
      properties:
        root_folder_id: { type: integer, format: int64 }
        bytes_in: { type: integer, format: int64 }
        bytes_out: { type: integer, format: int64 }
        resulting_free_bytes: { type: integer, format: int64 }

    MoveJob:
      type: object
      required: [id, reason, state, files_total, files_done, bytes_total, bytes_done, created_at]
      properties:
        id: { type: integer, format: int64 }
        reason: { type: string, enum: [RENAME, CATEGORY, REBALANCE, DRAIN] }
        source_root_id: { type: integer, format: int64 }
        state: { type: string, enum: [PLANNED, RUNNING, PAUSED, DONE, FAILED] }
        files_total: { type: integer, format: int64 }
        files_done: { type: integer, format: int64 }
        bytes_total: { type: integer, format: int64 }
        bytes_done: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        error: { type: string }

    Identity:
      type: object
      required: [user_id, username, role]
      properties:
        user_id: { type: integer, format: int64 }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    Role:
      type: string
      enum: [admin, operator, readonly]

    Permission:
      type: string
      description: >-
        `none` is never returned: a category a caller cannot read is absent
        entirely, and reaching it directly is a 404 rather than a 403.
      enum: [none, read, request, manage]

    Me:
      type: object
      required: [user_id, role, tier, categories]
      properties:
        user_id: { type: integer, format: int64 }
        role: { $ref: "#/components/schemas/Role" }
        tier:
          type: string
          enum: [normal, advanced, expert]
          description: >-
            How much of the settings surface this caller is shown (ADR-26).
            Self-service via PATCH /me/tier -- raising or lowering it never
            changes behaviour, only what is displayed.
        categories:
          type: array
          items: { $ref: "#/components/schemas/Category" }

    APIKey:
      type: object
      description: >-
        A non-interactive credential (X-Api-Key or Bearer), never the key
        itself or its hash -- see CreatedAPIKey for the one response that
        does carry the plaintext.
      required: [id, name, created_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: "Prowlarr" }
        created_at: { type: string, format: date-time }
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: Null until the key is presented for the first time.

    CreatedAPIKey:
      description: >-
        Answered only once, by POST /me/apikeys -- `key` is the plaintext,
        shown here and never again.
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [key]
          properties:
            key: { type: string, example: "mnx_..." }

    Category:
      type: object
      required: [id, media_type, name, permission]
      properties:
        id: { type: integer, format: int64 }
        media_type: { $ref: "#/components/schemas/MediaType" }
        name: { type: string, example: "anime" }
        permission: { $ref: "#/components/schemas/Permission" }

    MediaType:
      type: string
      description: >-
        Manga, magazines, music videos and adult galleries are categories of
        these rather than types of their own.
      enum:
        - music
        - tv
        - movie
        - audiobook
        - book
        - adult
        - comic
        - rom
        - podcast
        - news
        - youtube

    EventTopic:
      type: string
      enum: [job, acquisition, library, notification, pressure]

    Egress:
      type: object
      description: >-
        Every field is optional: a check that is switched off, has not run yet
        or has failed reports nothing rather than a stale or invented address.
      properties:
        public_ip: { type: string, example: "203.0.113.42" }
        checked_at: { type: string, format: date-time }
        source:
          type: string
          description: The echo service that answered, so the number is attributable.
        error:
          type: string
          description: Why the last attempt failed, when it did.
        enabled:
          type: boolean
          description: Whether the check is configured to run at all.

    DashboardSummary:
      type: object
      required: [root_folders, jobs, library]
      properties:
        root_folders:
          type: array
          items: { $ref: "#/components/schemas/RootFolder" }
        jobs: { $ref: "#/components/schemas/JobCounts" }
        library: { $ref: "#/components/schemas/LibraryCounts" }

    LibraryHealth:
      type: object
      description: >-
        Todo 4.8's own aggregate report. Every *_count is exact; every list
        alongside one is a bounded sample (the first 20), not the full set.
      required: [unprobed_count, unprobed_files, unmatched_count, incomplete_count,
                 incomplete_works, roots_near_reserve, blocked_present]
      properties:
        unprobed_count: { type: integer, description: Files with no measured attributes yet (ADR-39). }
        unprobed_files:
          type: array
          items: { $ref: "#/components/schemas/UnprobedFile" }
        unmatched_count: { type: integer, description: Files waiting in the manual identification queue (F29). }
        incomplete_count: { type: integer, description: Monitored works still short of their own required track count. }
        incomplete_works:
          type: array
          items: { $ref: "#/components/schemas/IncompleteWork" }
        roots_near_reserve:
          type: array
          description: Every online root whose free space has fallen within 10% of its own configured reserve.
          items: { $ref: "#/components/schemas/RootNearReserve" }
        blocked_present:
          type: array
          description: Blocked hashes (ADR-53 part 2) a scan found still sitting in the library (Invariant 83).
          items: { $ref: "#/components/schemas/BlockedPresent" }

    UnprobedFile:
      type: object
      required: [root_folder_id, rel_path]
      properties:
        root_folder_id: { type: integer, format: int64 }
        rel_path: { type: string }

    IncompleteWork:
      type: object
      required: [work_id, title, category_id, state, required_count, present_count]
      properties:
        work_id: { type: integer, format: int64 }
        title: { type: string }
        category_id: { type: integer, format: int64 }
        state: { type: string, enum: [MISSING, PARTIAL] }
        required_count: { type: integer, format: int64 }
        present_count: { type: integer, format: int64 }

    RootNearReserve:
      type: object
      required: [root_folder_id, path, free_bytes, min_free_bytes]
      properties:
        root_folder_id: { type: integer, format: int64 }
        path: { type: string }
        free_bytes: { type: integer, format: int64 }
        min_free_bytes: { type: integer, format: int64 }

    BlockedPresent:
      type: object
      required: [blocked_content_id, reason, title, media_object_id, root_folder_id, rel_path]
      properties:
        blocked_content_id: { type: integer, format: int64 }
        reason: { type: string }
        title: { type: string }
        media_object_id: { type: integer, format: int64 }
        root_folder_id: { type: integer, format: int64 }
        rel_path: { type: string }

    JobCounts:
      type: object
      description: Live counts over jobs.db, which retention keeps bounded.
      required: [total, pending, running, failed, succeeded, cancelled]
      properties:
        total: { type: integer }
        pending:
          type: integer
          description: PENDING and PENDING_RETRY together; both are waiting.
        running:
          type: integer
          description: RUNNING and LEASED together; both are claimed by a worker.
        failed: { type: integer }
        succeeded: { type: integer }
        cancelled: { type: integer }

    LibraryCounts:
      type: object
      description: >-
        Read from the `counter` table, never aggregated live (section 21.12,
        ADR-28). Absent counters report zero, so an empty library and an
        uncounted one look the same until the reconciliation job has run.
      required: [works, files, monitored, missing, probed, unprobed, fresh]
      properties:
        works: { type: integer }
        files: { type: integer }
        monitored: { type: integer }
        missing: { type: integer }
        probed:
          type: integer
          description: >-
            Files with a measured attributes row (ADR-39). Same "library"
            counter scope as the others, a distinct metric pair
            (library.ProbeCoverage, todo 4.2) reconciled by its own sweep.
        unprobed:
          type: integer
          description: total_files minus probed, computed here rather than stored twice.
        fresh:
          type: integer
          description: >-
            Works released within the freshness window (ADR-55, todo 4.20).
            Same "library" counter scope, a distinct metric
            (library.FreshCounts) reconciled by its own sweep.

    JobState:
      type: string
      enum: [PENDING, PENDING_RETRY, LEASED, RUNNING, SUCCEEDED, FAILED, CANCELLED]

    JobPool:
      type: string
      enum: [search, acquire, import, metadata, maintenance]

    Job:
      type: object
      description: >-
        The job's payload is deliberately absent. It can carry paths and provider
        identifiers, and a listing is not the place to hand that out.
      required: [id, type, pool, state, priority, attempts, max_attempts, run_after, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, example: "library.scan" }
        pool: { $ref: "#/components/schemas/JobPool" }
        state: { $ref: "#/components/schemas/JobState" }
        priority: { type: integer }
        attempts: { type: integer }
        max_attempts: { type: integer }
        category_id: { type: integer, format: int64 }
        correlation_id: { type: string }
        last_error: { type: string }
        run_after: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    JobPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Job" }
        next_cursor:
          type: string
          description: >-
            Empty on the last page, which is how a client knows to stop without
            one more request that returns nothing.

    Work:
      type: object
      required: [id, media_type, title, sort_title, added_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        media_type: { type: string, example: "music" }
        title: { type: string }
        sort_title: { type: string }
        year: { type: integer }
        artist:
          type: string
          description: >-
            The work's own "artist"-role credit, when it has one. Not a
            sort option on this endpoint yet -- nothing has asked for it.
        added_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        wanted_state:
          type: string
          enum: [MISSING, PARTIAL, COMPLETE, UPGRADABLE]
          description: >-
            Set when this work has a monitored desired_item, regardless of
            whether the wanted filter was used.

    WorkPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Work" }
        next_cursor:
          type: string
          description: >-
            Empty on the last page, which is how a client knows to stop without
            one more request that returns nothing.

    DiscoverResult:
      type: object
      description: One candidate a search found (ADR-56) -- not yet in the library.
      required: [provider, external_id, title]
      properties:
        provider: { type: string, example: "musicbrainz:release-group" }
        external_id: { type: string }
        title: { type: string }
        artist: { type: string }
        year: { type: integer, format: int64 }

    DiscoverAddRequest:
      type: object
      required: [category_id, provider, external_id]
      properties:
        category_id: { type: integer, format: int64 }
        provider: { type: string }
        external_id: { type: string }
        monitored: { type: boolean, default: true }

    DiscoverAddResult:
      type: object
      required: [work_id, desired_item_id, priority]
      properties:
        work_id: { type: integer, format: int64 }
        desired_item_id: { type: integer, format: int64 }
        priority:
          type: integer
          format: int64
          description: >-
            ADR-36's composite score, computed against the user_request
            trigger. There is no populated hunt_queue yet (stage 5/6), so this
            is the score alone, not a position within it.

    ArrApp:
      type: string
      enum: [lidarr, sonarr, radarr, readarr, whisparr]
      description: >-
        Which *Arr application a connection talks to (ADR-52). Only lidarr
        has a real sync this pass (music exists); the other four can be
        connected for when their own stage ships.

    SecretMask:
      type: object
      required: [has_value]
      description: >-
        A credential, shown without ever exposing it (section 13.1). The raw
        value exists only between the database and the one outbound request
        that needs it.
      properties:
        has_value: { type: boolean }
        masked:
          type: string
          description: A short hint ("abc…xyz"), present only when has_value is true.

    ArrInstance:
      type: object
      required: [id, app, name, base_url, enabled, api_key, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        app: { $ref: "#/components/schemas/ArrApp" }
        name: { type: string }
        base_url: { type: string }
        category_id:
          type: integer
          format: int64
          description: >-
            Where imported intent lands. Unset means match each artist's own
            root folder path against a configured root folder instead.
        enabled: { type: boolean }
        api_key: { $ref: "#/components/schemas/SecretMask" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_synced_at: { type: string, format: date-time }
        last_sync_error: { type: string }

    ArrRootFolder:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: As the *Arr instance's own container sees it.

    AddArrInstanceRequest:
      type: object
      required: [app, name, base_url, api_key]
      properties:
        app: { $ref: "#/components/schemas/ArrApp" }
        name: { type: string, minLength: 1 }
        base_url: { type: string, minLength: 1 }
        api_key: { type: string, minLength: 1 }
        category_id: { type: integer, format: int64 }
        enabled: { type: boolean, default: true }

    UpdateArrInstanceRequest:
      type: object
      required: [name, base_url]
      properties:
        name: { type: string, minLength: 1 }
        base_url: { type: string, minLength: 1 }
        category_id: { type: integer, format: int64 }
        enabled: { type: boolean, default: true }

    ArrImportRun:
      type: object
      required:
        [id, instance_id, app, state, started_at, artists_created, artists_matched,
         albums_created, albums_matched, items_parked]
      properties:
        id: { type: integer, format: int64 }
        instance_id: { type: integer, format: int64 }
        app: { $ref: "#/components/schemas/ArrApp" }
        state: { type: string, enum: [RUNNING, DONE, FAILED, REVERTED] }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        error: { type: string }
        artists_created: { type: integer, format: int64 }
        artists_matched: { type: integer, format: int64 }
        albums_created: { type: integer, format: int64 }
        albums_matched: { type: integer, format: int64 }
        items_parked: { type: integer, format: int64 }

    ArrImportItem:
      type: object
      required: [id, import_id, kind, source_id, title, person_created, work_created, desired_item_created, created_at]
      properties:
        id: { type: integer, format: int64 }
        import_id: { type: integer, format: int64 }
        kind: { type: string, enum: [artist, album, parked] }
        source_id: { type: string, description: The *Arr app's own id for this entity. }
        title: { type: string }
        person_id: { type: integer, format: int64 }
        person_created: { type: boolean }
        subscription_id: { type: integer, format: int64 }
        work_id: { type: integer, format: int64 }
        work_created: { type: boolean }
        desired_item_id: { type: integer, format: int64 }
        desired_item_created: { type: boolean }
        created_at: { type: string, format: date-time }

    ArrImportDetail:
      type: object
      required: [run, items]
      properties:
        run: { $ref: "#/components/schemas/ArrImportRun" }
        items:
          type: array
          items: { $ref: "#/components/schemas/ArrImportItem" }

    ArrImportRevertResult:
      type: object
      required: [works_deleted, subscriptions_deleted, people_deleted, errors]
      properties:
        works_deleted: { type: integer }
        subscriptions_deleted: { type: integer }
        people_deleted: { type: integer }
        errors:
          type: array
          items: { type: string }

    Person:
      type: object
      description: A person, first-class and monitorable in their own right (ADR-32).
      required: [id, name, sort_name, monitored]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        sort_name: { type: string }
        disambiguation: { type: string }
        kind: { type: string, example: "Person" }
        gender: { type: string }
        country: { type: string }
        born: { type: string, example: "1958-07-30" }
        died: { type: string }
        monitored: { type: boolean }

    PersonPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Person" }
        next_cursor:
          type: string
          description: >-
            Empty on the last page, which is how a client knows to stop without
            one more request that returns nothing.

    PersonWork:
      type: object
      description: >-
        One work in a person's discography, plus the artist page's own
        "available / missing / requested" signal (Lidarr-like discography).
      required: [id, media_type, title, sort_title, on_disk]
      properties:
        id: { type: integer, format: int64 }
        media_type: { type: string, example: "music" }
        title: { type: string }
        sort_title: { type: string }
        year: { type: integer }
        primary_type:
          type: string
          example: "Album"
          description: >-
            MusicBrainz's own release-group vocabulary (Album, EP, Single,
            Broadcast, Other, ...), when known -- absent for a work created
            before this existed, or from a source with no MusicBrainz answer.
        wanted_state:
          type: string
          enum: [MISSING, PARTIAL, COMPLETE, UPGRADABLE]
          description: Set when this work has a monitored desired_item, same as Work's own.
        on_disk:
          type: boolean
          description: Whether this work is linked to any root folder at all (WorkDetail's own OnDisk).

    PersonDetail:
      allOf:
        - $ref: "#/components/schemas/Person"
        - type: object
          required: [aliases, genres, discography]
          properties:
            biography:
              type: string
              description: A Wikidata-sourced extract, when available (ADR-8).
            aliases:
              type: array
              items: { type: string }
            genres:
              type: array
              items: { type: string }
              description: >-
                The union of every genre tagged on any work in discography --
                a person carries no genre of their own (ADR-32's own fields
                are biographical).
            discography:
              type: array
              items: { $ref: "#/components/schemas/PersonWork" }

    ExternalID:
      type: object
      description: One provider's id for a work, edition or part.
      required: [provider, external_id]
      properties:
        provider: { type: string, example: "musicbrainz:release-group" }
        external_id: { type: string }

    Edition:
      type: object
      required: [id, kind, label, is_default, external_ids]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, example: "official" }
        label: { type: string }
        year: { type: integer }
        format: { type: string, example: "CD" }
        catalogue_number: { type: string }
        barcode: { type: string }
        runtime_ms: { type: integer, format: int64 }
        is_default: { type: boolean }
        external_ids:
          type: array
          items: { $ref: "#/components/schemas/ExternalID" }

    WorkPart:
      type: object
      required: [id, media_ref, sort_key, monitored, external_ids]
      properties:
        id: { type: integer, format: int64 }
        media_ref: { type: string }
        sort_key: { type: string }
        title: { type: string }
        runtime_ms: { type: integer, format: int64 }
        date: { type: string }
        monitored: { type: boolean }
        wanted:
          description: >-
            This track's own SINGLE desired_item, when one exists -- distinct
            from monitored, which only affects the album's own required_count.
          allOf: [{ $ref: "#/components/schemas/Wanted" }]
          nullable: true
        external_ids:
          type: array
          items: { $ref: "#/components/schemas/ExternalID" }

    Credit:
      type: object
      description: One work-level credit (ADR-32) -- the person's own name, so a client never needs a second round-trip just to display it.
      required: [person_id, person_name, role]
      properties:
        person_id: { type: integer, format: int64 }
        person_name: { type: string }
        role: { type: string, example: "artist" }

    BulkResult:
      type: object
      description: How many rows a bulk action (section 21.7) matched, and, unless it was a preview, changed.
      required: [count]
      properties:
        count: { type: integer, format: int64 }

    Wanted:
      type: object
      description: >-
        The work's own album-level SET desired_item (section 19.6) -- what
        makes "9 of 12 tracks" a fact rather than on_disk's coarse badge.
      required: [id, monitored, present_count, state]
      properties:
        id: { type: integer, format: int64 }
        monitored: { type: boolean }
        required_count:
          type: integer
          format: int64
          nullable: true
          description: Null until a tracklist has been enriched -- never a guessed zero.
        present_count: { type: integer, format: int64 }
        state: { type: string, enum: [MISSING, PARTIAL, COMPLETE, UPGRADABLE] }

    WorkDetail:
      type: object
      required:
        - id
        - media_type
        - title
        - sort_title
        - on_disk
        - added_at
        - updated_at
        - external_ids
        - editions
        - parts
        - credits
        - genres
      properties:
        id: { type: integer, format: int64 }
        media_type: { type: string, example: "music" }
        title: { type: string }
        sort_title: { type: string }
        year: { type: integer }
        runtime_ms: { type: integer, format: int64 }
        language: { type: string }
        description:
          type: string
          description: >-
            A Wikidata-sourced summary, when the work has a linked Wikidata
            entity (ADR-8). Absent otherwise -- MusicBrainz itself carries no
            such field.
        on_disk:
          type: boolean
          description: >-
            Whether this work is linked to any root folder at all. The
            coarsest possible "is there really a file for this" signal --
            per-track presence needs a media_object-to-work_part link this
            project does not have yet.
        added_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        external_ids:
          type: array
          items: { $ref: "#/components/schemas/ExternalID" }
        editions:
          type: array
          items: { $ref: "#/components/schemas/Edition" }
        credits:
          type: array
          items: { $ref: "#/components/schemas/Credit" }
        genres:
          type: array
          items: { type: string }
        parts:
          type: array
          items: { $ref: "#/components/schemas/WorkPart" }
        wanted:
          allOf: [{ $ref: "#/components/schemas/Wanted" }]
          nullable: true
          description: Null when nothing has ever wanted this album -- no scan, no subscription, no request.

    SearchResult:
      type: object
      required: [work, score]
      properties:
        work: { $ref: "#/components/schemas/Work" }
        score:
          type: number
          description: >-
            Lower is a better match (bm25 rank, ascending). Not meaningfully comparable
            across two different queries.

    UnidentifiedCandidate:
      type: object
      description: >-
        One ranked candidate the ADR-24 chain found but was not confident
        enough to resolve automatically -- RunChain's merged Candidates,
        best first. Empty on a file that matched nothing at all.
      required: [strategy, confidence]
      properties:
        strategy: { type: string, example: "embedded-tag" }
        provider: { type: string, example: "musicbrainz:release-group" }
        external_id: { type: string }
        confidence: { type: number }

    UnidentifiedFile:
      type: object
      required: [media_object_id, root_folder_id, rel_path, candidates, first_seen_at, last_seen_at]
      properties:
        media_object_id: { type: integer, format: int64 }
        root_folder_id: { type: integer, format: int64 }
        rel_path: { type: string }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/UnidentifiedCandidate" }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }

    UnidentifiedPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UnidentifiedFile" }
        next_cursor:
          type: string
          description: >-
            Empty on the last page, which is how a client knows to stop without
            one more request that returns nothing.

    ExclusionPattern:
      type: object
      description: >-
        "A file shaped like this is not media" -- by name or extension glob,
        never by content (ADR-53 part 1). `media_type` absent means every
        media type; `category_id` absent means every category of that
        media type.
      required: [id, pattern, action, note, builtin, enabled]
      properties:
        id: { type: integer, format: int64 }
        pattern: { type: string, example: "*.exe" }
        action:
          type: string
          enum: [ignore, refuse]
          description: >-
            `ignore` skips the file silently. `refuse` poisons the whole
            unit it is found in -- nothing in that unit imports.
        media_type: { type: string }
        category_id: { type: integer, format: int64 }
        note:
          type: string
          description: Why this pattern exists, shown wherever it fires.
        builtin:
          type: boolean
          description: A shipped default -- still editable and removable.
        enabled: { type: boolean }

    ExclusionPatternWrite:
      type: object
      required: [pattern, action]
      properties:
        pattern: { type: string, example: "*.exe" }
        action: { type: string, enum: [ignore, refuse] }
        media_type: { type: string }
        category_id: { type: integer, format: int64 }
        note: { type: string }
        enabled: { type: boolean, default: true }

    QualityProfile:
      type: object
      description: >-
        ADR-40's policy: hard gates, then lexicographic tiers, then an
        additive score. `rules` and `upgrade` are kept as opaque JSON here --
        internal/identify/score owns that shape (Parse/ParseUpgrade); this
        layer only checks a name and that they decode (settings.
        validateQualityProfile).
      required: [id, name, rules, upgrade]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        rules:
          type: string
          description: ADR-40's rule JSON -- internal/identify/score.Parse's own shape.
        upgrade:
          type: string
          description: ADR-40's upgrade JSON -- internal/identify/score.ParseUpgrade's own shape.

    QualityProfileWrite:
      type: object
      required: [name, rules, upgrade]
      properties:
        name: { type: string, minLength: 1 }
        rules: { type: string }
        upgrade: { type: string }

    LanguageProfile:
      type: object
      description: >-
        Section 19.8's policy: language is its own axis, belonging to a
        category rather than a media type. Required lists use any_of
        semantics -- at least one listed language must be present, evaluated
        from the probe, never the release name. An empty preferred/required
        list is valid (some categories, e.g. music, have no language policy
        at all).
      required:
        [id, name, audio_preferred, audio_required, subtitle_preferred,
         subtitle_required, prefer_original_audio, reject_dubbed]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        audio_preferred: { type: array, items: { type: string } }
        audio_required: { type: array, items: { type: string } }
        subtitle_preferred: { type: array, items: { type: string } }
        subtitle_required: { type: array, items: { type: string } }
        prefer_original_audio: { type: boolean }
        reject_dubbed: { type: boolean }

    LanguageProfileWrite:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        audio_preferred: { type: array, items: { type: string } }
        audio_required: { type: array, items: { type: string } }
        subtitle_preferred: { type: array, items: { type: string } }
        subtitle_required: { type: array, items: { type: string } }
        prefer_original_audio: { type: boolean, default: false }
        reject_dubbed: { type: boolean, default: false }

    BlockedContentEntry:
      type: object
      description: >-
        Bytes that never enter the library again (ADR-53 part 2), keyed on
        content hashes, never on a filename (Invariant 82). At least one of
        `oshash`/`quick_hash`/`chromaprint`/`phash` is always present.
      required:
        - id, size_bytes, reason, title, release_group, source, created_at, hit_count
      properties:
        id: { type: integer, format: int64 }
        oshash: { type: string }
        quick_hash: { type: string }
        chromaprint: { type: string }
        phash: { type: string }
        size_bytes: { type: integer, format: int64 }
        reason:
          type: string
          enum: [FAKE, MISLABELLED, CORRUPT, UNWANTED, EXECUTABLE]
        note: { type: string }
        media_type: { type: string }
        title:
          type: string
          description: What the blocked release claimed to be, for the UI.
        release_group: { type: string }
        source: { type: string, enum: [user, auto] }
        expires_at:
          type: string
          format: date-time
          description: Absent means permanent -- manual blocks always are.
        created_at: { type: string, format: date-time }
        hit_count:
          type: integer
          format: int64
          description: How many times this block has fired since it was created.
        last_hit_at: { type: string, format: date-time }

    RemoveAndBlockRequest:
      type: object
      description: >-
        Each step is independently requestable (architecture.md section
        10.8's own text) -- requesting none of the four is accepted and
        does nothing.
      properties:
        quarantine: { type: boolean, default: false }
        quarantine_reason:
          type: string
          enum: [rejected_worse, replaced, junk, user_delete, failed_import]
          default: user_delete
        quarantine_retain_hours:
          type: integer
          default: 168
          description: How long the quarantined copy survives before Sweep purges it.
        block: { type: boolean, default: false }
        oshash: { type: string }
        quick_hash: { type: string }
        block_reason:
          type: string
          enum: [FAKE, MISLABELLED, CORRUPT, UNWANTED, EXECUTABLE]
          default: FAKE
        block_note: { type: string }
        block_title: { type: string }
        release_group: { type: string }
        blocklist: { type: boolean, default: false }
        indexer_id: { type: integer, format: int64 }
        guid: { type: string }
        content_hash: { type: string }
        blocklist_title: { type: string }
        desired_item_id: { type: integer, format: int64 }
        reopen: { type: boolean, default: false }

    RemoveAndBlockResult:
      type: object
      description: What the action actually did -- each field only set when its own step ran.
      required: [quarantined_paths, cross_device_deletes, reopened_items]
      properties:
        quarantined_paths:
          type: array
          items: { type: string }
          description: The quarantine path each copy landed at, one per copy actually moved.
        cross_device_deletes:
          type: integer
          description: >-
            Copies that turned out to be on a different filesystem than
            their own quarantine directory -- deleted directly instead of
            quarantined (section 10.8), unrestorable.
        block_id:
          type: integer
          format: int64
          description: Present when `block` was requested.
        blocklist_id:
          type: integer
          format: int64
          description: Present when `blocklist` was requested.
        reopened_items:
          type: array
          items: { type: integer, format: int64 }
          description: Every desired_item id detached and recomputed.

    PrioritySettings:
      type: object
      description: ADR-36's trigger weights and ADR-55's release-date freshness window.
      required: [user_request_weight, new_release_weight, gap_weight, upgrade_weight, new_release_days]
      properties:
        user_request_weight: { type: integer, format: int64, description: Bigger is more urgent. Default 40. }
        new_release_weight: { type: integer, format: int64, description: Bigger is more urgent. Default 30. }
        gap_weight: { type: integer, format: int64, description: Bigger is more urgent. Default 20. }
        upgrade_weight: { type: integer, format: int64, description: Bigger is more urgent. Default 10. }
        new_release_days:
          type: integer
          format: int64
          description: Days after release an item still counts as new rather than a gap. Default 7.

    ImportSettings:
      type: object
      description: ADR-48's own single commit-line knob (import.auto_commit_confidence).
      required: [auto_commit_confidence]
      properties:
        auto_commit_confidence:
          type: number
          format: float
          description: 0.75-0.95, the section 11.4 table's five named levels. Default 0.90.

    ImportInspectRequest:
      type: object
      description: Where to look, and what kind of import this is (ADR-48).
      required: [source_path]
      properties:
        source_path: { type: string }
        origin:
          type: string
          enum: [manual, acquisition, watched, adoption]
          description: Defaults to manual when omitted.
        category_id:
          type: integer
          format: int64
          description: The target category, when known up front. Omitted means "decide per unit".

    ImportInspectResult:
      type: object
      required: [enqueued]
      properties:
        enqueued: { type: boolean }

    ImportRevertRequest:
      type: object
      properties:
        quarantine_retain_hours:
          type: integer
          description: Defaults to 168 (one week), the same default RemoveAndBlockRequest uses.

    ImportPlacementResult:
      type: object
      description: >-
        POST .../category's own outcome: every unit the session had already
        decided COMMIT but not yet placed, placed best-effort.
      required: [units_placed, errors]
      properties:
        units_placed: { type: integer, format: int64 }
        errors:
          type: array
          items: { type: string }
          description: One entry per unit that could not be placed; never fatal to the rest.

    ImportRevertResult:
      type: object
      required: [units_reverted, works_deleted, editions_deleted, quarantined_paths]
      properties:
        units_reverted: { type: integer, format: int64 }
        works_deleted:
          type: integer
          format: int64
          description: Only a work this session's own CommitUnit created, never one it matched.
        editions_deleted: { type: integer, format: int64 }
        quarantined_paths:
          type: array
          items: { type: string }

    ImportSession:
      type: object
      description: One inspection-and-import run over one source path (ADR-48).
      required:
        - id
        - source_path
        - origin
        - state
        - threshold
        - units_total
        - units_committed
        - units_queued
        - units_skipped
        - units_failed
        - bytes_imported
        - started_at
      properties:
        id: { type: integer, format: int64 }
        source_path: { type: string }
        origin: { type: string, enum: [manual, acquisition, watched, adoption] }
        category_id: { type: integer, format: int64 }
        state:
          type: string
          enum: [INSPECTING, IMPORTING, CANCELLING, DONE, FAILED, REVERTED, CANCELLED]
        threshold:
          type: number
          format: float
          description: import.auto_commit_confidence's value in force for this run.
        units_total: { type: integer, format: int64 }
        units_estimated:
          type: integer
          format: int64
          description: >-
            A cheap, tag-free pre-count of what Walk will find (todo 4.21's
            ETA), absent until the estimate pass finishes. May undercount a
            directory tag evidence alone would have split further.
        units_committed: { type: integer, format: int64 }
        units_queued: { type: integer, format: int64 }
        units_skipped: { type: integer, format: int64 }
        units_failed: { type: integer, format: int64 }
        bytes_imported:
          type: integer
          format: int64
          description: Only committed units' bytes.
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        error: { type: string }

    ImportEvidenceSignal:
      type: object
      required: [kind]
      properties:
        kind: { type: string }
        detail: { type: string }

    ImportEvidence:
      type: object
      description: Every GROUP signal that shaped this unit's boundary (ADR-10 shape).
      properties:
        signals:
          type: array
          items: { $ref: "#/components/schemas/ImportEvidenceSignal" }
        ambiguous:
          type: boolean
          description: >-
            True when grouping had to infer a boundary from a weaker signal
            rather than a decisive one.

    ImportCandidate:
      type: object
      description: One IDENTIFY strategy's ranked answer for a unit.
      required: [strategy, confidence]
      properties:
        strategy: { type: string }
        work_id: { type: integer, format: int64 }
        provider: { type: string }
        external_id: { type: string }
        confidence: { type: number, format: float }

    ImportUnit:
      type: object
      description: One unit ADR-48's pipeline found and decided.
      required: [id, session_id, rel_path, shape, file_count, bytes, confidence, decision]
      properties:
        id: { type: integer, format: int64 }
        session_id: { type: integer, format: int64 }
        rel_path:
          type: string
          description: The unit's own root, relative to the session's source_path.
        shape:
          type: string
          enum: [SINGLE, SET, PACK, MULTI_DISC]
        file_count: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }
        confidence: { type: number, format: float }
        decision:
          type: string
          enum: [COMMIT, QUEUE, SKIP, FAILED]
        work_id:
          type: integer
          format: int64
          description: >-
            Non-null once this unit is actually placed in the library, not
            merely decided COMMIT -- null with decision=COMMIT means the
            session has no category_id to place into, or placement has not
            run yet.
        edition_id: { type: integer, format: int64 }
        evidence: { $ref: "#/components/schemas/ImportEvidence" }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/ImportCandidate" }
        reason: { type: string }
        pack_id:
          type: integer
          format: int64
          description: Non-null once todo 4.11's own detection finds this unit belongs to a pack.

    Pack:
      type: object
      description: One source, many works (ADR-50, todo 4.11) -- a provenance fact, not an identity tier.
      required: [id, kind, detected_from, confidence, title, member_count, resolved_count, created_at]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [DISCOGRAPHY, BOX_SET, ANTHOLOGY, COMPILATION] }
        detected_from: { type: string, enum: [structure, structure_and_name] }
        confidence: { type: number, format: float }
        title: { type: string, description: As released, for display only. }
        acquisition_id: { type: integer, format: int64 }
        session_id: { type: integer, format: int64 }
        member_count: { type: integer, format: int64 }
        resolved_count:
          type: integer
          format: int64
          description: Members that identified and placed.
        created_at: { type: string, format: date-time }

    PackItem:
      type: object
      description: One member of a pack.
      required: [ord, state]
      properties:
        ord: { type: integer, format: int64 }
        work_id: { type: integer, format: int64 }
        edition_id: { type: integer, format: int64 }
        import_unit_id: { type: integer, format: int64 }
        state: { type: string, enum: [RESOLVED, QUEUED, FAILED, SKIPPED] }

    PackDetail:
      type: object
      description: One pack plus its own members, in the order they were recorded.
      required: [pack, items]
      properties:
        pack: { $ref: "#/components/schemas/Pack" }
        items:
          type: array
          items: { $ref: "#/components/schemas/PackItem" }

    LibraryCategory:
      type: object
      description: >-
        A category as a navigation target: no `permission` field, since the
        list is already narrowed to what the caller may read (unlike `Me`'s
        `categories`, which reports the caller's level on each).
      required: [id, media_type, name]
      properties:
        id: { type: integer, format: int64 }
        media_type: { type: string, example: "music" }
        name: { type: string }
        works:
          type: integer
          description: >-
            From the counter table (section 21.12), never a live COUNT. 0 until
            the reconciliation sweep has run at least once.
        files:
          type: integer

    CategorySettings:
      type: object
      description: >-
        A category's full settings-side detail (ADR-27's policy boundary),
        administrator only -- richer than LibraryCategory, which stays lean
        for the many navigation callers (root folder pickers, *Arr import,
        the sidebar) that never need any of this.
      required: [id, media_type, name, priority_rank, monitor_discovered]
      properties:
        id: { type: integer, format: int64 }
        media_type: { type: string, example: "music" }
        name: { type: string }
        priority_rank:
          type: integer
          format: int64
          description: Lower is more important (ADR-36's composite acquisition priority).
        quality_profile_id: { type: integer, format: int64 }
        language_profile_id: { type: integer, format: int64 }
        monitor_discovered:
          type: string
          enum: [monitored, unmonitored, none]
          description: >-
            What a scan does with an album it finds on disk that nobody
            asked for (section 19.6, todo 4.4).

    CategoryWrite:
      type: object
      required: [name, priority_rank]
      properties:
        name: { type: string, minLength: 1 }
        priority_rank: { type: integer, format: int64, minimum: 0 }
        quality_profile_id:
          type: integer
          format: int64
          description: Absent or null clears it -- no default profile.
        language_profile_id:
          type: integer
          format: int64
          description: Absent or null clears it -- no default profile.
        monitor_discovered:
          type: string
          enum: [monitored, unmonitored, none]
          default: monitored

    Library:
      type: object
      description: >-
        A category as a navigation root (ADR-54): its declared entity levels
        replace the old flat works/files pair -- see LibraryLevel.
      required: [id, media_type, name, levels]
      properties:
        id: { type: integer, format: int64 }
        media_type: { type: string, example: "music" }
        name: { type: string }
        levels:
          type: array
          items: { $ref: "#/components/schemas/LibraryLevel" }
        last_level:
          type: string
          description: >-
            The level key the caller last visited in this library
            (user_preference), absent if never visited.

    LibraryLevel:
      type: object
      description: >-
        One browsable entity level a media type declares (ADR-23's
        NavigationLevels extension point). Core never learns what an album
        or a season is -- key, label and entity are entirely the media
        type's own vocabulary.
      required: [key, label, entity, default_sort]
      properties:
        key:
          type: string
          description: Stable identifier used in the URL and in GET /libraries/{id}/{level}.
          example: "albums"
        label:
          type: string
          example: "Albums"
        entity:
          type: string
          enum: [work, work_part, person, organisation]
        default_sort:
          type: string
          example: "title"
        count:
          type: integer
          description: >-
            From the counter table (section 21.12), never a live COUNT.
            Absent when this entity has no counter yet.

    LibraryLevelItem:
      type: object
      description: >-
        One row of one navigation level, whatever entity it wraps (a work, a
        work_part, a person). Deliberately generic (see listLibraryLevel).
      required: [id, title]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        subtitle:
          type: string
          description: A secondary line -- an artist credit, an album title, whatever the level has.
        year: { type: integer }
        monitored: { type: boolean }
        work_id:
          type: integer
          format: int64
          description: >-
            The work (album) this row's own cover art comes from -- set on a
            Tracks-level row (the track's own parent album), absent on an
            Albums row (its own id already is the work id) or an Artists row
            (see GET /people/{id}/artwork instead).

    LibraryLevelPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LibraryLevelItem" }
        next_cursor:
          type: string
          description: Empty on the last page.

    ImportList:
      type: object
      description: >-
        A per-library *Arr-shaped import list (ADR-38, todo 4.16).
        Scaffolding only -- nothing syncs against it yet (stage 12).
      required: [id, category_id, name, type, cadence_hours, monitor, exclusions, enabled]
      properties:
        id: { type: integer, format: int64 }
        category_id: { type: integer, format: int64 }
        name: { type: string }
        type:
          type: string
          description: >-
            Free-form for now -- no music-specific list type is baked in
            ahead of a real provider integration to name one against.
        url: { type: string }
        cadence_hours: { type: integer }
        monitor: { type: boolean }
        quality_profile_id: { type: integer, format: int64 }
        exclusions:
          type: string
          description: Free text; nothing reads this yet, since there is no sync job to enforce it.
        enabled: { type: boolean }

    ImportListWrite:
      type: object
      required: [name, type, cadence_hours]
      properties:
        name: { type: string, minLength: 1 }
        type: { type: string, minLength: 1 }
        url: { type: string }
        cadence_hours: { type: integer, minimum: 1 }
        monitor: { type: boolean, default: true }
        quality_profile_id: { type: integer, format: int64 }
        exclusions: { type: string }
        enabled: { type: boolean, default: true }

    GateResult:
      type: object
      description: A hard requirement, evaluated before any comparison (ADR-40 stage 1).
      required: [gate, passed, wanted, got]
      properties:
        gate: { type: string, example: "audio_language" }
        passed: { type: boolean }
        wanted: { type: string, example: "any of [en de]" }
        got: { type: string, example: "ru" }

    TierValue:
      type: object
      description: >-
        One compare-list dimension's position (ADR-40 stage 2). Equal rank
        between two candidates means this dimension did not decide.
      required: [dimension, rank, label, detail]
      properties:
        dimension: { type: string, example: "video_codec" }
        rank: { type: integer, description: Lower is better. }
        label: { type: string, example: "hevc" }
        detail: { type: string }

    ScoreComponent:
      type: object
      description: One additive-stage contribution (ADR-40 stage 3). Breaks ties only.
      required: [rule, label, delta]
      properties:
        rule: { type: string, example: "preferred-groups" }
        label: { type: string }
        delta: { type: number }

    Rejection:
      type: object
      description: One failed gate, as data rather than a formatted string (ADR-10).
      required: [rule, field, wanted, got]
      properties:
        rule: { type: string }
        field: { type: string }
        wanted: { type: string }
        got: { type: string }

    Deferral:
      type: object
      description: A reason this candidate is not actionable yet.
      required: [reason]
      properties:
        reason: { type: string }

    Decision:
      type: object
      description: >-
        ADR-10: reasons are the result, never a side channel. score is derived
        from components, never computed separately, so the explanation and the
        decision cannot drift apart.
      required: [outcome, gates, quality, components, rejections, deferrals, score]
      properties:
        outcome: { type: string, enum: [ACCEPT, REJECT, DEFER] }
        gates:
          type: array
          items: { $ref: "#/components/schemas/GateResult" }
        quality:
          type: array
          items: { $ref: "#/components/schemas/TierValue" }
        components:
          type: array
          items: { $ref: "#/components/schemas/ScoreComponent" }
        rejections:
          type: array
          items: { $ref: "#/components/schemas/Rejection" }
        deferrals:
          type: array
          items: { $ref: "#/components/schemas/Deferral" }
        score:
          type: number
          description: Decision.Score() -- the sum of components.

    ParsedTitle:
      type: object
      description: internal/identify/parse's own reading of the pasted title, shown so a simulation is not a black box.
      required: [confidence]
      properties:
        artist: { type: string }
        album: { type: string }
        year: { type: integer }
        format: { type: string, example: "flac" }
        bitrate_kbps: { type: integer }
        source: { type: string }
        edition: { type: string }
        release_group: { type: string }
        confidence:
          type: number
          description: Never 1.0 -- a tag says what a tagger believed, a parse says what a name implies.
        unparsed:
          type: array
          items: { type: string }
          description: Trailing tokens nothing claimed (ADR-18's corpus-growth signal).

    ScoreSimulation:
      type: object
      required: [parsed, decision]
      properties:
        parsed: { $ref: "#/components/schemas/ParsedTitle" }
        decision: { $ref: "#/components/schemas/Decision" }

# Authenticated by default.
security:
  - session: []
  - apiKey: []
