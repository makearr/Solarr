  /categories:
    get:
      operationId: listCategories
      tags: [library]
      summary: Every category the caller may read (ADR-27).
      description: >-
        Unpaginated: category counts are small (dozens, not thousands), so a
        plain array is correct and simpler than cursor machinery. In the
        caller's snapshot order (Invariant 36).
      responses:
        "200":
          description: The categories.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LibraryCategory" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createCategory
      tags: [settings]
      summary: Add a category. Administrator only.
      description: >-
        Grants every administrator manage on the new category (ADR-27).
        priority_rank orders categories for ADR-36's composite acquisition
        priority; omitted, it places the new category after every existing
        one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_type, name]
              properties:
                media_type: { type: string }
                name: { type: string, minLength: 1 }
                priority_rank: { type: integer, format: int64 }
                kind:
                  type: string
                  description: >-
                    One of the media type's kinds (MediaTypeInfo.kinds); omitted takes its first. The kind's quality
                    profiles and language profile become the library's own.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryCategory" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getCategory
      tags: [settings]
      summary: >-
        A category's full settings-side detail. Administrator only --
        richer than LibraryCategory (`GET /categories`), which stays lean
        for the many navigation callers that never need any of this.
      responses:
        "200":
          description: The category.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategorySettings" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateCategory
      tags: [settings]
      summary: >-
        Rename a category, reprioritise it, or change its default quality/
        language profile or monitor-discovered policy. Administrator only.
        `media_type` never changes -- it is identity, not policy.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryWrite" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategorySettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteCategory
      tags: [settings]
      summary: Remove a category. Administrator only.
      description: >-
        Refused, naming what still uses it, while any root folder is
        attached, any user holds explicit access, or a discovery job
        references it (Invariant 41).
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          $ref: "#/components/responses/Problem"
          description: Still referenced; the detail names what by.

  /categories/{id}/quality:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getLibraryQuality
      tags: [settings]
      summary: A library's quality profiles in priority order, its cutoff and target. Administrator only.
      responses:
        "200":
          description: The library's quality.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryQuality" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: setLibraryQuality
      tags: [settings]
      summary: Save a library's quality. Administrator only.
      description: >-
        The profiles the library accepts, earlier preferred and later ones
        fallbacks (2026-09-24); the cutoff is one of them; the target is the
        one exact quality aimed for, its bitrate a range of plus or minus
        tolerance_pct. Every problem is reported at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryQualityWrite" }
      responses:
        "200":
          description: The saved quality.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryQuality" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

